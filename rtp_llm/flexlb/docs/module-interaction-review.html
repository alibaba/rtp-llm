<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FlexLB 模块与类层次</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #263f51;
        background: #f4f7f9;
        font-family: Inter, "PingFang SC", system-ui, sans-serif;
      }
      header {
        padding: 23px 28px 16px;
        background: #fff;
        border-bottom: 1px solid #dce5eb;
      }
      h1 {
        font-size: 26px;
        margin: 0 0 9px;
        letter-spacing: -0.5px;
      }
      header p {
        font-size: 12px;
        color: #78909f;
        margin: 0;
        line-height: 1.7;
      }
      button,
      input,
      label,
      a {
        font:
          13px Inter,
          "PingFang SC",
          sans-serif;
      }
      button {
        cursor: pointer;
        color: #365a70;
        border: 1px solid #c4d3de;
        border-radius: 6px;
        padding: 8px 12px;
        background: #fff;
      }
      button:hover {
        background: #edf4f8;
      }
      button.active {
        background: #244f67;
        border-color: #244f67;
        color: white;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #2186a5;
        outline-offset: 2px;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #ffffffed;
        backdrop-filter: blur(8px);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 24px;
        border-bottom: 1px solid #dce5eb;
      }
      .space {
        flex: 1;
      }
      input[type="search"] {
        width: 270px;
        padding: 9px 11px;
        border: 1px solid #c4d3de;
        border-radius: 6px;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        color: #6c8190;
      }
      .legend {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        padding: 15px 27px;
        font-size: 12px;
        color: #718796;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .legend i {
        display: inline-block;
        width: 27px;
        border-top: 2px solid #71899c;
      }
      .legend .inherit {
        border-color: #8567a2;
      }
      .legend .implements {
        border-color: #8567a2;
        border-top-style: dashed;
      }
      .legend .return {
        border-color: #4c8e7e;
        border-top-style: dashed;
      }
      .legend .callback {
        border-color: #2788a8;
        border-top-style: dashed;
      }
      .canvas {
        overflow: auto;
        margin: 0 20px 26px;
        padding: 12px;
        background: white;
        border: 1px solid #d7e2e9;
        border-radius: 12px;
      }
      #diagram {
        display: block;
        width: 100%;
        height: auto;
        min-width: 1500px;
      }
      .layer-bg {
        fill: #f4f7f9;
        stroke: none;
      }
      .layer:nth-child(even) .layer-bg {
        fill: #edf3f6;
      }
      .layer-name {
        font:
          600 17px Inter,
          "PingFang SC",
          sans-serif;
        fill: #466274;
      }
      .module-bg {
        fill: #fff;
        stroke: #cbdbe5;
        stroke-width: 1.2;
      }
      .module-name {
        font:
          600 18px Inter,
          sans-serif;
        fill: #294e63;
      }
      .card {
        fill: #f9fbfc;
        stroke: #d8e3eb;
        stroke-width: 1;
      }
      .node.interface .card {
        fill: #f7f2fb;
        stroke: #d5c5e1;
      }
      .node.abstract .card {
        fill: #edf5f9;
        stroke: #b9d1df;
      }
      .node.record .card {
        fill: #f0f7f4;
        stroke: #c0d7cd;
      }
      .class-name {
        font:
          600 12.6px "IBM Plex Mono",
          ui-monospace,
          Menlo,
          monospace;
        fill: #2c4e63;
      }
      .stereotype {
        font:
          9px ui-monospace,
          monospace;
        fill: #7b7991;
      }
      .node {
        cursor: pointer;
      }
      .node:hover .card,
      .node:focus .card {
        stroke: #3586a5;
        stroke-width: 1.8;
      }
      .node.selected .card {
        stroke: #187b9b;
        stroke-width: 2.3;
        fill: #eaf5fa;
      }
      .node.dim {
        opacity: 0.65;
      }
      .edge {
        cursor: pointer;
      }
      .edge path {
        stroke-linejoin: round;
      }
      .edge.active path {
        stroke-width: 1.7;
      }
      .edge.dim {
        opacity: 0.022;
      }
      .edge-label {
        display: none;
        font:
          10px ui-monospace,
          monospace;
        fill: #526e80;
        paint-order: stroke;
        stroke: white;
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      #diagram.labels .edge.active .edge-label {
        display: block;
      }
      .edge:hover path {
        stroke-width: 2.8;
      }
      .selection {
        display: none;
        position: fixed;
        right: 23px;
        bottom: 17px;
        z-index: 8;
        width: 490px;
        max-width: 90vw;
        max-height: 52vh;
        overflow: auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #b9d0df;
        border-radius: 10px;
        box-shadow: 0 8px 36px #204b6a25;
      }
      .selection.open {
        display: block;
      }
      .selection h2 {
        font:
          600 16px ui-monospace,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
        margin: 0 46px 10px 0;
      }
      .selection p {
        font-size: 12px;
        color: #748b9a;
        line-height: 1.8;
      }
      .selection ul {
        list-style: none;
        padding: 0;
        margin: 10px 0;
      }
      .selection li {
        border-bottom: 1px solid #ecf1f5;
        padding: 9px 0;
        font-size: 12px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .selection code {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        color: #546f82;
      }
      .selection button.close {
        position: absolute;
        right: 10px;
        top: 10px;
        border: 0;
        padding: 4px 9px;
      }
      .selection button.neighbor {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        color: #216d8c;
      }
      a {
        color: #216d8c;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      #status {
        font-size: 12px;
        color: #76909f;
      }
      .foot {
        font-size: 12px;
        color: #728b9b;
        padding: 0 29px 22px;
        line-height: 1.9;
      }
      .hierarchy-count {
        font-size: 12px;
        color: #708897;
      }
      @media (max-width: 950px) {
        header {
          padding: 18px;
        }
        .toolbar {
          padding: 10px;
        }
        .legend {
          padding: 12px;
          gap: 12px;
        }
        .space {
          display: none;
        }
        .canvas {
          margin: 0 10px 20px;
        }
        input[type="search"] {
          width: 230px;
        }
      }
      @media print {
        .toolbar,
        .selection {
          display: none;
        }
        .canvas {
          overflow: visible;
          border: 0;
          padding: 0;
          margin: 0;
        }
        #diagram {
          min-width: 0;
        }
        .legend {
          padding: 7px;
        }
        .foot {
          padding: 10px;
        }
        header {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>FlexLB 模块与类层次</h1>
      <p id="meta"></p>
    </header>
    <nav class="toolbar" aria-label="关系筛选">
      <button class="mode active" data-mode="hierarchy">继承与接口实现</button
      ><button class="mode" data-mode="association">字段关联</button
      ><button class="mode" data-mode="cross">跨模块关系</button
      ><button class="mode" data-mode="all">全部关系</button
      ><label><input id="labels" type="checkbox" />关系名</label
      ><span class="space"></span
      ><input
        type="search"
        id="search"
        list="classList"
        placeholder="定位类或接口"
        aria-label="定位类或接口"
      /><datalist id="classList"></datalist><button id="locate">定位</button
      ><span id="status" role="status"></span><button id="reset">复位</button
      ><button id="export">导出 SVG</button>
    </nav>
    <div class="legend">
      <span><i class="inherit"></i>继承 → 父类</span
      ><span><i class="implements"></i>实现 → 接口</span
      ><span><i></i>字段引用 → 被引用类</span
      ><span><i class="return"></i>返回 → 返回类型</span
      ><span><i class="callback"></i>事件回调 → 接收实现</span
      ><span class="hierarchy-count" id="count"></span>
    </div>

    <script>
      "use strict";
      const data = JSON.parse(document.getElementById("data").textContent),
        $ = (id) => document.getElementById(id);
      let selected = null,
        mode = "hierarchy";
      const kindNames = {
        extends: "继承",
        implements: "实现接口",
        field: "字段引用",
        return: "返回类型",
        callback: "运行时回调",
      };
      function link(p, line, label) {
        const a = document.createElement("a");
        a.href = "../" + p + "#L" + line;
        a.textContent = label || p + ":" + line;
        return a;
      }
      function apply() {
        let count = 0;
        for (const e of data.edges) {
          const on = selected
            ? e.a === selected || e.b === selected
            : mode === "all" ||
              (mode === "hierarchy" &&
                ["extends", "implements"].includes(e.kind)) ||
              (mode === "association" && e.kind === "field") ||
              (mode === "cross" && e.cross);
          $(e.id).classList.toggle("dim", !on);
          $(e.id).classList.toggle("active", on);
          if (on) count++;
        }
        for (const n of Object.keys(data.nodes)) {
          $("n-" + n).classList.toggle("selected", n === selected);
          $("n-" + n).classList.remove("dim");
        }
        $("count").textContent = count + " 条突出关系";
        document
          .querySelectorAll(".mode")
          .forEach((b) =>
            b.classList.toggle("active", !selected && b.dataset.mode === mode),
          );
      }
      function showNode(name, scroll = false) {
        const n = data.nodes[name];
        if (!n) return;
        selected = name;
        apply();
        $("selectedName").textContent = name;
        $("selectedType").textContent = "flexlb-" + n.module + " · " + n.kind;
        $("evidence").replaceChildren(link(n.path, n.line));
        const ul = $("related");
        ul.replaceChildren();
        for (const e of data.edges.filter(
          (e) => e.a === name || e.b === name,
        )) {
          const li = document.createElement("li"),
            button = document.createElement("button");
          button.className = "neighbor";
          button.textContent = e.a + " → " + e.b;
          button.onclick = () => showNode(e.a === name ? e.b : e.a, true);
          li.append(
            button,
            document.createElement("br"),
            document.createTextNode(
              kindNames[e.kind] + " · " + e.labels.join(", "),
            ),
            document.createElement("br"),
          );
          if (e.calls?.length) {
            const c = document.createElement("code");
            c.textContent = e.calls.join(", ");
            li.append(c, document.createElement("br"));
          }
          for (const p of e.evidence)
            li.append(
              link(p.path, p.line, "L" + p.line),
              document.createTextNode(" "),
            );
          ul.append(li);
        }
        $("selection").classList.add("open");
        $("status").textContent = "";
        if (scroll)
          $("n-" + name).scrollIntoView({
            behavior: "smooth",
            block: "center",
            inline: "center",
          });
      }
      function showEdge(e) {
        selected = null;
        for (const item of data.edges) {
          $(item.id).classList.toggle("dim", item.id !== e.id);
          $(item.id).classList.toggle("active", item.id === e.id);
        }
        $("selectedName").textContent = e.a + " → " + e.b;
        $("selectedType").textContent =
          kindNames[e.kind] + " · " + e.labels.join(", ");
        $("related").replaceChildren();
        $("evidence").replaceChildren();
        for (const p of e.evidence) {
          const row = document.createElement("p");
          row.append(link(p.path, p.line));
          $("evidence").append(row);
        }
        if (e.calls?.length) {
          const p = document.createElement("p");
          p.textContent = e.calls.join(", ");
          $("evidence").append(p);
        }
        $("selection").classList.add("open");
      }
      for (const n of Object.keys(data.nodes).sort()) {
        const el = $("n-" + n);
        el.onclick = () => showNode(n);
        el.onkeydown = (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            showNode(n);
          }
        };
        const o = document.createElement("option");
        o.value = n;
        $("classList").append(o);
      }
      for (const e of data.edges) $(e.id).onclick = () => showEdge(e);
      for (const b of document.querySelectorAll(".mode"))
        b.onclick = () => {
          selected = null;
          mode = b.dataset.mode;
          $("selection").classList.remove("open");
          apply();
        };
      function locate() {
        const q = $("search").value.trim().toLowerCase();
        if (!q) return;
        const matches = Object.keys(data.nodes).filter((n) =>
          n.toLowerCase().includes(q),
        );
        const exact = matches.find((n) => n.toLowerCase() === q);
        if (exact || matches.length === 1) showNode(exact || matches[0], true);
        else
          $("status").textContent = matches.length
            ? matches.length + " 个匹配，请选完整类名"
            : "未找到主图类型";
      }
      $("locate").onclick = locate;
      $("search").onchange = locate;
      $("search").onkeydown = (e) => {
        if (e.key === "Enter") locate();
      };
      $("close").onclick = () => $("selection").classList.remove("open");
      $("reset").onclick = () => {
        selected = null;
        mode = "hierarchy";
        $("selection").classList.remove("open");
        apply();
      };
      $("labels").onchange = () =>
        $("diagram").classList.toggle("labels", $("labels").checked);
      $("export").onclick = () => {
        const svg = $("diagram").cloneNode(true),
          style = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "style",
          );
        style.textContent = document.querySelector("style").textContent;
        svg.prepend(style);
        const url = URL.createObjectURL(
            new Blob([new XMLSerializer().serializeToString(svg)], {
              type: "image/svg+xml;charset=utf-8",
            }),
          ),
          a = document.createElement("a");
        a.href = url;
        a.download = "flexlb-module-class-hierarchy.svg";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      $("meta").textContent =
        data.date.replace("T", " ") +
        " · 7 个模块 · " +
        Object.keys(data.nodes).length +
        " 个核心类型 · " +
        data.edges.length +
        " 条源码关系";
      apply();
    </script>
