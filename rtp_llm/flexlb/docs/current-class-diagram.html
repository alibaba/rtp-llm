<html lang="zh-CN">

    <title>FlexLB 当前类关系</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", system-ui, sans-serif;
        color: #192c3d;
        background: #f3f6f8;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 25px 32px 17px;
        background: white;
        border-bottom: 1px solid #dbe4ea;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.7px;
        margin: 0 0 9px;
      }
      p {
        margin: 6px 0;
        line-height: 1.7;
        color: #536677;
        font-size: 14px;
      }
      .meta {
        font-size: 12px;
        color: #708291;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 9px;
        padding: 13px 24px;
        background: #fff;
        border-bottom: 1px solid #dbe4ea;
        position: sticky;
        top: 0;
        z-index: 5;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 1px solid #ccd8e0;
        background: #fff;
        color: #29485e;
        border-radius: 7px;
        padding: 8px 13px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #eaf2f7;
      }
      button.active {
        background: #193c50;
        color: #fff;
        border-color: #193c50;
      }
      input[type="search"] {
        width: 310px;
        border: 1px solid #b7c8d3;
        padding: 9px 12px;
        border-radius: 7px;
        font-size: 13px;
      }
      label {
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 5px;
        color: #536677;
      }
      .spacer {
        flex: 1;
      }
      #searchStatus {
        font-size: 12px;
        color: #60798c;
      }
      main {
        padding: 20px 24px 32px;
      }
      .canvas-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 12px;
      }
      .canvas-head h2 {
        font-size: 17px;
        margin: 0;
      }
      .legend {
        display: flex;
        gap: 17px;
        font-size: 12px;
        color: #5d7281;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .legend i {
        width: 24px;
        border-top: 2px solid #738b97;
        display: inline-block;
      }
      .legend .inherit {
        border-color: #906aaf;
      }
      .legend .returns {
        border-top-style: dashed;
        border-color: #238273;
      }
      .legend .calls {
        border-top-style: dashed;
        border-color: #3778c5;
      }
      #viewport {
        height: 720px;
        min-height: 450px;
        background-color: #fff;
        background-image: radial-gradient(#dbe6ec 0.75px, transparent 0.75px);
        background-size: 20px 20px;
        border: 1px solid #d4e0e7;
        border-radius: 12px;
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        position: relative;
      }
      #viewport.dragging {
        cursor: grabbing;
      }
      #diagram {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
      }
      .edge {
        fill: none;
        stroke-width: 1.4;
        opacity: 0.82;
      }
      .edge.field {
        stroke: #8195a2;
      }
      .edge.extends,
      .edge.implements {
        stroke: #906aaf;
        stroke-width: 1.8;
      }
      .edge.implements {
        stroke-dasharray: 5 3;
      }
      .edge.return {
        stroke: #2c8f7b;
        stroke-dasharray: 5 4;
      }
      .edge.call {
        stroke: #3778c5;
        stroke-dasharray: 3 3;
      }
      .edge-label {
        font:
          11px Inter,
          "PingFang SC",
          sans-serif;
        fill: #566b7a;
        paint-order: stroke;
        stroke: white;
        stroke-width: 5;
        stroke-linejoin: round;
      }
      .node {
        cursor: pointer;
        outline: none;
      }
      .node rect.card {
        fill: white;
        stroke: #c6d7e1;
        stroke-width: 1.2;
        rx: 8;
      }
      .node:hover rect.card,
      .node:focus rect.card {
        stroke: #285e7e;
        stroke-width: 2;
      }
      .node.selected rect.card {
        fill: #eef6fa;
        stroke: #246584;
        stroke-width: 2;
      }
      .node.interface rect.card {
        stroke: #c7b6d7;
        fill: #fdfbff;
      }
      .node .name {
        font:
          600 14px "IBM Plex Mono",
          ui-monospace,
          Menlo,
          monospace;
        fill: #19384d;
      }
      .node .summary {
        font:
          12px "PingFang SC",
          sans-serif;
        fill: #536a7a;
      }
      .node .type {
        font:
          10px ui-monospace,
          Menlo,
          monospace;
        fill: #8495a1;
      }
      .node .stripe {
        fill: #769cac;
      }
      .node.interface .stripe {
        fill: #a482bd;
      }
      .node.record .stripe {
        fill: #76a596;
      }
      .node.selected .stripe {
        fill: #246584;
      }
      .hint {
        position: absolute;
        bottom: 13px;
        left: 15px;
        font-size: 12px;
        color: #738795;
        pointer-events: none;
        background: #ffffffed;
        padding: 5px 8px;
        border-radius: 5px;
      }
      .zoom {
        position: absolute;
        bottom: 13px;
        right: 15px;
        display: flex;
        gap: 6px;
        align-items: center;
        background: white;
        padding: 4px;
        border-radius: 7px;
        border: 1px solid #dbe4ea;
      }
      .zoom button {
        border: 0;
        padding: 4px 9px;
        font-size: 17px;
      }
      .zoom output {
        min-width: 44px;
        text-align: center;
        font-size: 12px;
      }
      .details {
        margin-top: 22px;
        display: grid;
        grid-template-columns: 1fr 1.35fr 1fr;
        gap: 24px;
        background: #fff;
        border: 1px solid #d4e0e7;
        border-radius: 12px;
        padding: 24px;
      }
      .details h2 {
        font-size: 19px;
        margin: 0 0 8px;
        overflow-wrap: anywhere;
      }
      .details h3 {
        font-size: 14px;
        margin: 0 0 12px;
        color: #29485e;
      }
      .details p {
        font-size: 13px;
      }
      .source {
        font:
          11px/1.7 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
        color: #506779;
      }
      a {
        color: #246584;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      ul {
        padding: 0;
        list-style: none;
        margin: 10px 0;
      }
      li {
        padding: 7px 0;
        border-bottom: 1px solid #edf2f5;
        font-size: 12px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }
      li:last-child {
        border: 0;
      }
      code {
        font:
          11px/1.7 "IBM Plex Mono",
          ui-monospace,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .relation {
        border: 0;
        padding: 0;
        background: none;
        text-align: left;
        font:
          12px/1.7 ui-monospace,
          Menlo,
          monospace;
        color: #246584;
      }
      .relation:hover {
        background: none;
        text-decoration: underline;
      }
      .relation-label {
        color: #738795;
        font-size: 11px;
      }
      .member-type {
        color: #70838f;
        font-size: 12px;
      }
      .catalog {
        margin-top: 23px;
      }
      summary {
        cursor: pointer;
        color: #29485e;
        font-size: 14px;
      }
      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 5px 16px;
        padding: 12px 0;
      }
      .catalog-grid button {
        text-align: left;
        font:
          12px ui-monospace,
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      .scope {
        font-size: 12px;
        margin-top: 15px;
      }
      .empty {
        color: #738795;
        font-size: 12px;
      }
      @media (max-width: 950px) {
        header {
          padding: 20px;
        }
        main {
          padding: 14px;
        }
        .toolbar {
          padding: 10px 14px;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .legend {
          flex-wrap: wrap;
          gap: 9px;
        }
        #viewport {
          height: 600px;
        }
        .canvas-head {
          align-items: flex-start;
          flex-direction: column;
        }
        input[type="search"] {
          width: 260px;
        }
      }
      @media print {
        .toolbar,
        .zoom,
        .hint,
        .catalog {
          display: none;
        }
        #viewport {
          height: 700px;
          border: 0;
        }
        .details {
          break-inside: avoid;
        }
        header,
        main {
          padding: 10px;
        }
        .legend {
          display: none;
        }
      }
    </style>

  <body>
    <header>
      <h1>FlexLB 当前类关系</h1>
      <p>
        从请求入口追踪调度、角色选择、资源登记和清理。点击类名查看直接关联，源码成员和关系依据在图下方。
      </p>
      <p class="meta" id="meta"></p>
    </header>
    <nav class="toolbar" aria-label="图表控制">
      <input
        type="search"
        id="search"
        list="classList"
        placeholder="搜索类名或职责"
        aria-label="搜索类名或职责"
      /><datalist id="classList"></datalist
      ><button id="searchButton">定位类</button
      ><span id="searchStatus" role="status"></span>
      <div class="spacer"></div>
      <button id="mainButton">主链总览</button
      ><button id="allButton">全部关系</button
      ><button id="backButton">返回上次</button
      ><label><input type="checkbox" id="labels" checked />关系标签</label
      ><button id="fitButton">适合窗口</button
      ><button id="downloadButton">导出 SVG</button>
    </nav>
    <main>
      <div class="canvas-head">
        <h2 id="viewTitle"></h2>
        <div class="legend">
          <span><i></i>字段关联 →</span
          ><span><i class="inherit"></i>继承 / 实现 ▷</span
          ><span><i class="returns"></i>返回类型 →</span
          ><span><i class="calls"></i>调用 →</span>
        </div>
      </div>
      <div id="viewport">
        <svg
          id="diagram"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="FlexLB 类关系图"
          role="img"
        >
          <defs>
            <marker
              id="arrow"
              viewBox="0 0 10 10"
              refX="9"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path
                d="M1 1 L9 5 L1 9"
                fill="none"
                stroke="#738b97"
                stroke-width="1.5"
              />
            </marker>
            <marker
              id="triangle"
              viewBox="0 0 12 12"
              refX="11"
              refY="6"
              markerWidth="11"
              markerHeight="11"
              orient="auto"
            >
              <path
                d="M1 1 L11 6 L1 11 Z"
                fill="white"
                stroke="#906aaf"
                stroke-width="1.1"
              />
            </marker>
          </defs>
          <g id="stage"></g>
        </svg>
        <div class="hint">拖动画布 · 滚轮缩放 · 点击类查看直接关系</div>
        <div class="zoom">
          <button id="minus" aria-label="缩小">−</button
          ><output id="scale"></output
          ><button id="plus" aria-label="放大">+</button>
        </div>
      </div>
      <section class="details" aria-label="选中类详情">
        <div>
          <h2 id="selectedName"></h2>
          <p id="selectedSummary"></p>
          <p class="source" id="source"></p>
          <p id="selectedDoc"></p>
        </div>
        <div>
          <h3>成员与协作接口</h3>
          <div id="members"></div>
        </div>
        <div>
          <h3>直接关系与源码依据</h3>
          <ul id="relations"></ul>
        </div>
      </section>
      <details class="catalog">
        <summary id="catalogTitle"></summary>
        <div class="catalog-grid" id="catalog"></div>
      </details>
      <p class="scope" id="scope"></p>
      <p class="scope">
        实线表示真实字段引用。资源所有权应结合成员类型、登记句柄和清理方法阅读。方法返回类型采用虚线。继承与接口实现使用空心三角，箭头指向父类型。图中保留双向关联。
      </p>
    </main>

592],[701.3952,210.3048],[778.32,235.0512],[839.808,254.84688]],"label":[745.4879999999999,206.496]}]},"FlexlbGrpcServer":{"w":1059.98,"h":62.0,"nodes":{"ApplicationLifecycle":[128.0,31.0,256.0,62.0],"FlexlbGrpcServer":[516.0,31.0,256.0,62.0],"FlexlbServiceImpl":[931.97,31.0,256.0,62.0]},"edges":[{"id":"e183","points":[[256.1904,30.999600000000004],[295.092,30.999600000000004],[338.0472,30.999600000000004],[377.5896,30.999600000000004]],"label":[321.9984,25.500240000000005]},{"id":"e188","points":[[644.0256,30.999600000000004],[691.4016,30.999600000000004],[745.4159999999999,30.999600000000004],[793.656,30.999600000000004]],"label":[724.0319999999999,25.500240000000005]}]}},"date":"2026-11-13T17:30:13+08:00","scope":"核心调度、选路、请求状态和 Endpoint 协作类。Cache / Worker 状态同步、配置、监控与通用工具实现沿用独立文档。ServerStatus 作为路由输出数据保留。"}</script>
    <script>
      "use strict";
      const data = JSON.parse(document.getElementById("graphData").textContent);
      const $ = (id) => document.getElementById(id),
        ns = "http://www.w3.org/2000/svg";
      const nodes = data.nodes,
        edges = new Map(data.edges.map((e) => [e.id, e]));
      let view = "RequestRouteSelector",
        selected = "RequestRouteSelector",
        zoom = 1,
        offsetX = 0,
        offsetY = 0,
        drag = null,
        history = [];
      function el(name, attrs = {}, text) {
        const n = document.createElementNS(ns, name);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function wrapName(name) {
        if (name.length <= 29) return [name];
        let split = name.lastIndexOf(".", 30);
        if (split < 9) {
          const positions = [...name.matchAll(/[a-z](?=[A-Z])/g)]
            .map((m) => m.index + 1)
            .filter((i) => i < 30 && i > 9);
          split = positions.at(-1) || 28;
        }
        return [name.slice(0, split), name.slice(split)];
      }
      function render() {
        const layout = data.layouts[view],
          stage = $("stage");
        stage.replaceChildren();
        const title =
          view === "all"
            ? "全部核心类关系"
            : view === "main"
              ? "请求主链总览"
              : view + " 的直接关系";
        $("viewTitle").textContent =
          title + " · " + Object.keys(layout.nodes).length + " 个类";
        $("mainButton").classList.toggle("active", view === "main");
        $("allButton").classList.toggle("active", view === "all");
        for (const route of layout.edges) {
          const e = edges.get(route.id),
            p = route.points;
          if (!p.length) continue;
          let d = "M " + p[0].join(" ");
          for (let i = 1; i + 2 < p.length; i += 3)
            d +=
              " C " +
              p
                .slice(i, i + 3)
                .map((v) => v.join(" "))
                .join(" ");
          const path = el("path", {
            d,
            class: "edge " + e.kind,
            "marker-end":
              "url(#" +
              (["extends", "implements"].includes(e.kind)
                ? "triangle"
                : "arrow") +
              ")",
          });
          path.append(el("title", {}, e.a + " → " + e.b + "\n" + e.label));
          stage.append(path);
          if ($("labels").checked) {
            stage.append(
              el(
                "text",
                {
                  x: route.label[0],
                  y: route.label[1] - 3,
                  "text-anchor": "middle",
                  class: "edge-label",
                },
                e.label,
              ),
            );
          }
        }
        for (const [id, p] of Object.entries(layout.nodes)) {
          const n = nodes[id],
            [x, y, w, h] = p,
            g = el("g", {
              class: "node " + n.kind + (id === selected ? " selected" : ""),
              transform: "translate(" + (x - w / 2) + " " + (y - h / 2) + ")",
              tabindex: 0,
              role: "button",
              "aria-label": id + "，" + n.summary,
              "data-id": id,
            });
          g.append(
            el("title", {}, id + "\n" + n.summary + "\n点击查看直接关系"),
            el("rect", { class: "card", width: w, height: h }),
            el("rect", {
              class: "stripe",
              x: 0,
              y: 9,
              width: 3,
              height: h - 18,
              rx: 1.5,
            }),
          );
          const lines = wrapName(id);
          g.append(el("text", { x: 13, y: 14, class: "type" }, n.kind));
          lines.forEach((line, i) =>
            g.append(
              el("text", { x: 13, y: 31 + i * 15, class: "name" }, line),
            ),
          );
          if (lines.length === 1)
            g.append(el("text", { x: 13, y: 51, class: "summary" }, n.summary));
          g.addEventListener("click", () => {
            if (!drag?.moved) navigate(id);
          });
          g.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              navigate(id);
            }
          });
          stage.append(g);
        }
        updateTransform();
        showDetails(selected);
      }
      function updateTransform() {
        $("stage").setAttribute(
          "transform",
          `translate(${offsetX} ${offsetY}) scale(${zoom})`,
        );
        $("scale").textContent = Math.round(zoom * 100) + "%";
      }
      function fit() {
        const l = data.layouts[view],
          r = $("viewport").getBoundingClientRect();
        zoom = Math.min(1.15, (r.width - 36) / l.w, (r.height - 42) / l.h);
        offsetX = (r.width - l.w * zoom) / 2;
        offsetY = (r.height - l.h * zoom) / 2;
        updateTransform();
      }
      function navigate(id, push = true) {
        if (!data.layouts[id]) return;
        if (push) history.push({ view, selected });
        view = id;
        if (nodes[id]) selected = id;
        render();
        fit();
        $("searchStatus").textContent = "";
        $("backButton").disabled = !history.length;
      }
      function sourceLink(path, line, label) {
        const a = document.createElement("a");
        a.href = "../" + path + "#L" + line;
        a.textContent = label || path + ":" + line;
        a.title = path + ":" + line;
        return a;
      }
      function showDetails(id) {
        const n = nodes[id];
        $("selectedName").textContent = id;
        $("selectedSummary").textContent = n.summary;
        $("selectedDoc").textContent = n.doc;
        $("source").replaceChildren(sourceLink(n.path, n.line));
        const members = $("members");
        members.replaceChildren();
        for (const [heading, entries] of [
          ["字段", n.fields],
          ["接口", n.methods],
        ]) {
          const h = document.createElement("p");
          h.className = "member-type";
          h.textContent = heading + " · " + entries.length;
          members.append(h);
          if (!entries.length) {
            const p = document.createElement("p");
            p.className = "empty";
            p.textContent = "当前类型未声明" + heading;
            members.append(p);
            continue;
          }
          const ul = document.createElement("ul");
          for (const m of entries) {
            const li = document.createElement("li"),
              code = document.createElement("code");
            code.textContent = m.text;
            li.append(
              code,
              document.createTextNode(" "),
              sourceLink(n.path, m.line, "L" + m.line),
            );
            ul.append(li);
          }
          members.append(ul);
        }
        const rel = $("relations");
        rel.replaceChildren();
        for (const e of data.edges.filter((e) => e.a === id || e.b === id)) {
          const li = document.createElement("li"),
            b = document.createElement("button");
          b.className = "relation";
          b.textContent = e.a + " → " + e.b;
          b.onclick = () => navigate(e.a === id ? e.b : e.a);
          li.append(b);
          const caption = document.createElement("div");
          caption.className = "relation-label";
          caption.textContent = e.label;
          li.append(caption);
          for (const proof of e.evidence) {
            li.append(
              sourceLink(proof.path, proof.line, "L" + proof.line),
              document.createTextNode(" "),
            );
          }
          rel.append(li);
        }
      }
      function search() {
        const q = $("search").value.trim().toLowerCase();
        if (!q) return;
        const hits = Object.values(nodes).filter(
          (n) => n.id.toLowerCase().includes(q) || n.summary.includes(q),
        );
        const exact = hits.find((n) => n.id.toLowerCase() === q);
        if (exact || hits.length === 1) {
          navigate((exact || hits[0]).id);
          $("search").value = "";
        } else {
          $("searchStatus").textContent = hits.length
            ? hits.length + " 个匹配，请从候选类名选择"
            : "未找到匹配的类";
          $("classList").replaceChildren(
            ...hits.map((n) => {
              const o = document.createElement("option");
              o.value = n.id;
              o.label = n.summary;
              return o;
            }),
          );
        }
      }
      $("searchButton").onclick = search;
      $("search").addEventListener("change", search);
      $("search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") search();
      });
      $("mainButton").onclick = () => navigate("main");
      $("allButton").onclick = () => navigate("all");
      $("backButton").onclick = () => {
        const p = history.pop();
        if (p) {
          view = p.view;
          selected = p.selected;
          render();
          fit();
          $("backButton").disabled = !history.length;
        }
      };
      $("fitButton").onclick = fit;
      $("labels").onchange = render;
      function scaleAt(f, x, y) {
        const z = Math.min(3, Math.max(0.12, zoom * f));
        offsetX = x - ((x - offsetX) * z) / zoom;
        offsetY = y - ((y - offsetY) * z) / zoom;
        zoom = z;
        updateTransform();
      }
      $("plus").onclick = () =>
        scaleAt(
          1.2,
          $("viewport").clientWidth / 2,
          $("viewport").clientHeight / 2,
        );
      $("minus").onclick = () =>
        scaleAt(
          1 / 1.2,
          $("viewport").clientWidth / 2,
          $("viewport").clientHeight / 2,
        );
      $("viewport").addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = $("viewport").getBoundingClientRect();
          scaleAt(
            Math.exp(-e.deltaY * 0.0015),
            e.clientX - r.left,
            e.clientY - r.top,
          );
        },
        { passive: false },
      );
      $("viewport").addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || e.target.closest(".zoom")) return;
        drag = {
          x: e.clientX,
          y: e.clientY,
          ox: offsetX,
          oy: offsetY,
          moved: false,
        };
        $("viewport").classList.add("dragging");
      });
      window.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x,
          dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
        if (drag.moved) {
          offsetX = drag.ox + dx;
          offsetY = drag.oy + dy;
          updateTransform();
        }
      });
      window.addEventListener("pointerup", () => {
        if (drag) {
          $("viewport").classList.remove("dragging");
          setTimeout(() => (drag = null), 0);
        }
      });
      $("downloadButton").onclick = () => {
        const svg = $("diagram").cloneNode(true),
          l = data.layouts[view];
        svg.setAttribute("viewBox", `0 0 ${l.w} ${l.h}`);
        svg.setAttribute("width", l.w);
        svg.setAttribute("height", l.h);
        svg.querySelector("#stage").removeAttribute("transform");
        const style = el(
          "style",
          {},
          document.querySelector("style").textContent,
        );
        svg.prepend(style);
        const blob = new Blob([new XMLSerializer().serializeToString(svg)], {
            type: "image/svg+xml;charset=utf-8",
          }),
          url = URL.createObjectURL(blob),
          a = document.createElement("a");
        a.href = url;
        a.download = "flexlb-" + view + ".svg";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      for (const n of Object.values(nodes).sort((a, b) =>
        a.id.localeCompare(b.id),
      )) {
        const option = document.createElement("option");
        option.value = n.id;
        option.label = n.summary;
        $("classList").append(option);
        const b = document.createElement("button");
        b.textContent = n.id;
        b.title = n.summary;
        b.onclick = () => navigate(n.id);
        $("catalog").append(b);
      }
      $("meta").textContent =
        "工作区源码核对于 " +
        data.date.replace("T", " ") +
        " · " +
        Object.keys(nodes).length +
        " 个类型 · " +
        data.edges.length +
        " 条关系";
      $("catalogTitle").textContent =
        "浏览全部 " + Object.keys(nodes).length + " 个类型";
      $("scope").textContent = data.scope;
      $("backButton").disabled = true;
      render();
      requestAnimationFrame(fit);
      window.addEventListener("resize", fit);
    </script>
