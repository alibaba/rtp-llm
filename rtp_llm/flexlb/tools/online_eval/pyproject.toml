[tool.ruff]
target-version = "py310"
line-length = 140
src = ["src", ".", "tests"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["F", "E9", "I", "Q", "B023", "B904", "SIM115"]

[tool.mypy]
files = ["src", "scripts", "tests", "*.py"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/tests"
explicit_package_bases = true
namespace_packages = true
follow_imports = "normal"
ignore_missing_imports = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["runtime", "runtime.*", "adapters", "adapters.*"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_tools", "grpc_tools.*", "google.protobuf", "google.protobuf.*"]
ignore_missing_imports = true
