report_view_schema_version: 1
kind: selected
report:
  subtitle: '{verdict}'
  id: master-performance
  producer: performance-gate
metrics:
  query_plan: master_performance.yaml
  diagnostic_only:
  - master/arrivals_qps
  - master/dispatch_qps
  - master/flexlb_app_flexlb_batcher_queue_size
  - master/flexlb_app_flexlb_inflight_request_count
  - master/flexlb_app_flexlb_scheduler_inflight_size
  - master/flexlb_auto_tpm_decode_reserved_count
  - master/flexlb_auto_tpm_decode_running_count
  - master/schedule_responses_qps
  - mock/accepted_qps
  - mock/completed_qps
  - mock/context_completed_qps
  - mock/context_execution_tps_avg
  - mock/context_execution_tps_with_cache_avg
  - mock/context_wall_tps
  - mock/engine_count
  - mock/mock_engine_held_blocks
  - mock/mock_engine_referenced_blocks
  - mock/output_wall_tps
  - mock/rtp_llm_context_tps
  - mock/rtp_llm_context_tps_per_engine
  - mock/rtp_llm_context_tps_with_cache
  - mock/rtp_llm_context_tps_with_cache_per_engine
  - mock/rtp_llm_generate_tps
  - mock/rtp_llm_kv_cache_pool_available_blocks
  - mock/rtp_llm_kv_cache_pool_total_blocks
  - mock/running_sum
  - mock/simulated_decode_ms_avg
  - mock/waiting_sum
  - request/completed_qps
  - request/arrival_success_ratio
  - request/e2e_p99_ms
  - request/tpot_p99_ms
  - request/input_tokens_mean
  - request/output_tokens_mean
  - request/input_tps
  - request/output_tps
  - request/inflight
charts:
  events:
    measure_start:
      label: 测量阶段开始
      source: stage
      stage: measure
      boundary: start
    measure_end:
      label: 测量阶段结束
      source: stage
      stage: measure
      boundary: end
  event_ids:
  - measure_start
  - measure_end
  curves:
    mock/rtp_llm_context_tps_engine_mean/P:
      metric_id: mock/rtp_llm_context_tps_engine_mean
      labels:
        role: prefill
      name: P context TPS
      group: Prefill TPS
      unit: 单引擎平均 tokens/s
      axis: forward
      color: '#1677ff'
      hidden: false
    mock/rtp_llm_context_tps_with_cache_engine_mean/P:
      metric_id: mock/rtp_llm_context_tps_with_cache_engine_mean
      labels:
        role: prefill
      name: P context TPS（含缓存）
      group: Prefill TPS
      unit: 单引擎平均 tokens/s
      axis: forward
      color: '#13c2c2'
      hidden: false
    mock/rtp_llm_generate_tps_engine_mean/D:
      metric_id: mock/rtp_llm_generate_tps_engine_mean
      labels:
        role: decode
      name: D generate TPS
      group: Decode TPS
      unit: 单引擎平均 tokens/s
      axis: forward
      color: '#fa541c'
      hidden: false
    mock/cache_hit_ratio/P:
      metric_id: mock/cache_hit_ratio
      labels:
        role: prefill
      name: P 实际 token 命中率
      group: 缓存命中率
      unit: '%'
      axis: hit_pct
      scale: 100
      color: '#722ed1'
      hidden: false
      source_unit: ratio
    mock/simulated_prefill_ms_avg/P:
      metric_id: mock/simulated_prefill_ms_avg
      labels:
        role: prefill
      name: P model forward 均值
      group: 延迟
      unit: 毫秒
      axis: ms
      color: '#52c41a'
      hidden: false
    mock/prefill_batch_size_mean/P:
      metric_id: mock/prefill_batch_size_mean
      labels:
        role: prefill
      name: P batch size 均值
      group: Prefill Batch
      unit: 请求 / 执行批
      axis: batch
      color: '#eb2f96'
      hidden: false
    mock/prefill_batch_size_p50/P:
      metric_id: mock/prefill_batch_size_p50
      labels:
        role: prefill
      name: P batch size P50
      group: Prefill Batch
      unit: 请求 / 执行批
      axis: batch
      color: '#faad14'
      hidden: false
    mock/prefill_batch_size_p90/P:
      metric_id: mock/prefill_batch_size_p90
      labels:
        role: prefill
      name: P batch size P90
      group: Prefill Batch
      unit: 请求 / 执行批
      axis: batch
      color: '#2f54eb'
      hidden: false
    mock/prefill_batch_size_p99/P:
      metric_id: mock/prefill_batch_size_p99
      labels:
        role: prefill
      name: P batch size P99
      group: Prefill Batch
      unit: 请求 / 执行批
      axis: batch
      color: '#1677ff'
      hidden: false
    mock/running_avg/P:
      metric_id: mock/running_avg
      labels:
        role: prefill
      name: P Running / engine
      group: Prefill 状态
      unit: 请求数 / P 引擎
      axis: count
      color: '#13c2c2'
      hidden: false
    mock/running_max/P:
      metric_id: mock/running_max
      labels:
        role: prefill
      name: P Running max
      group: Prefill 状态
      unit: 请求数 / P 引擎
      axis: count
      color: '#fa541c'
      hidden: false
    mock/waiting_avg/P:
      metric_id: mock/waiting_avg
      labels:
        role: prefill
      name: P Waiting / engine
      group: Prefill 状态
      unit: 请求数 / P 引擎
      axis: count
      color: '#722ed1'
      hidden: false
    mock/waiting_max/P:
      metric_id: mock/waiting_max
      labels:
        role: prefill
      name: P Waiting max
      group: Prefill 状态
      unit: 请求数 / P 引擎
      axis: count
      color: '#52c41a'
      hidden: false
    client/schedule_p99_seconds:
      metric_id: client/schedule_p99_seconds
      labels: {}
      name: 调度等待 p99
      group: 延迟
      unit: ms
      axis: ms
      scale: 1000
      color: '#eb2f96'
      hidden: false
      source_unit: s
    request/sent_qps:
      metric_id: request/sent_qps
      labels: {}
      name: 发送 QPS
      group: 流量
      unit: 请求 / 秒
      axis: qps
      color: '#faad14'
      hidden: false
    request/success_qps:
      metric_id: request/success_qps
      labels: {}
      name: 成功 QPS
      group: 流量
      unit: 请求 / 秒
      axis: qps
      color: '#2f54eb'
      hidden: false
    request/error_qps:
      metric_id: request/error_qps
      labels: {}
      name: 错误 QPS
      group: 流量
      unit: 请求 / 秒
      axis: qps
      color: '#1677ff'
      hidden: false
    request/ttft_p99_ms:
      metric_id: request/ttft_p99_ms
      labels: {}
      name: TTFT p99
      group: 延迟
      unit: 毫秒
      axis: ms
      color: '#13c2c2'
      hidden: false
  panels:
  - id: engine-tps
    title: 三项引擎 TPS 与门禁线
    curve_ids:
    - mock/rtp_llm_context_tps_engine_mean/P
    - mock/rtp_llm_context_tps_with_cache_engine_mean/P
    - mock/rtp_llm_generate_tps_engine_mean/D
    axes:
      forward:
        title: 单引擎平均 tokens/s
        position: left
    caption: 三项均为同一采样点按引擎等权平均的执行 TPS；虚线为各自的绝对下界，不是集群 TPS。
    empty_caption: 缺少引擎 TPS 采样；门禁结果仍以原始证据判定。
  - id: client-qps
    title: 发送 / 成功 / 失败 QPS
    curve_ids:
    - request/sent_qps
    - request/success_qps
    - request/error_qps
    axes:
      qps:
        title: 请求 / 秒
        position: left
    caption: 发送按请求发出时间分桶，成功和失败按终态时间分桶，均为每秒请求数。
    empty_caption: 缺少逐请求终态证据，无法绘制 QPS。
  - id: latency
    title: TTFT / 调度等待 / Model forward
    curve_ids:
    - request/ttft_p99_ms
    - client/schedule_p99_seconds
    - mock/simulated_prefill_ms_avg/P
    axes:
      ms:
        title: 毫秒
        position: left
    caption: TTFT 为 1 秒到达 cohort 的逐请求 p99；调度等待为客户端 schedule 直方图的 10 秒窗口 p99，包含调度处理；Model forward 为 Mock
      Prefill 引擎均值。三条曲线采样口径不同，不能相减。
    empty_caption: 缺少延迟采样，无法绘制延迟曲线。
  - id: cache-hit
    title: Prefill 实际 token 命中率
    curve_ids:
    - mock/cache_hit_ratio/P
    axes:
      hit_pct:
        title: 命中率 %
        position: left
    caption: Prefill 的 mock_hit_tokens_total 与 mock_context_tokens_total 在同一 10 秒窗口的速率之比；分母为零或缺采时断线。
    empty_caption: 缺少有效的 Prefill token 命中率采样；不补零，也不使用理论路由命中率替代。
  - id: prefill-batch
    title: Prefill 实际执行 batch size 分布
    curve_ids:
    - mock/prefill_batch_size_mean/P
    - mock/prefill_batch_size_p50/P
    - mock/prefill_batch_size_p90/P
    - mock/prefill_batch_size_p99/P
    axes:
      batch:
        title: 请求 / 执行批
        position: left
    caption: 每个 P 执行批更新正式 Prometheus 直方图；均值为 10 秒窗口 sum/count，P50/P90/P99 由同一窗口的直方图桶估算。无执行批或缺采时断线。
    empty_caption: 缺少 Prefill 执行批直方图，无法绘制 batch size 分布。
  - id: prefill-state
    title: Prefill Waiting / Running
    curve_ids:
    - mock/waiting_avg/P
    - mock/waiting_max/P
    - mock/running_avg/P
    - mock/running_max/P
    axes:
      count:
        title: 请求数 / P 引擎
        position: left
    caption: 每个采样点分别展示 P 引擎等待和执行中请求数的引擎均值与单引擎最大值；不含 Decode 预约。
    empty_caption: 缺少 Prefill Waiting / Running 监控采样。
sections:
  checks:
    title: 绝对标准
    columns:
    - 指标
    - 实际值
    - 标准
    - 结果
    opened: true
  monitoring:
    title: 监控曲线来源与缺采
    opened: false
  validity:
    title: 有效性
    opened: false
  metrics:
    title: 指标
    opened: false
