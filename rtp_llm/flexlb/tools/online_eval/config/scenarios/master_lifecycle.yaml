schema_version: 2
case: master_lifecycle
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  discovery: discovery_file
  perf_preset: fault_env
  # 故障恢复检查使用优先级队列，省略测试队列期限以使用 Java 默认值，隔离短期限对恢复检查的干扰。
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
execution:
  timeout_s: 420
  stage_timeout_s: 60
  cleanup_timeout_s: 120
program: kill_single
metadata:
  description: Cold restart of the owned master, clean scheduler state, topology and request recovery.
  category: master
parameters:
  kill_single:
    setup_timeout_s: 180
    baseline:
      count: 1
      output_len: 2
    baseline_complete:
      op: eq
      expected: true
    baseline_no_errors:
      op: eq
      expected: 0
    kill:
      mode: kill
      target: single
    restart_timeout_s: 180
    restored_topology_timeout_s: 60
    restored_topology:
      target: single
      inflight_zero: false
    restored_inflight_timeout_s: 10
    restored_inflight:
      target: single
      inflight_zero: true
    recovery:
      count: 1
      output_len: 2
    recovery_complete:
      op: eq
      expected: true
    recovery_no_errors:
      op: eq
      expected: 0
test:
  kind: functional
  description: Bounded protocol, state or admission contract
  collection: diagnostic
