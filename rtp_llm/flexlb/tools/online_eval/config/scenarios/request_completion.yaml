case_schema_version: 2
case: request_completion
program: default
metadata:
  description: Submitted requests reach a business terminal without stream errors.
  category: status
  tags:
  - smoke
  - lifecycle
test:
  kind: functional
  description: Bounded protocol, state or admission contract
  collection: diagnostic
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
execution:
  timeout_s: 300
  stage_timeout_s: 60
  cleanup_timeout_s: 120
parameters:
  traffic:
    input_len: 2048
    output_len: 2
    count: 1
  procedure:
    setup_timeout_s: 180
  checks:
    completed:
      op: eq
      expected: true
    no_errors:
      op: eq
      expected: 0
parameter_schema:
  traffic.input_len:
    minimum: 1
    maximum: 2147483647
    integer: true
  traffic.output_len:
    minimum: 1
    maximum: 2147483647
    integer: true
  traffic.count:
    minimum: 1
    maximum: 10000
    integer: true
