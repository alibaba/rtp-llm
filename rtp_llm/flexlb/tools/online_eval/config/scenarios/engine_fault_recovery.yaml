schema_version: 2
case: engine_fault_recovery
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  discovery: discovery_file
  perf_preset: fault_env
  master_sync_log: true
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
execution:
  timeout_s: 900
  stage_timeout_s: 120
  cleanup_timeout_s: 120
program: generation_bump
metadata:
  description: Engine generation bump, retirement and request recovery.
  category: engine_fault
parameters:
  generation_bump:
    setup_timeout_s: 180
    prior_drain_observed_timeout_s: 110
    prior_drain_observed:
      duration_s: 95
      until:
        metric: cleanup_inflight
        op: eq
        value: 0
      interval_s: 0.5
    target:
      targets:
      - prefill-0
    generation_before_timeout_s: 30
    generation_before:
      duration_s: 0
      include:
      - log
    baseline:
      count: 6
      concurrency: 6
      unique_key_count: 3
    baseline_dispatch_timeout_s: 120
    baseline_state_timeout_s: 30
    baseline_state:
      duration_s: 0
      include:
      - client_records
    baseline_succeeds:
      metric: success
      op: eq
      expected: 6
    outage:
      operation: stop
      targets:
      - prefill-0
    retirement_timeout_s: 45
    retirement:
      duration_s: 30
      until:
        metric: retired
        op: ge
        value: 1
      include:
      - log
      interval_s: 0.2
    transport_retired:
      metric: retired
      op: ge
      expected: 1
    restart:
      operation: start
      targets:
      - prefill-0
    alive_restored_timeout_s: 45
    alive_restored:
      duration_s: 30
      until:
        metric: alive_prefill
        op: ge
        value: 2
      include:
      - info
      interval_s: 0.5
    alive_back:
      metric: alive_prefill
      op: ge
      expected: 2
    reconnect_timeout_s: 30
    reconnect:
      duration_s: 3
    recovered_generation_timeout_s: 30
    recovered_generation:
      duration_s: 0
      include:
      - log
      - inflight
    generation_is_new:
      metric: created
      op: ge
      expected: 1
    recovered_prefill_batch_ledger_zero:
      metric: target_prefill_batches
      op: eq
      expected: 0
    recovered_prefill_member_ledger_zero:
      metric: target_prefill_requests
      op: eq
      expected: 0
    recovery:
      count: 1
      concurrency: 1
      stream_timeout_s: 30
    recovery_dispatch_timeout_s: 120
    recovery_state_timeout_s: 30
    recovery_state:
      duration_s: 0
      include:
      - client_records
    recovery_succeeds:
      metric: success
      op: eq
      expected: 1
test:
  kind: functional
  description: Bounded protocol, state or admission contract
  collection: diagnostic
