schema_version: 2
case: trace_scale_out
profiles:
- single-batch
- batch-window
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  perf_preset: default
execution:
  timeout_s: 300
  stage_timeout_s: 60
  cleanup_timeout_s: 120
metadata:
  description: Java background load survives Python phase boundaries and Decode scale-out.
  category: elastic
variants:
- id: prepared_background
  program: prepared_background
parameters:
  setup_timeout_s: 180
  background:
    group_id: background
    phase_id: preparation
    poll_s: 0.1
    jvm_xms: 1g
    jvm_xmx: 1g
    source:
      kind: synthetic
      model: realistic
      version: '1'
      parameters:
        seed: 91001
        count: 16
        block_size: 512
        families: 1
        shared_blocks: 0
        prefix_blocks: 0
        suffix_blocks: 2
        zipf_alpha: 0
        cold_fraction: 1
        output_tokens: 64
        priority: 50
    client:
      DURATION_S: '90'
      MAX_CONCURRENCY: '16'
      TIMEOUT_MS: '30000'
      RESPONSE_TIMEOUT: '45'
      REPLAY_UNIQUE_PREFIX: 'false'
      FETCH_OUTPUT_STREAM: 'true'
      N_CHANNELS: '2'
      EVENT_LOOP_THREADS: '4'
      SKIP_SERVER_LATENCY: 'true'
      PRIORITY: '50'
      playback:
        mode: uniform
        qps: 8.0
        max_laps: 0
        identity: structural-relabel
  prepared:
    min_started: 8
    min_terminal: 1
    min_decode_inflight: 1
  formal:
    group_id: formal
    phase_id: verification
    poll_s: 0.1
    jvm_xms: 1g
    jvm_xmx: 1g
    source:
      kind: synthetic
      model: realistic
      version: '1'
      parameters:
        seed: 91002
        count: 240
        block_size: 512
        families: 1
        shared_blocks: 0
        prefix_blocks: 0
        suffix_blocks: 2
        zipf_alpha: 0
        cold_fraction: 1
        output_tokens: 8
        priority: 50
    client:
      DURATION_S: '30'
      MAX_CONCURRENCY: '16'
      TIMEOUT_MS: '30000'
      RESPONSE_TIMEOUT: '45'
      REPLAY_UNIQUE_PREFIX: 'false'
      FETCH_OUTPUT_STREAM: 'true'
      N_CHANNELS: '2'
      EVENT_LOOP_THREADS: '4'
      SKIP_SERVER_LATENCY: 'true'
      PRIORITY: '50'
      playback:
        mode: uniform
        qps: 10.0
        max_laps: 1
        identity: structural-relabel
  formal_active:
    min_started: 10
    min_terminal: 1
    min_decode_inflight: 1
  add_decode:
    role: decode
  new_decode_serving:
    min_started: 20
    min_terminal: 1
    min_decode_inflight: 0
  background_persisted:
    min_started: 24
    min_terminal: 1
    min_decode_inflight: 1
  check:
    min_success_rate: 1.0

test:
  kind: workload
  description: Java background traffic persists across Python checkpoints and Decode
    scale-out
  collection: request
reports:
- workload.yaml
