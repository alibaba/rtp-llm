case_schema_version: 2
case: master_ha_failover
program: default
metadata:
  description: One real frontend prefix-lineage replay across a selectable dual-master restart cycle.
  category: master
test:
  kind: workload
  description: Continuous request outcomes, owner state and Prefill distribution during a dual-master restart cycle
  collection: request
  monitoring:
    query_plan: master_ha_failover.yaml
profiles:
- batch-window
- single-nonbatch
environment:
  backend: java_mock
  perf_preset: glm_5_3_l20d
  master_layout: dual_standalone
  discovery: discovery_file
  metric_whitelist: flexlb_app_cache_,flexlb_app_flexlb_,flexlb_app_engine_balancing_master_,flexlb_auto_tpm_,flexlb_app_request_network_delay_ms,flexlb_app_grpc_server_process_ms,flexlb_app_routing_queue_wait_time_ms
execution:
  timeout_s: 2400
  stage_timeout_s: 180
  cleanup_timeout_s: 300
parameters:
  traffic:
    source:
      kind: trace
      model: prefix_lineage
      version: '2'
      parameters:
        path: ../../data/traffic_trace/glm-5.3_20260921_2126_3h.xz
        sha256: 241ac71c5bde834afd9dc656fefae6462c6f99767a203b54bba21059e9948f04
        count: 587711
        output_tokens: 8192
        output_distribution:
          kind: geometric
          mean_tokens: 420
          seed: 20260913
        priority: 50
    targets:
    - A
    - B
    duration_s: 240
    timeout_ms: 120000
    replay_speed: 5
    loop: false
    max_concurrency: 4096
    max_requests: 20000
    fallback: false
  procedure:
    setup_timeout_s: 600
    kill_a: {mode: kill, target: A}
    kill_b: {mode: kill, target: B}
    b_ready: {target: B, inflight_zero: false}
    a_ready: {target: A, inflight_zero: false}
    restart_timeout_s: 300
    finish_timeout_s: 150
  observation:
    baseline_wait: {wait_s: 20}
    settle: {wait_s: 5}
    survivor_wait: {wait_s: 20}
    outage_wait: {wait_s: 30}
    both_wait: {wait_s: 20}
    windows:
      baseline:
        until: {stage: baseline_end, field: epoch_s, offset_s: -2}
      b_only:
        from: {stage: b_start, field: epoch_s}
        until: {stage: b_end, field: epoch_s}
      a_only:
        from: {stage: a_start, field: epoch_s}
        until: {stage: a_end, field: epoch_s}
      both:
        from: {stage: both_start, field: epoch_s}
        until: {stage: both_end, field: epoch_s}
      outage:
        from: {stage: outage_start, field: epoch_s}
        until: {stage: outage_end, field: epoch_s}
      a_handover:
        from: {stage: b_end, field: epoch_s}
        until: {stage: a_start, field: epoch_s}
      post_recovery:
        from: {stage: both_start, field: epoch_s}
      all_requests: {}
  checks:
    baseline_success: {window: baseline, metric: ha_gate/success_rate, op: ge, expected: 0.95, min_samples: 100}
    b_success: {window: b_only, metric: ha_gate/success_rate, op: ge, expected: 0.95, min_samples: 100}
    b_route: {window: b_only, metric: ha_gate/target_share, target: B, op: ge, expected: 0.95, min_samples: 100}
    b_balance: {window: b_only, metric: ha_gate/prefill_max_share, op: le, expected: 0.25, min_samples: 100}
    outage_failures: {window: outage, metric: ha_gate/failed_count, op: ge, expected: 1, min_samples: 50}
    outage_no_master: {window: outage, metric: ha_gate/route_count, route: master, op: eq, expected: 0, min_samples: 50}
    outage_terminal: {window: outage, metric: ha_gate/visible_terminal_share, op: eq, expected: 1, min_samples: 50}
    a_success: {window: a_only, metric: ha_gate/success_rate, op: ge, expected: 0.95, min_samples: 100}
    a_route: {window: a_only, metric: ha_gate/target_share, target: A, op: ge, expected: 0.95, min_samples: 100}
    a_balance: {window: a_only, metric: ha_gate/prefill_max_share, op: le, expected: 0.25, min_samples: 100}
    both_success: {window: both, metric: ha_gate/success_rate, op: ge, expected: 0.95, min_samples: 100}
    both_balance: {window: both, metric: ha_gate/prefill_max_share, op: le, expected: 0.25, min_samples: 100}
    handover_errors: {window: a_handover, metric: ha_gate/non_ok_count, op: eq, expected: 0, min_samples: 100, warning_profiles: [batch-window]}
    late_errors: {window: post_recovery, metric: ha_gate/non_ok_count, op: eq, expected: 0, min_samples: 100}
    rolling_errors: {window: all_requests, metric: ha_gate/non_ok_count, op: eq, expected: 0, min_samples: 100, warning_profiles: [batch-window]}
    unique_requests: {window: full_run, metric: ha_gate/duplicate_ids, op: eq, expected: 0, min_samples: 1}
variant_axis:
  kind: flow
  fields: [program]
variants:
- id: non_rolling
  program: non_rolling
reports:
- master_ha_core.yaml
