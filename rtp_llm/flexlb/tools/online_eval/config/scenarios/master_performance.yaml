  flow:
    group_id: performance
    phase_id: continuous
    poll_s: 0.1
    jvm_xms: 8g
    jvm_xmx: 8g
    source:
      kind: synthetic
      model: realistic
      version: '1'
      parameters:
        seed: 20260922
        count: 192000
        block_size: 1024
        families: 1
        prefix_blocks: 0
        suffix_blocks: 1
        zipf_alpha: 0
        cold_fraction: 1
        output_tokens: 350
        priority: 50
        input_distribution:
          values:
          - 3270
          weights:
          - 1
    client:
      DURATION_S: '120'
      MAX_CONCURRENCY: '65536'
      TIMEOUT_MS: '30000'
      RESPONSE_TIMEOUT: '60'
      REPLAY_UNIQUE_PREFIX: 'false'
      FETCH_OUTPUT_STREAM: 'true'
      N_CHANNELS: '8'
      EVENT_LOOP_THREADS: '8'
      SKIP_SERVER_LATENCY: 'true'
      PRIORITY: '50'
      playback:
        mode: uniform
        qps: 1600.0
        max_laps: 1
        identity: structural-relabel
test:
  kind: workload
  description: Fixed synthetic traffic, absolute throughput and SLO checks with complete
    request evidence
  collection: request
