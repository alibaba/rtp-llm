    benchmark_id: synthetic-flash-scale-20260922-v1
    warmup_s: 30
    measure_s: 60
    sample_s: 1
    max_gap_s: 3
    qps: 1600
    qps_tolerance: 0.05
    min_requests: 90000
    max_pacing_lag_ms: 250
    min_input_tps: 4708800
    min_output_tps: 504000
    min_goodput_rps: 1440
    min_slo_fraction: 0.95
    max_error_rate: 0
    max_ttft_p99_ms: 2000
    max_e2e_p99_ms: 15000
    max_tpot_p99_ms: 50
