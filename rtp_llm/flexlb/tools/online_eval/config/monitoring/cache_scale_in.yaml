        requires_request_identity: false
      exported_metrics:
      - mock_memory_cache_total_blocks
    memory_allocated_blocks:
      promql: mock_memory_cache_allocated_blocks${selector}
      mode: scrape
      unit: blocks
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_memory_cache_allocated_blocks
    device_evicted_blocks_rate:
      promql: sum by (role) (rate(mock_engine_cache_evictions_total${selector}[${window_ms}ms]))
      unit: blocks/s
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_engine_cache_evictions_total
    memory_evicted_blocks_rate:
      promql: sum by (role) (rate(mock_memory_cache_evicted_blocks_total${selector}[${window_ms}ms]))
      unit: blocks/s
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_memory_cache_evicted_blocks_total
    memory_consumed_blocks_rate:
      promql: sum by (role) (rate(mock_memory_cache_consumed_blocks_total${selector}[${window_ms}ms]))
      unit: blocks/s
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_memory_cache_consumed_blocks_total
    memory_read_blocks_rate:
      promql: sum by (role) (rate(mock_memory_cache_read_blocks_total${selector}[${window_ms}ms]))
      unit: blocks/s
      value_kind: gauge
      labels:
      - role
      measurement:
