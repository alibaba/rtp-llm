metric_plan_schema_version: 3
include:
- default.yaml
sources:
  mock:
    running:
      promql: rtp_llm_running_stream_size${selector}
      mode: scrape
      unit: requests
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
    waiting:
      promql: rtp_llm_wait_stream_size${selector}
      mode: scrape
      unit: requests
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
    hit_tokens_total:
