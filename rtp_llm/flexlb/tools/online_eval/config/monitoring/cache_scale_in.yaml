produced:
  derived/survivor_hit_ratio:
    producer: cache_windows
    source_type: prometheus
    unit: ratio
    value_kind: gauge
    labels: []
    measurement:
      method: sum_counter_deltas_ratio
      population: surviving_prefill_engines
      accuracy: counter_delta
      requires_request_identity: false
  cache_gate/offered_qps_deviation:
    producer: cache_windows
    source_type: client_journal
    unit: ratio
    value_kind: scalar
    labels: []
    measurement:
      method: counter_delta_and_rolling_window_summary
      population: baseline_initial_fleet_and_post_survivors
      accuracy: request_ledger
      requires_request_identity: true
  cache_gate/baseline_min_half_hit:
    producer: cache_windows
    source_type: prometheus
    unit: ratio
    value_kind: scalar
    labels: []
    measurement:
      method: counter_delta_and_rolling_window_summary
      population: baseline_initial_fleet_and_post_survivors
      accuracy: counter_delta
      requires_request_identity: false
  cache_gate/baseline_half_spread:
    producer: cache_windows
    source_type: prometheus
    unit: ratio
    value_kind: scalar
    labels: []
    measurement:
      method: counter_delta_and_rolling_window_summary
      population: baseline_initial_fleet_and_post_survivors
      accuracy: counter_delta
      requires_request_identity: false
  cache_gate/min_window_completed:
    producer: cache_windows
    source_type: prometheus
    unit: requests
    value_kind: scalar
    labels: []
    measurement:
      method: counter_delta_and_rolling_window_summary
      population: baseline_initial_fleet_and_post_survivors
      accuracy: counter_delta
      requires_request_identity: false
  cache_gate/collapse_detected:
    producer: cache_windows
    source_type: prometheus
    unit: boolean
    value_kind: scalar
    labels: []
    measurement:
      method: sustained_survivor_hit_collapse
      population: baseline_initial_fleet_and_post_survivors
      accuracy: counter_delta
      requires_request_identity: false
