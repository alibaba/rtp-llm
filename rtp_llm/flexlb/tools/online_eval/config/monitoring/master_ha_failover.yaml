      accuracy: request_ledger
      requires_request_identity: true
  ha/prefill_peak_qps:
    producer: ha_evidence
    source_type: client_journal
    unit: requests/s
    value_kind: gauge
    labels: []
    measurement:
      method: prefill_assignment_five_second_buckets
      population: declared_prefill_fleet
      accuracy: request_ledger
      requires_request_identity: true
  ha/prefill_mean_qps:
    producer: ha_evidence
    source_type: client_journal
    unit: requests/s
    value_kind: gauge
    labels: []
    measurement:
      method: prefill_assignment_five_second_buckets
      population: declared_prefill_fleet
      accuracy: request_ledger
      requires_request_identity: true
  ha/prefill_skew:
    producer: ha_evidence
    source_type: client_journal
    unit: ratio
    value_kind: gauge
    labels: []
    measurement:
      method: prefill_assignment_five_second_buckets
      population: declared_prefill_fleet
      accuracy: request_ledger
      requires_request_identity: true
  ha/http_up:
    producer: ha_evidence
    source_type: debug_api
    unit: boolean
    value_kind: gauge
    labels:
    - master
    measurement:
      method: http_state_poll
      population: master_instance
      accuracy: sampled
      requires_request_identity: false
  ha/scheduler_inflight:
    producer: ha_evidence
    source_type: debug_api
