metric_plan_schema_version: 3
include:
- default.yaml
exclude:
- client/actual_send_qps
- client/success_qps
- client/error_qps
- client/completed_qps
- client/ttft_p99_seconds
- client/total_p99_seconds
- master/flexlb_app_flexlb_scheduler_inflight_size
- master/flexlb_app_flexlb_inflight_request_count
- master/flexlb_auto_tpm_decode_reserved_count
- master/flexlb_auto_tpm_decode_running_count
- master/arrivals_qps
- master/dispatch_qps
- master/schedule_responses_qps
- master/flexlb_app_flexlb_batcher_queue_size
- client/schedule_p99_seconds
produced:
  ha/sent:
    producer: ha_evidence
    source_type: client_journal
    unit: requests/s
    value_kind: gauge
    labels: []
    measurement:
      method: arrival_cohort_one_second_buckets
      population: ha_requests_by_send_time
      accuracy: request_ledger
      requires_request_identity: true
  ha/success:
    producer: ha_evidence
    source_type: client_journal
    unit: requests/s
    value_kind: gauge
    labels: []
    measurement:
      method: arrival_cohort_one_second_buckets
      population: ha_requests_by_send_time
      accuracy: request_ledger
      requires_request_identity: true
  ha/failed:
    producer: ha_evidence
    source_type: client_journal
    unit: requests/s
    value_kind: gauge
    labels: []
    measurement:
      method: arrival_cohort_one_second_buckets
