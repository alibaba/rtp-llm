metric_plan_schema_version: 3
include:
- default.yaml
exclude:
- client/actual_send_qps
- client/success_qps
- client/error_qps
- client/completed_qps
- client/ttft_p99_seconds
- client/total_p99_seconds
sources:
  mock:
    rtp_llm_context_tps:
      promql: rtp_llm_context_tps${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
    rtp_llm_context_tps_with_cache:
      promql: rtp_llm_context_tps_with_cache${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
    rtp_llm_generate_tps:
      promql: rtp_llm_generate_tps${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: raw_scrape
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
produced:
  request/input_tps:
    producer: performance_requests
    source_type: client_journal
    unit: tokens/s
    value_kind: gauge
    labels: []
    measurement:
      method: request_one_second_buckets
      population: completion_window
      accuracy: request_ledger
      requires_request_identity: true
  request/output_tps:
