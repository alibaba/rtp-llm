schema_version: 2
include:
- workload.yaml
sources:
  mock:
    rtp_llm_context_tps:
      promql: rtp_llm_context_tps${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
    rtp_llm_context_tps_with_cache:
      promql: rtp_llm_context_tps_with_cache${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
    rtp_llm_generate_tps:
      promql: rtp_llm_generate_tps${selector}
      mode: scrape
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
