metric_plan_schema_version: 5
sources:
  master:
    cpu_usage_percent:
      promql: 100 * (process_cpu_usage${selector} >= 0)
      unit: percent
      value_kind: gauge
      labels: [application]
      exported_metrics: [process_cpu_usage]
      required: true
    system_cpu_usage_percent:
      promql: 100 * (system_cpu_usage${selector} >= 0)
      unit: percent
      value_kind: gauge
      labels: [application]
      exported_metrics: [system_cpu_usage]
      required: true
    cpu_available_processors:
      promql: system_cpu_count${selector}
      mode: scrape
      unit: processors
      value_kind: gauge
      labels: [application]
      exported_metrics: [system_cpu_count]
      required: true
