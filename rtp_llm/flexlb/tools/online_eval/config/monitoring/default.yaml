metric_plan_schema_version: 5
sources:
  mock:
    running_sum:
      promql: sum by (role) (rtp_llm_running_stream_size${selector})
      unit: requests
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_running_stream_size
    running_avg:
      promql: avg by (role) (rtp_llm_running_stream_size${selector})
      unit: requests
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_running_stream_size
      required: true
    running_max:
      promql: max by (role) (rtp_llm_running_stream_size${selector})
      unit: requests
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_running_stream_size
    waiting_sum:
      promql: sum by (role) (rtp_llm_wait_stream_size${selector})
