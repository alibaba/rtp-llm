      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      - engine_name
      - engine_incarnation
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
