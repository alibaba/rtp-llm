      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_wait_stream_size
      required: true
    waiting_max:
      promql: max by (role) (rtp_llm_wait_stream_size${selector})
      unit: requests
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_wait_stream_size
    engine_count:
      promql: count by (role) (rtp_llm_running_stream_size${selector})
      unit: engines
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - rtp_llm_running_stream_size
    context_wall_tps:
      promql: sum by (role) (rate(mock_context_tokens_total${selector}[${window_ms}ms]))
      unit: tokens/s
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_context_tokens_total
    context_completed_qps:
      promql: sum by (role) (rate(mock_context_requests_total${selector}[${window_ms}ms]))
      unit: requests/s
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_context_requests_total
    cache_hit_ratio:
      promql: sum by (role) (rate(mock_hit_tokens_total${selector}[${window_ms}ms])) / sum by (role) (rate(mock_context_tokens_total${selector}[${window_ms}ms]))
      unit: ratio
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_context_tokens_total
      - mock_hit_tokens_total
    prefill_batch_size_mean:
      promql: (sum by (role) (rate(mock_prefill_batch_size_sum${selector}[${window_ms}ms]))) / (sum by (role) (rate(mock_prefill_batch_size_count${selector}[${window_ms}ms])))
      unit: requests/batch
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: sampled
        requires_request_identity: false
      exported_metrics:
      - mock_prefill_batch_size_count
      - mock_prefill_batch_size_sum
    prefill_batch_size_p50:
      promql: histogram_quantile(0.5, sum by (role, le) (rate(mock_prefill_batch_size_bucket${selector}[${window_ms}ms])))
      unit: requests/batch
      value_kind: gauge
      labels:
      - role
      measurement:
        method: promql_evaluation
        population: mock_selector
        accuracy: histogram_estimate
        requires_request_identity: false
      exported_metrics:
      - mock_prefill_batch_size_bucket
    prefill_batch_size_p90:
