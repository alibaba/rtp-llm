suite_schema_version: 3
default_suite: quick
default_profile: batch-window
suites:
  core: []
  quick:
  - request_completion::default
  workload:
  - cache_scale_in::default
  - master_ha_failover::default
  - master_performance::default
  workload_cache:
  - cache_scale_in::default
  workload_other:
  - master_ha_failover::default
  - master_performance::default
ci_jobs:
  quick:
    suite: quick
    profiles:
    - batch-window
    - single-nonbatch
    - single-batch
    - window-nonbatch
    parallel: 1
  workload:
    suite: workload
    profiles:
    - batch-window
    - single-nonbatch
    parallel: 1
  workload_cache_single:
    suite: workload_cache
    profiles:
    - single-nonbatch
    parallel: 1
  workload_cache_batch:
    suite: workload_cache
    profiles:
    - batch-window
    parallel: 1
  workload_other:
    suite: workload_other
    profiles:
    - single-nonbatch
    - batch-window
    parallel: 1
