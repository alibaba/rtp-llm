suite_schema_version: 3
default_suite: core
default_profile: batch-window
suites:
  core:
  - request_completion::default
  workload:
  - cache_scale_in::default
  - master_ha_failover::default
  - master_performance::default
ci_jobs:
  quick:
    suite: core
    profiles:
    - batch-window
    - single-nonbatch
    - single-batch
    - window-nonbatch
    parallel: 1
  workload:
    suite: workload
    profiles:
    - batch-window
    - single-nonbatch
    parallel: 1
