    timeout_s: 75
  - id: permanent_wait
    action: wait
    params:
      requests:
        $ref: stages.permanent_cohort.output.requests
    timeout_s: 75
  - id: permanent_partial_off
    action: status_control
    params:
      fault: enqueue_ack_partial_fail
      config: {}
      enabled: false
      role: prefill
  - id: permanent_code_off
    action: status_control
    params:
      fault: enqueue_ack_error_code
      config: {}
      enabled: false
      role: prefill
  - id: permanent_member_isolation
    action: status_outcomes
    params:
      requests:
        $ref: stages.permanent_cohort.output.requests
      success_min: 2
      failure_min: 1
      failure_max: 2
      error_code: 8431
      failure_phase: schedule
  - id: permanent_after
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: permanent_dispatch_nonempty
    action: status_check
    params:
      snapshot:
        $ref: stages.permanent_after.output.snapshot
      metric: enqueue_rpc
      op: ge
      expected: 1
      aggregate: last
      baseline:
        $ref: stages.permanent_before.output.snapshot
  - id: permanent_no_retry
    action: status_check
    params:
      snapshot:
        $ref: stages.permanent_after.output.snapshot
      metric: enqueue_rpc
      op: le
      expected: 2
      aggregate: last
      baseline:
        $ref: stages.permanent_before.output.snapshot
  - id: final_drained
    action: status_sample
    params:
      duration_s: 30
      until:
        metric: all_inflight
        op: eq
        value: 0
    timeout_s: 45
  - id: final_drained_scheduler
    action: status_check
    params:
      snapshot:
        $ref: stages.final_drained.output.snapshot
      metric: scheduler
      op: eq
      expected: 0
      aggregate: last
  - id: final_drained_prefill_batches
    action: status_check
    params:
      snapshot:
        $ref: stages.final_drained.output.snapshot
      metric: prefill_batches
      op: eq
      expected: 0
      aggregate: last
  - id: final_drained_prefill_members
    action: status_check
    params:
      snapshot:
        $ref: stages.final_drained.output.snapshot
      metric: prefill_requests
      op: eq
      expected: 0
      aggregate: last
  - id: final_drained_decode_load
    action: status_check
    params:
      snapshot:
        $ref: stages.final_drained.output.snapshot
      metric: decode_total_load
      op: eq
      expected: 0
      aggregate: last
  - id: final_health
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: master_http_200
    action: status_check
    params:
      snapshot:
        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
