schema_version: 1
description: Preserve separate ACK, member-execution, cleanup and recovery boundaries.
category: status
profiles:
- batch-window
tags:
- protocol
- migration
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  config_overrides:
    ordering: priority
    queue_timeout_ms: 10000
    stale_inflight_ms: 30000
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
id: batch_ack_and_execution
legacy_case_ids:
- status_ack_partial_fail
- status_batch_async_partial_fail
- status_ack_multi_error
- status_ack_empty_no_crash
variants:
- id: ack_partial
  legacy_case_ids:
  - status_ack_partial_fail
  findings:
  - transient_policy.contract
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: ledger_cohort
    action: status_prepare
    params:
      count: 4
      concurrency: 4
      input_len: 2048
      output_len: 2
      consume: deferred
  - id: ledger_before
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: partial_on
    action: status_control
    params:
      fault: enqueue_ack_partial_fail
      config:
        k: 1
      enabled: true
      role: prefill
  - id: ledger_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.ledger_cohort.output.requests
    timeout_s: 75
  - id: ledger_window
    action: status_sample
    params:
      duration_s: 8
    timeout_s: 30
  - id: failed_member_released_promptly
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_window.output.snapshot
      metric: prefill_requests
      op: le
      expected: 3
      aggregate: max
  - id: nonempty_engine_acceptance
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_window.output.snapshot
      metric: accepted
      op: ge
      expected: 4
      aggregate: last
      baseline:
        $ref: stages.ledger_before.output.snapshot
  - id: partial_off
    action: status_control
    params:
      fault: enqueue_ack_partial_fail
      config: {}
      enabled: false
      role: prefill
  - id: ledger_drained
    action: status_sample
    params:
      duration_s: 30
      until:
        metric: all_inflight
        op: eq
        value: 0
    timeout_s: 45
  - id: ledger_drained_scheduler
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_drained.output.snapshot
      metric: scheduler
      op: eq
      expected: 0
      aggregate: last
  - id: ledger_drained_prefill_batches
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_drained.output.snapshot
      metric: prefill_batches
      op: eq
      expected: 0
      aggregate: last
  - id: ledger_drained_prefill_members
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_drained.output.snapshot
      metric: prefill_requests
      op: eq
      expected: 0
      aggregate: last
  - id: ledger_drained_decode_load
    action: status_check
    params:
      snapshot:
        $ref: stages.ledger_drained.output.snapshot
      metric: decode_total_load
      op: eq
      expected: 0
      aggregate: last
  - id: transient_cohort
    action: status_prepare
    params:
      count: 4
      concurrency: 4
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: transient_before
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: transient_partial_on
    action: status_control
    params:
      fault: enqueue_ack_partial_fail
      config:
        k: 1
      enabled: true
      role: prefill
  - id: transient_code_on
    action: status_control
    params:
      fault: enqueue_ack_error_code
      config:
        code: 13
      enabled: true
      role: prefill
  - id: transient_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.transient_cohort.output.requests
    timeout_s: 75
  - id: transient_wait
    action: wait
    params:
      requests:
        $ref: stages.transient_cohort.output.requests
    timeout_s: 75
  - id: transient_partial_off
    action: status_control
    params:
      fault: enqueue_ack_partial_fail
      config: {}
      enabled: false
      role: prefill
  - id: transient_code_off
    action: status_control
    params:
      fault: enqueue_ack_error_code
      config: {}
      enabled: false
      role: prefill
  - id: transient_policy
    action: status_outcomes
    params:
      requests:
        $ref: stages.transient_cohort.output.requests
      slo_or_success: true
  - id: transient_retry_window
    action: status_sample
    params:
      duration_s: 3
    timeout_s: 30
  - id: permanent_cohort
    action: status_prepare
    params:
      count: 4
      concurrency: 4
      input_len: 2048
      output_len: 2
