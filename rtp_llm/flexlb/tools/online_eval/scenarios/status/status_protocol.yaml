schema_version: 1
description: Explicit status protocol boundary programs; old whole-case expected_fail is narrowed to reviewed checks
  only.
category: status
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
tags:
- protocol
- migration
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  config_overrides:
    ordering: priority
    queue_timeout_ms: 10000
    stale_inflight_ms: 30000
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
id: status_protocol
legacy_case_ids:
- status_inflight_ttl_cleanup
- status_prefill_suppress_all
- status_prefill_suppress_finished
- status_decode_suppress_finished
- status_status_no_respond
- status_version_regress
- status_unknown_rid_finished
- status_unknown_rid_running
- status_unknown_batchid
- status_special_ids
- status_unbatched_single_request
- status_foreign_batchid
- status_duplicate_finished
- status_cursor_regress
- status_finished_then_running
- status_zombie_completed_running
- status_zombie_fake_running
- status_decode_before_prefill
- status_decode_running_before_prefill
- status_decode_waiting_before_prefill
- status_fetch_error
- master_debug_snapshot
- normal_no_fetch_observation
variants:
- id: inflight_ttl_cleanup
  legacy_case_ids:
  - status_inflight_ttl_cleanup
  profiles:
  - batch-window
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: slow_prefill
    action: status_perf
    params:
      prefill_fixed_ms: 10000
      restore_prefill_fixed_ms: 100
  - id: silent
    action: status_prepare
    params:
      count: 6
      concurrency: 4
      input_len: 2048
      output_len: 2
      consume: deferred
  - id: metrics_ready
    action: status_metrics_ready
    params:
      duration_s: 180
      interval_s: 2
    timeout_s: 195
  - id: ttl_before
    action: status_sample
    params:
      duration_s: 0
      include:
      - inflight
      - mock
      - info
      - ttl
    timeout_s: 30
  - id: p_suppress
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: true
      role: prefill
      requests:
        $ref: stages.silent.output.requests
      rids: all
  - id: d_suppress
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: true
      role: decode
      requests:
        $ref: stages.silent.output.requests
      rids: all
  - id: silent_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.silent.output.requests
    timeout_s: 75
  - id: accepted_window
    action: status_sample
    params:
      duration_s: 15
      until:
        metric: prefill_accepted
        op: ge
        value: 6
    timeout_s: 30
  - id: six_prefill_accepted
    action: status_check
    params:
      snapshot:
        $ref: stages.accepted_window.output.snapshot
      metric: prefill_accepted
      op: ge
      expected: 6
      aggregate: last
      baseline:
        $ref: stages.ttl_before.output.snapshot
  - id: active_at_twelve_seconds
    action: status_sample
    params:
      duration_s: 12
    timeout_s: 30
  - id: ledger_nonempty_after_twelve
    action: status_check
    params:
      snapshot:
        $ref: stages.active_at_twelve_seconds.output.snapshot
      metric: scheduler
      op: ge
      expected: 1
      aggregate: last
  - id: ttl_drain
    action: status_sample
    params:
      duration_s: 95
      until:
        metric: scheduler
        op: eq
        value: 0
    timeout_s: 110
  - id: scheduler_ttl_drain
    action: status_check
    params:
      snapshot:
        $ref: stages.ttl_drain.output.snapshot
      metric: scheduler
      op: eq
      expected: 0
      aggregate: last
  - id: ttl_event_window
    action: status_sample
    params:
      duration_s: 105
      until:
        metric: ttl_scheduler
        op: ge
        value: 6
      include:
      - inflight
      - mock
      - info
      - ttl
    timeout_s: 120
  - id: six_ttl_eviction_events
    action: status_check
    params:
      snapshot:
        $ref: stages.ttl_event_window.output.snapshot
      metric: ttl_scheduler
      op: ge
      expected: 6
      aggregate: last
      baseline:
        $ref: stages.ttl_before.output.snapshot
  - id: p_clear
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: false
      role: prefill
      requests:
        $ref: stages.silent.output.requests
      rids: all
  - id: d_clear
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: false
      role: decode
      requests:
        $ref: stages.silent.output.requests
      rids: all
  - id: recovery
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: recovery_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 75
  - id: recovery_wait
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 75
  - id: recovery_success
    action: status_outcomes
    params:
      requests:
        $ref: stages.recovery.output.requests
      success_min: 1
      failure_max: 0
  - id: final_health
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: master_http_200
    action: status_check
    params:
      snapshot:
        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
