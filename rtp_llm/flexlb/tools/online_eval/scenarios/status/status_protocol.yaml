      snapshot:
        $ref: stages.prefill_completion_window.output.snapshot
      metric: cohort_enqueued
      op: eq
      expected: 1
      aggregate: all
  - id: completion_window_no_fetch
    action: status_check
    params:
      snapshot:
        $ref: stages.prefill_completion_window.output.snapshot
      metric: fetch_rpc
      op: eq
      expected: 0
      aggregate: all
  - id: post_completion_window
    action: status_sample
    params:
      include:
      - inflight
      - mock
      - debug
      duration_s: 2
      requests:
        $ref: stages.unfetched.output.requests
    timeout_s: 30
  - id: prefill_stays_completed
    action: status_check
    params:
      snapshot:
        $ref: stages.post_completion_window.output.snapshot
      metric: cohort_prefill_completed
      op: eq
      expected: 1
      aggregate: all
  - id: post_completion_no_fetch
    action: status_check
    params:
      snapshot:
        $ref: stages.post_completion_window.output.snapshot
