      op: eq
      expected: 0
      aggregate: all
  - id: client_never_fetches
    action: status_check
    params:
      snapshot:
        $ref: stages.post_completion_window.output.snapshot
      metric: cohort_fetch_invocations
      op: eq
      expected: 0
      aggregate: all
  - id: one_prefill_acceptance
    action: status_check
    params:
      snapshot:
        $ref: stages.post_completion_window.output.snapshot
      metric: prefill_accepted
      op: eq
      expected: 1
      aggregate: last
  - id: separate_recovery
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: separate_recovery_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.separate_recovery.output.requests
    timeout_s: 75
  - id: separate_recovery_wait
