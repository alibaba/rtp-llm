  - status_decode_running_before_prefill
  profiles:
  - batch-window
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: traffic
    action: status_prepare
    params:
      count: 4
      concurrency: 4
      input_len: 2048
      output_len: 2
      consume: deferred
  - id: p_suppress
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: true
      role: prefill
      requests:
        $ref: stages.traffic.output.requests
      rids: all
  - id: d_finished_suppress
    action: status_control
    params:
      fault: status_suppress_finished
      config: {}
      enabled: true
      role: decode
  - id: traffic_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.traffic.output.requests
    timeout_s: 75
  - id: nonempty_window
    action: status_sample
    params:
      duration_s: 15
      until:
        metric: prefill_batches
        op: ge
        value: 1
    timeout_s: 30
  - id: batch_really_dispatched
    action: status_check
    params:
      snapshot:
        $ref: stages.nonempty_window.output.snapshot
      metric: prefill_batches
      op: ge
      expected: 1
      aggregate: last
  - id: intermediate_hold_window
    action: status_sample
    params:
      duration_s: 10
    timeout_s: 30
  - id: intermediate_cannot_retire_prefill
    action: status_check
    params:
      snapshot:
        $ref: stages.intermediate_hold_window.output.snapshot
      metric: prefill_batches
      op: ge
      expected: 1
      aggregate: last
  - id: intermediate_cannot_retire_scheduler
    action: status_check
    params:
      snapshot:
        $ref: stages.intermediate_hold_window.output.snapshot
      metric: scheduler
      op: ge
      expected: 1
      aggregate: last
  - id: p_clear
    action: status_control
    params:
      fault: status_suppress_rids
      config: {}
      enabled: false
      role: prefill
      requests:
        $ref: stages.traffic.output.requests
      rids: all
  - id: d_finished_clear
    action: status_control
    params:
      fault: status_suppress_finished
      config: {}
      enabled: false
      role: decode
  - id: after_clear
    action: status_sample
    params:
      duration_s: 95
      until:
        metric: cleanup_inflight
        op: eq
        value: 0
    timeout_s: 110
  - id: after_clear_scheduler
    action: status_check
    params:
      snapshot:
        $ref: stages.after_clear.output.snapshot
      metric: scheduler
      op: eq
      expected: 0
      aggregate: last
  - id: after_clear_prefill_batches
    action: status_check
    params:
      snapshot:
        $ref: stages.after_clear.output.snapshot
      metric: prefill_batches
      op: eq
      expected: 0
      aggregate: last
  - id: after_clear_decode_load
    action: status_check
    params:
      snapshot:
        $ref: stages.after_clear.output.snapshot
      metric: decode_total_load
      op: eq
      expected: 0
      aggregate: last
  - id: final_health
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: master_http_200
    action: status_check
    params:
      snapshot:
        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
