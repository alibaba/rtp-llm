- id: fetch_error
  legacy_case_ids:
  - status_fetch_error
  profiles:
  - batch-window
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: faulted
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
      expected_rpc_statuses:
      - UNKNOWN
  - id: fetch_fault_on
    action: status_control
    params:
      fault: fetch_error
      config: {}
      enabled: true
      role: prefill
  - id: faulted_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.faulted.output.requests
    timeout_s: 75
  - id: faulted_wait
    action: wait
    params:
      requests:
        $ref: stages.faulted.output.requests
    timeout_s: 75
  - id: fetch_fault_surfaces
    action: status_outcomes
    params:
      requests:
        $ref: stages.faulted.output.requests
      failure_min: 1
      failure_max: 1
  - id: fetch_fault_off
    action: status_control
    params:
      fault: fetch_error
      config: {}
      enabled: false
      role: prefill
  - id: fresh_request
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: fresh_request_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.fresh_request.output.requests
    timeout_s: 75
  - id: fresh_request_wait
    action: wait
    params:
      requests:
        $ref: stages.fresh_request.output.requests
    timeout_s: 75
  - id: fresh_request_success
    action: status_outcomes
    params:
      requests:
        $ref: stages.fresh_request.output.requests
      success_min: 1
      failure_max: 0
  - id: after_fetch_error
    action: status_sample
    params:
      duration_s: 95
      until:
        metric: cleanup_inflight
        op: eq
        value: 0
    timeout_s: 110
  - id: after_fetch_error_scheduler
    action: status_check
    params:
      snapshot:
        $ref: stages.after_fetch_error.output.snapshot
      metric: scheduler
      op: eq
      expected: 0
      aggregate: last
  - id: after_fetch_error_prefill_batches
    action: status_check
    params:
      snapshot:
        $ref: stages.after_fetch_error.output.snapshot
      metric: prefill_batches
      op: eq
      expected: 0
      aggregate: last
  - id: after_fetch_error_decode_load
    action: status_check
    params:
      snapshot:
        $ref: stages.after_fetch_error.output.snapshot
      metric: decode_total_load
      op: eq
      expected: 0
      aggregate: last
  - id: engine_after_fetch
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: prefill_engine_drained
    action: status_check
    params:
      snapshot:
        $ref: stages.engine_after_fetch.output.snapshot
      metric: prefill_engine_inflight
      op: eq
      expected: 0
      aggregate: last
  - id: recovery
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: recovery_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 75
  - id: recovery_wait
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 75
  - id: recovery_success
    action: status_outcomes
    params:
      requests:
        $ref: stages.recovery.output.requests
