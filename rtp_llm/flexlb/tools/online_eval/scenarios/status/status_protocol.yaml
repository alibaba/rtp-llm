# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: status_protocol
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  config_overrides:
    ordering: priority
    queue_timeout_ms: 10000
    request_timeout_ms: 30000
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
variants:
- id: inflight_ttl_cleanup
  profiles:
  - batch-window
  environment:
    n_prefill: 2
    n_decode: 2
    discovery: discovery_file
    perf_preset: fault_env
    config_overrides:
      ordering: priority
      queue_timeout_ms:
        omit: true
  program: inflight_ttl_cleanup
- id: prefill_suppress_all
  profiles:
  - batch-window
  program: prefill_suppress_all
- id: prefill_suppress_finished
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: prefill_suppress_finished
- id: decode_suppress_finished
  profiles:
  - batch-window
  program: decode_suppress_finished
- id: no_respond
  profiles:
  - batch-window
  program: no_respond
- id: version_regress
  profiles:
  - batch-window
  program: version_regress
- id: unknown_rid_finished
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: unknown_rid_finished
- id: unknown_rid_running
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: unknown_rid_running
- id: unknown_batchid
  profiles:
  - batch-window
  program: unknown_batchid
- id: special_ids
  profiles:
  - batch-window
  program: special_ids
- id: unbatched_single_request
  profiles:
  - batch-window
  program: unbatched_single_request
- id: foreign_batchid
  profiles:
  - batch-window
  program: foreign_batchid
- id: duplicate_finished
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: duplicate_finished
- id: cursor_regress
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: cursor_regress
- id: finished_then_running
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: finished_then_running
- id: zombie_completed_running
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: zombie_completed_running
- id: zombie_fake_running
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  program: zombie_fake_running
- id: decode_before_prefill
  profiles:
  - batch-window
  program: decode_before_prefill
  metadata:
    findings:
    - decode_terminal_retires_prefill_promptly.contract
- id: decode_running_before_prefill
  profiles:
  - batch-window
  program: decode_running_before_prefill
- id: decode_waiting_before_prefill
  profiles:
  - batch-window
  program: decode_waiting_before_prefill
- id: fetch_error
  profiles:
  - batch-window
  environment:
    n_prefill: 2
    n_decode: 2
    config_overrides:
      ordering: priority
      queue_timeout_ms: 60000
      request_timeout_ms: 30000
  program: fetch_error
- id: debug_snapshot
  profiles:
  - batch-window
  environment:
    debug_enabled: true
    n_decode: 4
    config_overrides:
      ordering: fifo
      queue_timeout_ms: 60000
  program: debug_snapshot
  metadata:
    requires:
    - enqueue_batch
- id: normal_no_fetch
  profiles:
  - batch-window
  environment:
    debug_enabled: true
    n_decode: 4
    config_overrides:
      ordering: fifo
      queue_timeout_ms: 60000
  program: normal_no_fetch
  metadata:
    requires:
    - enqueue_batch
metadata:
  description: Explicit status protocol boundary programs; old whole-case expected_fail is narrowed to
    reviewed checks only.
  category: status
  tags:
  - protocol
  - migration
