        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
  environment_overrides:
    n_prefill: 2
    n_decode: 2
    config_overrides:
      ordering: priority
      queue_timeout_ms: 60000
      stale_inflight_ms: 30000
- id: debug_snapshot
  legacy_case_ids:
  - master_debug_snapshot
  profiles:
  - batch-window
  requires:
  - enqueue_batch
  environment_overrides:
    debug_enabled: true
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: debug_before
    action: status_sample
    params:
      include:
      - inflight
      - mock
      - debug
      duration_s: 0
    timeout_s: 30
  - id: completed
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: immediate
  - id: completed_dispatch
    action: status_dispatch
    params:
      requests:
        $ref: stages.completed.output.requests
    timeout_s: 75
  - id: completed_wait
    action: wait
    params:
      requests:
        $ref: stages.completed.output.requests
    timeout_s: 75
  - id: completed_success
    action: status_outcomes
    params:
      requests:
        $ref: stages.completed.output.requests
      success_min: 1
      failure_max: 0
  - id: tombstone_window
    action: status_sample
    params:
      include:
      - inflight
      - mock
      - debug
      duration_s: 15
      requests:
        $ref: stages.completed.output.requests
      until:
        metric: scheduler_tombstones
        op: eq
        value: 1
    timeout_s: 30
  - id: resource_free_queryable_tombstone
    action: status_check
    params:
      snapshot:
        $ref: stages.tombstone_window.output.snapshot
      metric: scheduler_tombstones
      op: eq
      expected: 1
      aggregate: last
  - id: final_health
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: master_http_200
    action: status_check
    params:
      snapshot:
        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
- id: normal_no_fetch
  legacy_case_ids:
  - normal_no_fetch_observation
  profiles:
  - batch-window
  requires:
  - enqueue_batch
  environment_overrides:
    debug_enabled: true
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fresh_baseline
    action: status_sample
    params:
      include:
      - inflight
      - mock
      - debug
      duration_s: 0
    timeout_s: 30
  - id: fresh_accepted_zero
    action: status_check
    params:
      snapshot:
        $ref: stages.fresh_baseline.output.snapshot
      metric: accepted
      op: eq
      expected: 0
      aggregate: last
  - id: fresh_fetch_zero
    action: status_check
    params:
      snapshot:
        $ref: stages.fresh_baseline.output.snapshot
      metric: fetch_rpc
      op: eq
      expected: 0
      aggregate: last
  - id: unfetched
    action: status_prepare
    params:
      count: 1
      concurrency: 1
      input_len: 2048
      output_len: 2
      consume: deferred
  - id: schedule_only
    action: status_dispatch
    params:
      requests:
        $ref: stages.unfetched.output.requests
    timeout_s: 75
  - id: prefill_completion_window
    action: status_sample
    params:
      include:
      - inflight
      - mock
      - debug
      duration_s: 20
      requests:
        $ref: stages.unfetched.output.requests
      until:
        metric: cohort_prefill_completed
        op: eq
        value: 1
    timeout_s: 35
  - id: prefill_completed
    action: status_check
    params:
      snapshot:
        $ref: stages.prefill_completion_window.output.snapshot
      metric: cohort_prefill_completed
      op: eq
      expected: 1
