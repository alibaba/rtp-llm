      requests:
        $ref: stages.separate_recovery.output.requests
    timeout_s: 75
  - id: separate_recovery_success
    action: status_outcomes
    params:
      requests:
        $ref: stages.separate_recovery.output.requests
      success_min: 1
      failure_max: 0
  - id: final_health
    action: status_sample
    params:
      duration_s: 0
    timeout_s: 30
  - id: master_http_200
    action: status_check
    params:
      snapshot:
        $ref: stages.final_health.output.snapshot
      metric: master_http
      op: eq
      expected: 200
      aggregate: last
  - id: cleanup
    action: teardown
