    params:
      snapshot:
        $ref: stages.ttl_channel_after.output.snapshot
      metric: ttl_prefill
      op: ge
      expected: 0
      aggregate: last
  - id: off_0
    action: status_control
    params:
      fault: status_suppress_running
      config: {}
      enabled: false
      role: prefill
  - id: off_1
    action: status_control
    params:
      fault: status_suppress_finished
      config: {}
      enabled: false
      role: prefill
  - id: final_owners
