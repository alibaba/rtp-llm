schema_version: 1
id: request_completion
description: Submitted requests reach a business terminal without stream errors.
category: status
tags: [smoke, lifecycle]
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
execution:
  timeout_s: 300
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
  - id: immediate
  - id: deferred_fetch
    profiles: [batch-window, single-batch]
    stage_overrides:
      submit:
        consume: deferred
stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: submit
    action: request
    params:
      input_len: 2048
      output_len: 2
      count: 1
  - id: terminal
    action: wait
    params:
      requests: {$ref: stages.submit.output.requests}
  - id: completed
    action: check
    params:
      actual: {$ref: stages.terminal.output.completed}
      op: eq
      expected: true
  - id: no_errors
    action: check
    params:
      actual: {$ref: stages.terminal.output.error_count}
      op: eq
      expected: 0
  - id: cleanup
    action: teardown
