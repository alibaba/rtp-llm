# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: request_completion
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
execution:
  timeout_s: 300
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: immediate
- id: deferred_fetch
  profiles:
  - batch-window
  - single-batch
- id: client_no_fetch
  profiles: [batch-window, single-batch]
  environment:
    n_prefill: 1
    n_decode: 1
    mock_auto_fetch: false
    mock_fetch_attach_timeout_ms: 4000
    prefill_perf:
      fixed_ms: 1000
      scale: 1.0
      max_batch_tokens: 32768
      max_batch_requests: 32
  execution:
    timeout_s: 600
