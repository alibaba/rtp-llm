schema_version: 1
id: elastic_lifecycle
description: Ordered scale-out, measured preference and rebalance, graceful removal
  and three complete cycles.
category: elastic
profiles:
- batch-window
- single-batch
- single-nonbatch
- window-nonbatch
requires:
- queue
legacy_case_ids:
- elastic_add_flow
- elastic_remove_flow
- elastic_add_remove_cycle
- elastic_rebalance
- elastic_add_preference
- elastic_kv_skew_shrink_hot
- elastic_kv_skew_shrink_cold
- elastic_steady_state_recovery
- elastic_kv_full_shrink
- elastic_transient_imbalance_bound
estimated_duration_s: 420
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
execution:
  timeout_s: 1800
  stage_timeout_s: 50
  cleanup_timeout_s: 120
variants:
- id: normal
  legacy_case_ids:
  - elastic_add_flow
  - elastic_remove_flow
  - elastic_add_remove_cycle
  - elastic_add_preference
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: strict
  stage_overrides:
    preference_shares:
      max_share: 0.5
  legacy_case_ids:
  - elastic_add_flow
  - elastic_remove_flow
  - elastic_add_remove_cycle
  - elastic_add_preference
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: rebalance
  legacy_case_ids:
  - elastic_rebalance
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: rebalance_baseline
    action: elastic_rebalance_batch
    params:
      method: FetchResponse
    timeout_s: 240
  - id: baseline_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      offsets_s:
      - 0
  - id: add
    action: elastic_add
    params:
      role: prefill
  - id: added_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 3
      alive: 3
      port:
        $ref: stages.add.output.port
      present: true
    timeout_s: 35
  - id: rebalance_before
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_anchor
    action: elastic_rebalance_anchor
    params:
      old:
        $ref: stages.baseline_after.output.last
      new:
        $ref: stages.rebalance_before.output.last
      engine:
        $ref: stages.add.output.engine
  - id: rebalance_after_add
    action: elastic_rebalance_batch
    params:
      method: FetchResponse
    timeout_s: 240
  - id: rebalance_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_share
    action: elastic_share
    params:
      before:
        $ref: stages.rebalance_anchor.output.before
      after:
        $ref: stages.rebalance_after.output.last
      engine:
        $ref: stages.add.output.engine
      max_share: 0.6
      old_floor: 0
      exclusive: true
      require_new: true
  - id: teardown
    action: teardown
  profiles:
  - batch-window
- id: kv_skew_hot
  legacy_case_ids:
  - elastic_kv_skew_shrink_hot
  environment_overrides:
    n_decode: 2
  execution:
    timeout_s: 600
    stage_timeout_s: 100
    cleanup_timeout_s: 120
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: seed
    action: elastic_seed
    timeout_s: 120
  - id: metrics
    action: elastic_metrics_start
  - id: flow
    action: elastic_flow_start
    params:
      families:
        $ref: stages.seed.output.families
  - id: baseline
    action: elastic_baseline
    timeout_s: 30
    params:
      observation:
        $ref: stages.metrics.output.observation
      phase: baseline
  - id: scale
    action: elastic_scale
    timeout_s: 75
    params:
      families:
        $ref: stages.seed.output.families
      victim: hot
      drain_timeout_ms: 60000
  - id: transient
    action: elastic_window
    timeout_s: 30
    params:
      observation:
        $ref: stages.metrics.output.observation
      baseline:
        $ref: stages.baseline.output.window
      scale:
        $ref: stages.scale.output.scale
      families:
        $ref: stages.seed.output.families
      victim: hot
      phase: transient
  - id: steady
    action: elastic_window
    timeout_s: 95
    params:
      observation:
        $ref: stages.metrics.output.observation
      baseline:
        $ref: stages.baseline.output.window
      scale:
        $ref: stages.scale.output.scale
      families:
        $ref: stages.seed.output.families
      victim: hot
      phase: steady
  - id: flow_stop
    action: elastic_flow_stop
    timeout_s: 95
    params:
      flow:
        $ref: stages.flow.output.flow
  - id: recovery
    action: elastic_recovery
    timeout_s: 90
  - id: verdict
    action: elastic_verdict
    params:
      baseline:
        $ref: stages.baseline.output.window
      transient:
        $ref: stages.transient.output.window
      steady:
        $ref: stages.steady.output.window
      scale:
        $ref: stages.scale.output.scale
      flow_result:
        $ref: stages.flow_stop.output.result
      recovery:
        $ref: stages.recovery.output.requests
      victim: hot
  - id: teardown
    action: teardown
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: kv_skew_cold
  legacy_case_ids:
  - elastic_kv_skew_shrink_cold
  environment_overrides:
    n_decode: 2
  execution:
    timeout_s: 600
    stage_timeout_s: 100
    cleanup_timeout_s: 120
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: seed
    action: elastic_seed
    timeout_s: 120
  - id: metrics
    action: elastic_metrics_start
  - id: flow
    action: elastic_flow_start
    params:
      families:
        $ref: stages.seed.output.families
  - id: baseline
    action: elastic_baseline
    timeout_s: 30
    params:
      observation:
        $ref: stages.metrics.output.observation
      phase: baseline
  - id: scale
    action: elastic_scale
    timeout_s: 75
    params:
      families:
        $ref: stages.seed.output.families
      victim: cold
      drain_timeout_ms: 60000
  - id: transient
    action: elastic_window
    timeout_s: 30
    params:
      observation:
        $ref: stages.metrics.output.observation
      baseline:
        $ref: stages.baseline.output.window
      scale:
        $ref: stages.scale.output.scale
      families:
        $ref: stages.seed.output.families
      victim: cold
      phase: transient
  - id: steady
    action: elastic_window
    timeout_s: 95
    params:
      observation:
        $ref: stages.metrics.output.observation
      baseline:
        $ref: stages.baseline.output.window
      scale:
        $ref: stages.scale.output.scale
      families:
        $ref: stages.seed.output.families
      victim: cold
      phase: steady
  - id: flow_stop
    action: elastic_flow_stop
    timeout_s: 95
    params:
      flow:
        $ref: stages.flow.output.flow
  - id: recovery
    action: elastic_recovery
    timeout_s: 90
  - id: verdict
    action: elastic_verdict
    params:
      baseline:
        $ref: stages.baseline.output.window
      transient:
        $ref: stages.transient.output.window
      steady:
        $ref: stages.steady.output.window
      scale:
        $ref: stages.scale.output.scale
      flow_result:
        $ref: stages.flow_stop.output.result
      recovery:
        $ref: stages.recovery.output.requests
      victim: cold
  - id: teardown
    action: teardown
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: steady_recovery
  legacy_case_ids:
  - elastic_steady_state_recovery
  execution:
    timeout_s: 900
    stage_timeout_s: 40
    cleanup_timeout_s: 120
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    timeout_s: 35
    params:
      role: DECODE
      discovered: 4
      alive: 4
  - id: observe
    action: elastic_balance_observe
  - id: flow
    action: elastic_balance_flow
    params:
      interval_s: 0.2
  - id: baseline
    action: elastic_balance_window
    timeout_s: 25
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 20
  - id: baseline_guard
    action: elastic_steady_baseline
    params:
      window:
        $ref: stages.baseline.output.window
  - id: remove
    action: elastic_balance_remove
    timeout_s: 110
    params:
      engine: decode-0
      drain_timeout_ms: 60000
  - id: transient
    action: elastic_balance_window
    timeout_s: 25
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 20
  - id: settled_topology
    action: elastic_topology
    timeout_s: 35
    params:
      role: DECODE
      discovered: 3
      alive: 3
      port:
        $ref: stages.remove.output.port
      present: false
  - id: steady
    action: elastic_balance_window
    timeout_s: 65
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 60
  - id: recovery
    action: elastic_pending_recovery
    timeout_s: 100
  - id: flow_stop
    action: elastic_flow_stop
    timeout_s: 65
    params:
      flow:
        $ref: stages.flow.output.flow
  - id: verdict
    action: elastic_steady_verdict
    params:
      baseline:
        $ref: stages.baseline.output.window
      steady:
        $ref: stages.steady.output.window
  - id: teardown
    action: teardown
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: kv_full_shrink
  legacy_case_ids:
  - elastic_kv_full_shrink
  environment_overrides:
    n_prefill: 2
    n_decode: 2
    decode_cache_blocks: 24
  execution:
    timeout_s: 1600
    stage_timeout_s: 40
    cleanup_timeout_s: 120
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: DECODE
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: observe
    action: elastic_balance_observe
  - id: baseline_flow
    action: elastic_balance_flow
    params:
      interval_s: 0.5
      stream_timeout_s: 10
  - id: baseline_ramp
    action: elastic_pause
    params:
      seconds: 1
  - id: baseline
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      since:
        $ref: stages.observe.output.started_s
      duration_s: 20
    timeout_s: 25
  - id: baseline_stop
    action: elastic_flow_stop
    params:
      flow:
        $ref: stages.baseline_flow.output.flow
    timeout_s: 65
  - id: slow_both
    action: engine_control
    params:
      operation: set_perf
      targets:
      - decode-0
      - decode-1
      perf:
        decode_scale: 60
  - id: slow_sync
    action: elastic_pause
    params:
      seconds: 1
  - id: fill_ok
    action: elastic_decode_fill
    params:
      victim: decode-0
      survivor: decode-1
    timeout_s: 70
  - id: remove_ok
    action: elastic_balance_remove
    params:
      engine: decode-0
      drain_timeout_ms: 60000
    timeout_s: 110
  - id: collect_ok
    action: elastic_full_collect
    params:
      requests:
        $ref: stages.fill_ok.output.requests
      mutation:
        $ref: stages.remove_ok.output.mutation
    timeout_s: 100
  - id: accounting_ok
    action: elastic_pending_accounting
    timeout_s: 60
  - id: add_decode
    action: elastic_add
    params:
      role: decode
  - id: restored_topology
    action: elastic_topology
    params:
      role: DECODE
      discovered: 2
      alive: 2
      port:
        $ref: stages.add_decode.output.port
      present: true
    timeout_s: 35
  - id: settled
    action: elastic_balance_mark
  - id: steady_flow
    action: elastic_balance_flow
    params:
      interval_s: 0.5
      stream_timeout_s: 10
  - id: steady_ramp
    action: elastic_pause
    params:
      seconds: 1
  - id: steady
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      since:
        $ref: stages.settled.output.time_s
      duration_s: 60
    timeout_s: 65
  - id: steady_stop
    action: elastic_flow_stop
    params:
      flow:
        $ref: stages.steady_flow.output.flow
    timeout_s: 65
  - id: steady_end
    action: elastic_balance_finish_window
    params:
      window:
        $ref: stages.steady.output.window
      observation:
        $ref: stages.observe.output.observation
  - id: steady_bounds
    action: elastic_full_steady
    params:
      baseline:
        $ref: stages.baseline.output.window
      steady:
        $ref: stages.steady_end.output.window
      newcomer:
        $ref: stages.add_decode.output.engine
  - id: transient_ok
    action: elastic_full_transient
    params:
      observation:
        $ref: stages.observe.output.observation
      fill:
        $ref: stages.fill_ok.output.fill
      mutation:
        $ref: stages.remove_ok.output.mutation
  - id: terminal_ok
    action: elastic_full_terminal
    params:
      result:
        $ref: stages.collect_ok.output.result
      branch: drain_ok
  - id: slow_victim
    action: engine_control
    params:
      operation: set_perf
      targets:
      - decode-1
      perf:
        decode_scale: 1000
  - id: slow_survivor
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.add_decode.output.engine
      perf:
        decode_scale: 60
  - id: timeout_sync
    action: elastic_pause
    params:
      seconds: 1
  - id: fill_timeout
    action: elastic_decode_fill
    params:
      victim: decode-1
      survivor:
        $ref: stages.add_decode.output.engine
    timeout_s: 70
  - id: remove_timeout
    action: elastic_balance_remove
    params:
      engine: decode-1
      drain_timeout_ms: 5000
    timeout_s: 110
  - id: collect_timeout
    action: elastic_full_collect
    params:
      requests:
        $ref: stages.fill_timeout.output.requests
      mutation:
        $ref: stages.remove_timeout.output.mutation
    timeout_s: 100
  - id: observe_full_transient
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 20
    timeout_s: 25
  - id: transient_timeout
    action: elastic_full_transient
    params:
      observation:
        $ref: stages.observe.output.observation
      fill:
        $ref: stages.fill_timeout.output.fill
      mutation:
        $ref: stages.remove_timeout.output.mutation
  - id: terminal_timeout
    action: elastic_full_terminal
    params:
      result:
        $ref: stages.collect_timeout.output.result
      branch: drain_timeout
  - id: restore_survivor
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.add_decode.output.engine
      perf:
        decode_scale: 1
  - id: recovery
    action: elastic_pending_recovery
    timeout_s: 100
  - id: teardown
    action: teardown
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: transient_imbalance
  legacy_case_ids:
  - elastic_transient_imbalance_bound
  environment_overrides:
    n_prefill: 3
    n_decode: 2
    prefill_max_waiting_batches: 16
    config_overrides:
      ordering: priority
      queue_timeout_ms: 60000
      max_waiting_requests_per_prefill_worker: 64
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 3
      alive: 3
    timeout_s: 35
  - id: observe
    action: elastic_transient_observe
  - id: flow
    action: elastic_balance_flow
    params:
      interval_s: 0.1
  - id: baseline
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 20
      since:
        $ref: stages.observe.output.started_s
    timeout_s: 30
  - id: pre_event
    action: elastic_transient_prepare
  - id: burst
    action: elastic_transient_burst
    timeout_s: 10
  - id: remove
    action: elastic_transient_remove
    params:
      requests:
        $ref: stages.burst.output.requests
    timeout_s: 15
  - id: burst_settled
    action: elastic_transient_collect
    params:
      requests:
        $ref: stages.burst.output.requests
    timeout_s: 160
  - id: transient
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 20
      since:
        $ref: stages.remove.output.started_s
    timeout_s: 30
  - id: survivor_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: settled
    action: elastic_balance_mark
  - id: steady
    action: elastic_balance_window
    params:
      observation:
        $ref: stages.observe.output.observation
      duration_s: 60
      since:
        $ref: stages.settled.output.time_s
    timeout_s: 70
  - id: transient_bounds
    action: elastic_transient_bounds
    params:
      pre_event:
        $ref: stages.pre_event.output.snapshot
      baseline:
        $ref: stages.baseline.output.window
      transient:
        $ref: stages.transient.output.window
      master_observation:
        $ref: stages.observe.output.master_observation
  - id: steady_bounds
    action: elastic_transient_steady
    params:
      baseline:
        $ref: stages.baseline.output.window
      steady:
        $ref: stages.steady.output.window
  - id: recovery
    action: elastic_pending_recovery
    timeout_s: 60
  - id: flow_stop
    action: elastic_flow_stop
    params:
      flow:
        $ref: stages.flow.output.flow
    timeout_s: 65
  - id: locality
    action: elastic_transient_locality
    params:
      pre_event:
        $ref: stages.pre_event.output.snapshot
      flow:
        $ref: stages.flow.output.flow
      requests:
        $ref: stages.burst.output.requests
  - id: teardown
    action: teardown
  profiles:
  - batch-window
  requires:
  - enqueue_batch
- id: rebalance_single_batch
  legacy_case_ids:
  - elastic_rebalance
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: rebalance_baseline
    action: elastic_rebalance_batch
    params:
      method: FetchResponse
    timeout_s: 240
  - id: baseline_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      offsets_s:
      - 0
  - id: add
    action: elastic_add
    params:
      role: prefill
  - id: added_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 3
      alive: 3
      port:
        $ref: stages.add.output.port
      present: true
    timeout_s: 35
  - id: rebalance_before
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_anchor
    action: elastic_rebalance_anchor
    params:
      old:
        $ref: stages.baseline_after.output.last
      new:
        $ref: stages.rebalance_before.output.last
      engine:
        $ref: stages.add.output.engine
  - id: rebalance_after_add
    action: elastic_rebalance_batch
    params:
      method: FetchResponse
    timeout_s: 240
  - id: rebalance_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_share
    action: elastic_share
    params:
      before:
        $ref: stages.rebalance_anchor.output.before
      after:
        $ref: stages.rebalance_after.output.last
      engine:
        $ref: stages.add.output.engine
      max_share: 0.6
      old_floor: 0
      exclusive: true
      require_new: true
  - id: teardown
    action: teardown
  profiles:
  - single-batch
- id: rebalance_single_nonbatch
  legacy_case_ids:
  - elastic_rebalance
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: rebalance_baseline
    action: elastic_rebalance_batch
    params:
      method: GenerateStreamCall
    timeout_s: 240
  - id: baseline_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      offsets_s:
      - 0
  - id: add
    action: elastic_add
    params:
      role: prefill
  - id: added_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 3
      alive: 3
      port:
        $ref: stages.add.output.port
      present: true
    timeout_s: 35
  - id: rebalance_before
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_anchor
    action: elastic_rebalance_anchor
    params:
      old:
        $ref: stages.baseline_after.output.last
      new:
        $ref: stages.rebalance_before.output.last
      engine:
        $ref: stages.add.output.engine
  - id: rebalance_after_add
    action: elastic_rebalance_batch
    params:
      method: GenerateStreamCall
    timeout_s: 240
  - id: rebalance_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_share
    action: elastic_share
    params:
      before:
        $ref: stages.rebalance_anchor.output.before
      after:
        $ref: stages.rebalance_after.output.last
      engine:
        $ref: stages.add.output.engine
      max_share: 0.6
      old_floor: 0
      exclusive: true
      require_new: true
  - id: teardown
    action: teardown
  profiles:
  - single-nonbatch
- id: rebalance_window_nonbatch
  legacy_case_ids:
  - elastic_rebalance
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: initial_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 2
      alive: 2
    timeout_s: 35
  - id: rebalance_baseline
    action: elastic_rebalance_batch
    params:
      method: GenerateStreamCall
    timeout_s: 240
  - id: baseline_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      offsets_s:
      - 0
  - id: add
    action: elastic_add
    params:
      role: prefill
  - id: added_topology
    action: elastic_topology
    params:
      role: PREFILL
      discovered: 3
      alive: 3
      port:
        $ref: stages.add.output.port
      present: true
    timeout_s: 35
  - id: rebalance_before
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_anchor
    action: elastic_rebalance_anchor
    params:
      old:
        $ref: stages.baseline_after.output.last
      new:
        $ref: stages.rebalance_before.output.last
      engine:
        $ref: stages.add.output.engine
  - id: rebalance_after_add
    action: elastic_rebalance_batch
    params:
      method: GenerateStreamCall
    timeout_s: 240
  - id: rebalance_after
    action: elastic_timeline
    params:
      engines:
      - prefill-0
      - prefill-1
      - $ref: stages.add.output.engine
      offsets_s:
      - 0
  - id: rebalance_share
    action: elastic_share
    params:
      before:
        $ref: stages.rebalance_anchor.output.before
      after:
        $ref: stages.rebalance_after.output.last
      engine:
        $ref: stages.add.output.engine
      max_share: 0.6
      old_floor: 0
      exclusive: true
      require_new: true
  - id: teardown
    action: teardown
  profiles:
  - window-nonbatch
