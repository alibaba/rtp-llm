# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: elastic_pending_drain
profiles:
- batch-window
- single-batch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
    max_inflight_batches: 2
execution:
  timeout_s: 1200
  stage_timeout_s: 40
  cleanup_timeout_s: 120
variants:
- id: legacy_terminal
  profiles:
  - batch-window
- id: zero_errors
  profiles:
  - batch-window
- id: single_batch_terminal
  profiles:
  - single-batch
