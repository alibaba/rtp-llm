schema_version: 1
id: elastic_kv_skew_shrink
description: Real cache-hit traffic during graceful retirement of the heavy or light cache holder.
category: elastic
profiles: [batch-window]
requires: [enqueue_batch]
tags: [kv, scale_in, high_cache_hit]
legacy_case_ids: [elastic_kv_skew_shrink_hot, elastic_kv_skew_shrink_cold]
estimated_duration_s: 240
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides:
    ordering: priority
    queue_timeout_ms: {omit: true}
execution:
  timeout_s: 600
  stage_timeout_s: 100
  cleanup_timeout_s: 120
variants:
  - id: hot
  - id: cold
    stage_overrides:
      scale: {victim: cold}
      transient: {victim: cold}
      steady: {victim: cold}
      verdict: {victim: cold}
stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: seed
    action: elastic_seed
    timeout_s: 120
  - id: metrics
    action: elastic_metrics_start
  - id: flow
    action: elastic_flow_start
    params:
      families: {$ref: stages.seed.output.families}
  - id: baseline
    action: elastic_baseline
    timeout_s: 30
    params:
      observation: {$ref: stages.metrics.output.observation}
      phase: baseline
  - id: scale
    action: elastic_scale
    timeout_s: 75
    params:
      families: {$ref: stages.seed.output.families}
      victim: hot
      drain_timeout_ms: 60000
  - id: transient
    action: elastic_window
    timeout_s: 30
    params:
      observation: {$ref: stages.metrics.output.observation}
      baseline: {$ref: stages.baseline.output.window}
      scale: {$ref: stages.scale.output.scale}
      families: {$ref: stages.seed.output.families}
      victim: hot
      phase: transient
  - id: steady
    action: elastic_window
    timeout_s: 95
    params:
      observation: {$ref: stages.metrics.output.observation}
      baseline: {$ref: stages.baseline.output.window}
      scale: {$ref: stages.scale.output.scale}
      families: {$ref: stages.seed.output.families}
      victim: hot
      phase: steady
  - id: flow_stop
    action: elastic_flow_stop
    timeout_s: 95
    params:
      flow: {$ref: stages.flow.output.flow}
  - id: recovery
    action: elastic_recovery
    timeout_s: 90
  - id: verdict
    action: elastic_verdict
    params:
      baseline: {$ref: stages.baseline.output.window}
      transient: {$ref: stages.transient.output.window}
      steady: {$ref: stages.steady.output.window}
      scale: {$ref: stages.scale.output.scale}
      flow_result: {$ref: stages.flow_stop.output.result}
      recovery: {$ref: stages.recovery.output.requests}
      victim: hot
  - id: teardown
    action: teardown
# No findings: every typed error, timeout, missing sample or incomplete flow fails.
