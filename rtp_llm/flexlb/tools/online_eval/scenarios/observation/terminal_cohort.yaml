schema_version: 1
id: observed_terminal_cohort
description: Preserve terminal-window client records and independent mock source snapshots.
category: status
tags: [smoke, observation]
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
execution:
  timeout_s: 300
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
  - id: deferred
    profiles: [batch-window, single-batch]
stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: baseline
    action: snapshot
    params:
      sources: [engine_snapshot, engine_requests]
  - id: submit
    action: request
    params:
      count: 2
      output_len: 2
      consume: deferred
  - id: observing
    action: observe
    params:
      mode: start
      sources: [client_records, engine_snapshot, engine_requests]
      requests: {$ref: stages.submit.output.requests}
      max_duration_s: 30
      interval_s: 0.2
      cohort: terminal_in_window
  - id: terminal
    action: wait
    params:
      requests: {$ref: stages.submit.output.requests}
  - id: frozen
    action: observe
    params:
      mode: stop
      observation: {$ref: stages.observing.output.observation}
  - id: completed
    action: check
    params:
      actual: {$ref: stages.terminal.output.completed}
      op: eq
      expected: true
  - id: no_errors
    action: check
    params:
      actual: {$ref: stages.terminal.output.error_count}
      op: eq
      expected: 0
  - id: cleanup
    action: teardown
