      metric: success
      op: eq
      expected: 4
  - id: short_gap
    action: status_control
    params:
      fault: status_no_respond
      selection: first
  - id: two_poll_ticks
    action: recovery_pause
    params:
      duration_s: 0.045
    timeout_s: 30
  - id: resume_status
    action: status_control
    params:
      fault: status_no_respond
      selection: first
      enabled: false
  - id: hung_rpc_deadline_and_resume
    action: recovery_pause
    params:
      duration_s: 2
    timeout_s: 30
  - id: post_gap_generation
