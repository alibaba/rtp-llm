        $ref: stages.post_gap_generation.output.snapshot
      metric: alive_prefill
      op: eq
      expected: 2
  - id: post_gap
    action: recovery_prepare
    params:
      count: 4
      concurrency: 4
      unique_key_count: 3
  - id: post_gap_dispatch
    action: recovery_dispatch
    params:
