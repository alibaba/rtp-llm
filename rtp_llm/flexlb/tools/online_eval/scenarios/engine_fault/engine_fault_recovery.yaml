    timeout_s: 30
  - id: no_new_generation
    action: recovery_check
    params:
      snapshot:
        $ref: stages.post_gap_generation.output.snapshot
      metric: created
      op: le
      expected: 0
      baseline:
        $ref: stages.generation_before.output.snapshot
  - id: discovered_intact
    action: recovery_check
    params:
      snapshot:
        $ref: stages.post_gap_generation.output.snapshot
      metric: discovered_prefill
      op: eq
      expected: 2
  - id: alive_intact
    action: recovery_check
