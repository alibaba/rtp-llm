  - id: scheduler_clean
    action: master_wait_inflight
    params:
      op: eq
      value: 0
    timeout_s: 10
  - id: cleanup
    action: teardown
- id: generate_delay_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  legacy_case_ids:
  - engine_fault_generate_delay
  requires: []
  stages:
