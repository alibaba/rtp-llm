  - id: delayed
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: delayed_terminal
    action: wait
    params:
      requests:
        $ref: stages.delayed.output.requests
    timeout_s: 12
  - id: clear
    action: engine_clear
    params:
