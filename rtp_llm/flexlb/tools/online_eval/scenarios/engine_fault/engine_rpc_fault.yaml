schema_version: 1
id: engine_rpc_fault
description: Explicit request baselines, controlled RPC faults, consumer-complete
  outcomes, recovery and applicable scheduler-owner cleanup.
category: engine_fault
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- engine_fault_enqueue_delay
- engine_fault_generate_delay
- engine_fault_no_respond
- engine_fault_enqueue_error
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  perf_preset: default
execution:
  timeout_s: 300
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: enqueue_delay_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - engine_fault_enqueue_delay
  requires:
  - enqueue_batch
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: baseline
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: baseline_terminal
    action: wait
    params:
      requests:
        $ref: stages.baseline.output.requests
    timeout_s: 15
  - id: inject
    action: engine_inject
    params:
      targets:
      - prefill-0
      - prefill-1
      type: enqueue_delay
      options:
        delay_ms: 1500
  - id: delayed
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: delayed_terminal
    action: wait
    params:
      requests:
        $ref: stages.delayed.output.requests
    timeout_s: 15
  - id: clear
    action: engine_clear
    params:
      fault:
        $ref: stages.inject.output.fault
  - id: recovery
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: recovery_terminal
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 15
  - id: latency
    action: rpc_latency_check
    params:
      baseline:
        $ref: stages.baseline.output.requests
      delayed:
        $ref: stages.delayed.output.requests
      recovery:
        $ref: stages.recovery.output.requests
      metric: request_total
      min_delta_s: 1.2
      recovery_slack_s: 1.0
  - id: scheduler_clean
    action: master_wait_inflight
    params:
      op: eq
      value: 0
    timeout_s: 10
  - id: cleanup
    action: teardown
- id: generate_delay_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - engine_fault_generate_delay
  requires:
  - enqueue_batch
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: baseline
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: baseline_terminal
    action: wait
    params:
      requests:
        $ref: stages.baseline.output.requests
    timeout_s: 12
  - id: inject
    action: engine_inject
    params:
      targets:
      - prefill-0
      - prefill-1
      type: generate_delay
      options:
        delay_ms: 1500
  - id: delayed
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: delayed_terminal
    action: wait
    params:
      requests:
        $ref: stages.delayed.output.requests
    timeout_s: 12
  - id: clear
    action: engine_clear
    params:
      fault:
        $ref: stages.inject.output.fault
  - id: recovery
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: recovery_terminal
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 12
  - id: latency
    action: rpc_latency_check
    params:
      baseline:
        $ref: stages.baseline.output.requests
      delayed:
        $ref: stages.delayed.output.requests
      recovery:
        $ref: stages.recovery.output.requests
      metric: stream_ttft
      min_delta_s: 1.2
      recovery_slack_s: 1.0
  - id: scheduler_clean
    action: master_wait_inflight
    params:
      op: eq
      value: 0
    timeout_s: 10
  - id: cleanup
    action: teardown
- id: generate_delay_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  legacy_case_ids:
  - engine_fault_generate_delay
  requires: []
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: baseline
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: baseline_terminal
    action: wait
    params:
      requests:
        $ref: stages.baseline.output.requests
    timeout_s: 12
  - id: inject
    action: engine_inject
    params:
      targets:
      - prefill-0
      - prefill-1
      type: generate_delay
      options:
        delay_ms: 1500
  - id: delayed
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: delayed_terminal
    action: wait
    params:
      requests:
        $ref: stages.delayed.output.requests
    timeout_s: 12
  - id: clear
    action: engine_clear
    params:
      fault:
        $ref: stages.inject.output.fault
  - id: recovery
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 10
      consume: immediate
  - id: recovery_terminal
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 12
  - id: latency
    action: rpc_latency_check
    params:
      baseline:
        $ref: stages.baseline.output.requests
      delayed:
        $ref: stages.delayed.output.requests
      recovery:
        $ref: stages.recovery.output.requests
      metric: stream_ttft
      min_delta_s: 1.2
      recovery_slack_s: 1.0
  - id: cleanup
    action: teardown
- id: no_respond
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  legacy_case_ids:
  - engine_fault_no_respond
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: inject
    action: engine_inject
    params:
      targets:
      - prefill-0
      - prefill-1
      type: no_respond
      options: {}
  - id: probe
    action: rpc_fault_probe
    params:
      input_len: 2048
      output_len: 10
      schedule_timeout_s: 30
      stream_timeout_s: 5
      expected_rpc_statuses:
      - UNKNOWN
      - INTERNAL
      - UNAVAILABLE
      - DEADLINE_EXCEEDED
      require_error_detail: false
    timeout_s: 45
  - id: clear
    action: engine_clear
    params:
      fault:
        $ref: stages.inject.output.fault
  - id: cancel_failed_delivery
    action: rpc_probe_cancel
    params:
      requests:
        $ref: stages.probe.output.requests
  - id: recovery_settle
    action: balance_pause
    params:
      seconds: 3
  - id: recovery
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 2
      schedule_timeout_s: 30
      stream_timeout_s: 30
  - id: recovery_terminal
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 30
  - id: recovery_success
    action: check
    params:
      actual:
        $ref: stages.recovery_terminal.output.completed
      op: eq
      expected: true
  - id: owner_clean
    action: rpc_probe_owner_clean
    params:
      requests:
        $ref: stages.probe.output.requests
    timeout_s: 95
  - id: cleanup
    action: teardown
  execution:
    timeout_s: 420
- id: enqueue_error
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  legacy_case_ids:
  - engine_fault_enqueue_error
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: inject
    action: engine_inject
    params:
      targets:
      - prefill-0
      - prefill-1
      type: enqueue_error
      options: {}
  - id: probe
    action: rpc_fault_probe
    params:
      input_len: 2048
      output_len: 10
      schedule_timeout_s: 30
      stream_timeout_s: 10
      expected_rpc_statuses:
      - UNKNOWN
      - INTERNAL
      - UNAVAILABLE
      - DEADLINE_EXCEEDED
      require_error_detail: true
    timeout_s: 45
  - id: clear
    action: engine_clear
    params:
      fault:
        $ref: stages.inject.output.fault
  - id: cancel_failed_delivery
    action: rpc_probe_cancel
    params:
      requests:
        $ref: stages.probe.output.requests
  - id: recovery_settle
    action: balance_pause
    params:
      seconds: 3
  - id: recovery
    action: request
    params:
      count: 1
      input_len: 2048
      output_len: 2
      schedule_timeout_s: 30
      stream_timeout_s: 30
  - id: recovery_terminal
    action: wait
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 30
  - id: recovery_success
    action: check
    params:
      actual:
        $ref: stages.recovery_terminal.output.completed
      op: eq
      expected: true
  - id: owner_clean
    action: rpc_probe_owner_clean
    params:
      requests:
        $ref: stages.probe.output.requests
    timeout_s: 95
  - id: cleanup
    action: teardown
  execution:
    timeout_s: 420
