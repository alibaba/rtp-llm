# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: cancel_fence_settlement
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 1
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
variants:
- id: engine_notfound_settle_batch
  profiles:
  - batch-window
  - single-batch
  environment:
    n_prefill: 2
    n_decode: 4
- id: engine_notfound_settle_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  environment:
    n_prefill: 2
    n_decode: 4
- id: prefill_dead_await_terminal
- id: decode_retire_closes_fence
- id: transport_failure_one_shot
- id: unexpected_status_await_terminal
- id: engine_restarted_tombstoned_settle
  profiles:
  - batch-window
  - single-batch
- id: fencing_lost_on_engine_restart
  profiles:
  - batch-window
  - single-batch
