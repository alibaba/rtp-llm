schema_version: 1
id: cancel_fence_settlement
description: Seven cancel fence and authoritative settlement contracts; restart faults require EnqueueBatch.
category: cancel
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
tags:
- migration
- cancel
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 1
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
legacy_case_ids:
- cancel_decode_retire_closes_fence
- cancel_engine_notfound_settle
- cancel_engine_restarted_tombstoned_settle
- cancel_fencing_lost_on_engine_restart
- cancel_prefill_dead_await_terminal
- cancel_transport_failure_one_shot
- cancel_unexpected_status_await_terminal
variants:
- id: engine_notfound_settle_batch
  legacy_case_ids:
  - cancel_engine_notfound_settle
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: target
    action: cancel_prepare
    params:
      count: 1
      concurrency: 1
      output_len: 1
  - id: target_dispatch
    action: cancel_dispatch
    params:
      requests:
        $ref: stages.target.output.requests
    timeout_s: 60
  - id: completion_window
    action: cancel_observe
    params:
      duration_s: 30
      requests:
        $ref: stages.target.output.requests
      until:
        metric: business_finished
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 45
  - id: completed_before_cancel
    action: cancel_check
    params:
      snapshot:
        $ref: stages.completion_window.output.snapshot
      metric: business_finished
      expected: 1
      op: eq
  - id: cancel_master
    action: cancel_rpc
    params:
      requests:
        $ref: stages.target.output.requests
      destination: master
    timeout_s: 30
  - id: direct_original_prefill_cancel
    action: cancel_rpc
    params:
      requests:
        $ref: stages.target.output.requests
      destination: prefill
    timeout_s: 30
  - id: terminal_ack_is_not_found
    action: cancel_check
    params:
      snapshot:
        $ref: stages.direct_original_prefill_cancel.output.snapshot
      metric: engine_not_found
      expected: 1
      op: eq
  - id: old_extra_wait_observed
    action: cancel_observe
    params:
      duration_s: 2
      requests:
        $ref: stages.target.output.requests
      until:
        metric: stream_ended
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 30
  - id: post_terminal
    action: cancel_observe
    params:
      duration_s: 0
      requests:
        $ref: stages.target.output.requests
    timeout_s: 30
  - id: terminal_not_rewritten
    action: cancel_check
    params:
      snapshot:
        $ref: stages.post_terminal.output.snapshot
      metric: engine_cancelled
      expected: 0
      op: eq
  - id: master_drain
    action: cancel_observe
    params:
      duration_s: 10
      until:
        metric: cleanup_inflight
        op: eq
        value: 0
    timeout_s: 30
  - id: master_drain_scheduler
    action: cancel_check
    params:
      snapshot:
        $ref: stages.master_drain.output.snapshot
      metric: scheduler
      expected: 0
      op: eq
  - id: master_drain_prefill_batches
    action: cancel_check
    params:
      snapshot:
        $ref: stages.master_drain.output.snapshot
      metric: prefill_batches
      expected: 0
      op: eq
  - id: master_drain_decode_load
    action: cancel_check
    params:
      snapshot:
        $ref: stages.master_drain.output.snapshot
      metric: decode_total_load
      expected: 0
      op: eq
  - id: recovery
    action: cancel_prepare
    params:
      count: 1
      concurrency: 1
      output_len: 2
  - id: recovery_dispatch
    action: cancel_dispatch
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 60
  - id: recovery_window
    action: cancel_observe
    params:
      duration_s: 30
      requests:
        $ref: stages.recovery.output.requests
      until:
        metric: success
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 45
  - id: recovery_succeeds
    action: cancel_check
    params:
      snapshot:
        $ref: stages.recovery_window.output.snapshot
      metric: success
      expected: 1
      op: eq
  - id: cleanup
    action: teardown
  profiles:
  - batch-window
  - single-batch
  environment_overrides:
    n_prefill: 2
    n_decode: 4
