# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: cancel_lifecycle
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
variants:
- id: basic_batch
  profiles:
  - batch-window
  - single-batch
  program: basic_batch
- id: idempotent_batch
  profiles:
  - batch-window
  - single-batch
  program: idempotent_batch
- id: after_terminal_batch
  profiles:
  - batch-window
  - single-batch
  program: after_terminal_batch
- id: basic_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: basic_nonbatch
- id: idempotent_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: idempotent_nonbatch
- id: after_terminal_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: after_terminal_nonbatch
- id: unknown_rid
  program: unknown_rid
- id: anomaly_path_batch
  profiles:
  - batch-window
  - single-batch
  program: anomaly_path_batch
- id: sibling_isolation_batch
  profiles:
  - batch-window
  - single-batch
  program: sibling_isolation_batch
- id: phase_timing_batch
  profiles:
  - batch-window
  - single-batch
  program: phase_timing_batch
- id: deadline_exempt_inflight_batch
  profiles:
  - batch-window
  - single-batch
  environment:
    config_overrides:
      queue_timeout_ms: 2000
  program: deadline_exempt_inflight_batch
- id: anomaly_path_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: anomaly_path_nonbatch
- id: sibling_isolation_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: sibling_isolation_nonbatch
- id: phase_timing_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: phase_timing_nonbatch
- id: deadline_exempt_inflight_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  environment:
    config_overrides:
      queue_timeout_ms: 2000
  program: deadline_exempt_inflight_nonbatch
- id: schedule_drop_delivered
  profiles:
  - batch-window
  - single-batch
  program: schedule_drop_delivered
  metadata:
    requires:
    - enqueue_batch
- id: stream_break_prefill_autonomous
  profiles:
  - batch-window
  - single-batch
  program: stream_break_prefill_autonomous
  metadata:
    requires:
    - enqueue_batch
- id: stream_break_decode_autonomous
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: stream_break_decode_autonomous
  metadata:
    requires:
    - generate_stream
- id: preemption_victim_batch
  profiles:
  - batch-window
  - single-batch
  environment:
    n_prefill: 1
    n_decode: 1
    config_overrides:
      ordering: priority
      default_priority: 50
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        engine_cancellation:
          ack_timeout_ms: 50
          completion_timeout_ms: 1000
      decode_max_engine_requests: 1
  program: preemption_victim_batch
- id: preemption_victim_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  environment:
    n_prefill: 1
    n_decode: 1
    config_overrides:
      ordering: priority
      default_priority: 50
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        engine_cancellation:
          ack_timeout_ms: 50
          completion_timeout_ms: 1000
      decode_max_engine_requests: 1
  program: preemption_victim_nonbatch
metadata:
  description: Twelve cancellation lifecycle contracts with explicit client, Master and engine boundaries.
  category: cancel
  tags:
  - migration
  - cancel
