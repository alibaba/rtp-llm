schema_version: 1
id: cancel_lifecycle
description: Twelve cancellation lifecycle contracts with explicit client, Master and engine boundaries.
category: cancel
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
tags:
- migration
- cancel
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
execution:
  timeout_s: 600
  stage_timeout_s: 120
  cleanup_timeout_s: 120
legacy_case_ids:
- cancel_after_terminal
- cancel_anomaly_path
- cancel_basic
- cancel_deadline_exempt_inflight
- cancel_idempotent
- cancel_phase_timing
- cancel_preemption_victim
- cancel_schedule_drop_delivered
- cancel_sibling_isolation
- cancel_stream_break_decode_autonomous
- cancel_stream_break_prefill_autonomous
- cancel_unknown_rid
variants:
- id: basic_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - cancel_basic
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: target
    action: cancel_prepare
    params:
      count: 1
      concurrency: 1
      output_len: 10
  - id: target_dispatch
    action: cancel_dispatch
    params:
      requests:
        $ref: stages.target.output.requests
    timeout_s: 60
  - id: first_output_window
    action: cancel_observe
    params:
      duration_s: 15
      requests:
        $ref: stages.target.output.requests
      until:
        metric: first_output
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 30
  - id: first_output_before_cancel
    action: cancel_check
    params:
      snapshot:
        $ref: stages.first_output_window.output.snapshot
      metric: first_output
      expected: 1
      op: eq
  - id: first_master_cancel
    action: cancel_rpc
    params:
      requests:
        $ref: stages.target.output.requests
      destination: master
    timeout_s: 30
  - id: first_master_rpc_ok
    action: cancel_check
    params:
      snapshot:
        $ref: stages.first_master_cancel.output.snapshot
      metric: rpc_ok
      expected: 1
      op: eq
  - id: termination_window
    action: cancel_observe
    params:
      duration_s: 5
      requests:
        $ref: stages.target.output.requests
      until:
        metric: stream_ended
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 30
  - id: stream_terminated
    action: cancel_check
    params:
      snapshot:
        $ref: stages.termination_window.output.snapshot
      metric: stream_ended
      expected: 1
      op: eq
  - id: engine_receipt_window
    action: cancel_observe
    params:
      duration_s: 5
      requests:
        $ref: stages.target.output.requests
      until:
        metric: engine_cancelled
        op: eq
        value: 1
      since:
        $ref: stages.first_master_cancel.output.snapshot
    timeout_s: 30
  - id: engine_receives_cancel_within_five
    action: cancel_check
    params:
      snapshot:
        $ref: stages.engine_receipt_window.output.snapshot
      metric: engine_cancelled
      expected: 1
      op: eq
      within_s: 5
  - id: recovery
    action: cancel_prepare
    params:
      count: 1
      concurrency: 1
      output_len: 2
  - id: recovery_dispatch
    action: cancel_dispatch
    params:
      requests:
        $ref: stages.recovery.output.requests
    timeout_s: 60
  - id: recovery_window
    action: cancel_observe
    params:
      duration_s: 30
      requests:
        $ref: stages.recovery.output.requests
      until:
        metric: success
        op: eq
        value: 1
      include:
      - client_records
    timeout_s: 45
  - id: recovery_succeeds
    action: cancel_check
    params:
      snapshot:
        $ref: stages.recovery_window.output.snapshot
      metric: success
      expected: 1
      op: eq
  - id: closing_drain
    action: cancel_observe
    params:
      duration_s: 10
      until:
        metric: cleanup_inflight
        op: eq
        value: 0
    timeout_s: 30
  - id: closing_drain_scheduler
    action: cancel_check
    params:
      snapshot:
        $ref: stages.closing_drain.output.snapshot
      metric: scheduler
      expected: 0
      op: eq
  - id: closing_drain_prefill_batches
    action: cancel_check
    params:
      snapshot:
        $ref: stages.closing_drain.output.snapshot
      metric: prefill_batches
      expected: 0
      op: eq
  - id: closing_drain_decode_load
    action: cancel_check
    params:
      snapshot:
        $ref: stages.closing_drain.output.snapshot
      metric: decode_total_load
      expected: 0
      op: eq
  - id: cleanup
    action: teardown
