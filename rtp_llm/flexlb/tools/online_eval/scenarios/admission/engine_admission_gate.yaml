# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: engine_admission_gate
profiles:
- batch-window
- single-batch
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 2
  perf_preset: default
  config_overrides:
    ordering: priority
    queue_timeout_ms: 60000
execution:
  timeout_s: 900
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: prefill_concurrency
- id: decode_hard_gate
  environment:
    n_prefill: 2
    n_decode: 1
    config_overrides:
      decode_max_engine_requests: 5000
- id: prefill_waiting_cap
- id: kv_pool_capacity
  environment:
    prefill_cache_blocks: 17
