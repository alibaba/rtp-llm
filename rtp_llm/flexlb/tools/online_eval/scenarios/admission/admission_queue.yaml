# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: admission_queue
profiles:
- batch-window
- single-batch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  perf_preset: default
execution:
  timeout_s: 480
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: queue_depth
  environment:
    n_decode: 4
- id: slo_deadline
  environment:
    config_overrides:
      ordering: priority
      queue_timeout_ms: 1500
- id: master_capacity
  environment:
    config_overrides:
      ordering: priority
      queue_timeout_ms: 60000
      max_outstanding: 2
