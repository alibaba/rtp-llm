# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: prefill_batch_token_budget
profiles:
- batch-window
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 2
  perf_preset: default
  prefill_perf:
    fixed_ms: 3000
    scale: 1
    max_batch_tokens: 1024
    max_batch_requests: 0
  config_overrides:
    ordering: priority
    queue_timeout_ms: 60000
    max_collection_wait_ms: 100
execution:
  timeout_s: 600
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: split
  environment:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 1024
      max_batch_requests: 0
- id: split_fifo
  environment:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 1024
      max_batch_requests: 0
- id: boundary
  environment:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 2048
      max_batch_requests: 0
- id: regroup_disabled
  environment:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 0
      max_batch_requests: 0
