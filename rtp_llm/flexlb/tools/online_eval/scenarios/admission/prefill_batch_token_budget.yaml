schema_version: 1
id: prefill_batch_token_budget
description: One master batch, explicit startup engine token budget and observed Master
  batch/member settlement; construction shape is diagnostic.
category: admission
profiles:
- batch-window
requires:
- enqueue_batch
legacy_case_ids:
- engine_prefill_token_budget_split
- engine_prefill_token_budget_split_fifo
- engine_prefill_token_budget_boundary
- engine_prefill_regroup_disabled_verbatim
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 2
  perf_preset: default
  prefill_perf:
    fixed_ms: 3000
    scale: 1
    max_batch_tokens: 1024
    max_batch_requests: 0
  config_overrides:
    ordering: priority
    queue_timeout_ms: 60000
    max_collection_wait_ms: 100
execution:
  timeout_s: 600
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: split
  legacy_case_ids:
  - engine_prefill_token_budget_split
  environment_overrides:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 1024
      max_batch_requests: 0
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: before
    action: admission_budget_snapshot
    params:
      targets:
      - prefill-0
  - id: wave
    action: admission_burst
    params:
      count: 4
      concurrency: 4
      input_len: 512
      output_len: 2
      consume: deferred
      spacing_s: 0.01
      request_timeout_s: 45
      await_submissions: true
    timeout_s: 60
  - id: park
    action: admission_observe
    params:
      targets:
      - prefill-0
      fields:
      - waiting
      - prefill_waiting_batches
      duration_s: 10
      until_op: ge
      until_value: 1
      reduce: any
    timeout_s: 15
  - id: park_contract
    action: admission_gauge_check
    params:
      snapshot:
        $ref: stages.park.output.snapshot
      fields:
      - waiting
      - prefill_waiting_batches
      stat: max_seen
      op: ge
      expected: 1
  - id: ledger
    action: admission_ledger_observe
    params:
      duration_s: 8
    timeout_s: 15
  - id: linkage
    action: admission_ledger_check
    params:
      samples:
        $ref: stages.ledger.output.samples
      n_requests: 4
      expect_intermediate: true
  - id: done
    action: admission_wait
    params:
      wave:
        $ref: stages.wave.output.wave
    timeout_s: 180
  - id: all_completed
    action: admission_check
    params:
      rows:
        $ref: stages.done.output.rows
      metric: success_count
      expected: 4
      op: eq
      scope: all
  - id: after
    action: admission_budget_snapshot
    params:
      targets:
      - prefill-0
  - id: shape
    action: admission_shape_observe
    params:
      before:
        $ref: stages.before.output.snapshot
      after:
        $ref: stages.after.output.snapshot
      expected:
      - 2
      - 4
      - 2
  - id: batch_identity
    action: admission_budget_check
    params:
      rows:
        $ref: stages.done.output.rows
      snapshot:
        $ref: stages.after.output.snapshot
      metric: batch_identity
  - id: empty
    action: admission_observe
    params:
      targets:
      - prefill-0
      fields:
      - waiting
      - prefill_waiting_batches
      duration_s: 10
      until_op: eq
      until_value: 0
    timeout_s: 15
  - id: park_empty
    action: admission_gauge_check
    params:
      snapshot:
        $ref: stages.empty.output.snapshot
      fields:
      - waiting
      - prefill_waiting_batches
      stat: max_latest
      op: eq
      expected: 0
  - id: master_clean
    action: master_ready
    params:
      target: single
      inflight_zero: true
    timeout_s: 30
  - id: recovery
    action: admission_wave
    params:
      count: 1
      input_len: 2048
      output_len: 2
      request_timeout_s: 30
  - id: recovery_done
    action: admission_wait
    params:
      wave:
        $ref: stages.recovery.output.wave
    timeout_s: 40
  - id: recovered
    action: admission_check
    params:
      rows:
        $ref: stages.recovery_done.output.rows
      metric: success_count
      expected: 1
      op: eq
      scope: all
  - id: cleanup
    action: teardown
- id: split_fifo
  legacy_case_ids:
  - engine_prefill_token_budget_split_fifo
  environment_overrides:
    prefill_perf:
      fixed_ms: 3000
      scale: 1
      max_batch_tokens: 1024
      max_batch_requests: 0
  stages:
