    action: setup
    timeout_s: 180
  - id: before
    action: admission_budget_snapshot
    params:
      targets:
      - prefill-0
  - id: wave
    action: admission_burst
    params:
      count: 4
      concurrency: 4
      input_len: 512
      output_len: 2
      consume: deferred
      spacing_s: 0.01
      request_timeout_s: 45
      await_submissions: true
    timeout_s: 60
  - id: consumers
    action: admission_drain_start
    params:
      waves:
      - $ref: stages.wave.output.wave
    timeout_s: 45
  - id: ledger
    action: admission_ledger_observe
    params:
      duration_s: 8
    timeout_s: 15
  - id: linkage
    action: admission_ledger_check
    params:
      samples:
        $ref: stages.ledger.output.samples
      n_requests: 4
      expect_intermediate: true
  - id: done
    action: admission_drain_collect
    params:
      drain:
        $ref: stages.consumers.output.drain
    timeout_s: 45
  - id: all_completed
    action: admission_check
    params:
      rows:
        $ref: stages.done.output.rows
      metric: success_count
      expected: 4
      op: eq
      scope: all
  - id: client_fifo
    action: admission_budget_check
    params:
      rows:
        $ref: stages.done.output.rows
      metric: client_two_clusters
  - id: after
    action: admission_budget_snapshot
    params:
      targets:
      - prefill-0
  - id: shape
    action: admission_shape_observe
    params:
      before:
        $ref: stages.before.output.snapshot
      after:
        $ref: stages.after.output.snapshot
      expected:
      - 2
      - 4
      - 2
  - id: engine_fifo_shape
    action: admission_engine_clusters
    params:
      rows:
        $ref: stages.done.output.rows
      snapshot:
        $ref: stages.after.output.snapshot
  - id: empty
    action: admission_observe
    params:
      targets:
      - prefill-0
      fields:
      - waiting
      - prefill_waiting_batches
      duration_s: 10
      until_op: eq
      until_value: 0
    timeout_s: 15
  - id: park_empty
    action: admission_gauge_check
    params:
      snapshot:
        $ref: stages.empty.output.snapshot
      fields:
      - waiting
      - prefill_waiting_batches
      stat: max_latest
      op: eq
      expected: 0
  - id: master_clean
    action: master_ready
    params:
      target: single
      inflight_zero: true
    timeout_s: 30
  - id: recovery
    action: admission_wave
    params:
      count: 1
      input_len: 2048
      output_len: 2
      request_timeout_s: 30
  - id: recovery_done
    action: admission_wait
    params:
      wave:
        $ref: stages.recovery.output.wave
    timeout_s: 40
  - id: recovered
    action: admission_check
    params:
      rows:
        $ref: stages.recovery_done.output.rows
      metric: success_count
      expected: 1
      op: eq
      scope: all
  - id: cleanup
    action: teardown
