- id: release_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - kv_g_full_release_no_ghost
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fleet
    action: balance_snapshot
    params:
      role: prefill
  - id: slow
    action: engine_control
    params:
      operation: set_perf
      targets:
      - prefill-0
      - prefill-1
      perf:
        prefill_fixed_ms: 2000
  - id: perf_sync
    action: balance_pause
    params:
      seconds: 1.5
  - id: seed_first
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      stream_timeout_s: 30
      consume: deferred
  - id: first_pending
    action: balance_pending
    params:
      requests:
        $ref: stages.seed_first.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
    timeout_s: 6
  - id: first_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.seed_first.output.requests
      phase: scheduled
  - id: seed_second
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      stream_timeout_s: 15
  - id: second_terminal
    action: wait
    params:
      requests:
        $ref: stages.seed_second.output.requests
    timeout_s: 15
  - id: second_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.seed_second.output.requests
  - id: two_holders
    action: kv_distinct
    params:
      first:
        $ref: stages.first_holder.output.engine
      second:
        $ref: stages.second_holder.output.engine
  - id: first_terminal
    action: wait
    params:
      requests:
        $ref: stages.seed_first.output.requests
    timeout_s: 30
  - id: restore_perf
    action: engine_control
    params:
      operation: set_perf
      targets:
      - prefill-0
      - prefill-1
      perf:
        prefill_fixed_ms: 100
  - id: seed_quiet
    action: kv_snapshot
    params:
      targets:
      - prefill-0
      - prefill-1
      quiet_s: 3.5
    timeout_s: 8
  - id: shared_holders
    action: kv_holders_check
    params:
      snapshot:
        $ref: stages.seed_quiet.output.snapshot
      keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      holders:
      - $ref: stages.first_holder.output.engine
      - $ref: stages.second_holder.output.engine
      match: full_family
  - id: release_first
    action: kv_evict
    params:
      engine:
        $ref: stages.first_holder.output.engine
      keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
  - id: release_second
    action: kv_evict
    params:
      engine:
        $ref: stages.second_holder.output.engine
