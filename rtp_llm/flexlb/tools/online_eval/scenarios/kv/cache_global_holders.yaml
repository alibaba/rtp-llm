# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: cache_global_holders
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 900
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: shared_batch
  profiles:
  - batch-window
  - single-batch
  program: shared_batch
  metadata:
    requires:
    - enqueue_batch
- id: shared_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: shared_nonbatch
- id: release_batch
  profiles:
  - batch-window
  - single-batch
  program: release_batch
  metadata:
    requires:
    - enqueue_batch
- id: release_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: release_nonbatch
- id: redirect_batch
  profiles:
  - batch-window
  - single-batch
  program: redirect_batch
  metadata:
    requires:
    - enqueue_batch
- id: redirect_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: redirect_nonbatch
- id: down_batch
  profiles:
  - batch-window
  - single-batch
  environment:
    n_prefill: 3
    discovery: discovery_file
  program: down_batch
  metadata:
    requires:
    - enqueue_batch
- id: down_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  environment:
    n_prefill: 3
    discovery: discovery_file
  program: down_nonbatch
- id: mixed_batch
