schema_version: 1
id: cache_global_holders
description: Shared holder sets, partial and full eviction, graceful holder removal,
  and interleaved admit/evict routing evidence.
category: kv
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- kv_g_shared_block_both_match
- kv_g_full_release_no_ghost
- kv_g_partial_release_redirect
- kv_g_engine_down_cleanup
- kv_g_sync_convergence
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 900
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: shared_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - kv_g_shared_block_both_match
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fleet
    action: balance_snapshot
    params:
      role: prefill
  - id: slow
    action: engine_control
    params:
      operation: set_perf
      targets:
      - prefill-0
      - prefill-1
      perf:
        prefill_fixed_ms: 2000
  - id: perf_sync
    action: balance_pause
    params:
      seconds: 1.5
  - id: seed_first
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      stream_timeout_s: 30
      consume: deferred
  - id: first_pending
    action: balance_pending
    params:
      requests:
        $ref: stages.seed_first.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
    timeout_s: 6
  - id: first_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.seed_first.output.requests
      phase: scheduled
  - id: seed_second
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      stream_timeout_s: 15
  - id: second_terminal
    action: wait
    params:
      requests:
        $ref: stages.seed_second.output.requests
    timeout_s: 15
  - id: second_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.seed_second.output.requests
  - id: two_holders
    action: kv_distinct
    params:
      first:
        $ref: stages.first_holder.output.engine
      second:
        $ref: stages.second_holder.output.engine
  - id: first_terminal
    action: wait
    params:
      requests:
        $ref: stages.seed_first.output.requests
    timeout_s: 30
  - id: restore_perf
    action: engine_control
    params:
      operation: set_perf
      targets:
      - prefill-0
      - prefill-1
      perf:
        prefill_fixed_ms: 100
  - id: seed_quiet
    action: kv_snapshot
    params:
      targets:
