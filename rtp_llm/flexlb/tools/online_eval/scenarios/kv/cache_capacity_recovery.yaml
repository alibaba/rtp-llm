# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: cache_capacity_recovery
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  perf_preset: default
  config_overrides:
    request_timeout_ms: 60000
execution:
  timeout_s: 900
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: decode_pool_exhaustion_terminal
  environment:
    n_prefill: 2
    n_decode: 1
    decode_cache_blocks: 3
  program: decode_pool_exhaustion_terminal
- id: decode_capacity_park
  environment:
    n_prefill: 2
    n_decode: 4
  program: decode_capacity_park
- id: pool_saturation_evict_reject_recover
  environment:
    n_prefill: 1
    n_decode: 2
    prefill_cache_blocks: 27
    config_overrides:
      max_inflight_per_prefill_worker: 4
    decode_cache_blocks: 32
  program: pool_saturation_evict_reject_recover
- id: capacity_conflict_overflow
  environment:
    n_prefill: 2
    n_decode: 2
    decode_cache_blocks: 180
  program: capacity_conflict_overflow
metadata:
  description: Explicit P/D pool ownership, capacity WAIT versus terminal rejection, pressure eviction
    and affinity overflow.
  category: kv
parameters:
  decode_pool_exhaustion_terminal:
    setup_timeout_s: 180
    d_base_timeout_s: 10
