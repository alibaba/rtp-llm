schema_version: 1
id: cache_capacity_recovery
description: Explicit P/D pool ownership, capacity WAIT versus terminal rejection,
  pressure eviction and affinity overflow.
category: kv
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- kv_decode_pool_exhaustion_terminal
- kv_decode_capacity_park
- kv_pool_saturation_evict_reject_recover
- kv_capacity_conflict_overflow
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  perf_preset: default
execution:
  timeout_s: 900
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: decode_pool_exhaustion_terminal
  legacy_case_ids:
  - kv_decode_pool_exhaustion_terminal
  environment_overrides:
    n_prefill: 2
    n_decode: 1
    decode_cache_blocks: 3
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: d_base
    action: kv_capacity_observe
    params:
      targets:
      - decode-0
      fields:
      - lack_mem_rejects
      - kv_admission_fails
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: p_base
    action: kv_capacity_observe
    params:
      targets:
      - prefill-0
      - prefill-1
      fields:
      - lack_mem_rejects
      - held_blocks
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: probe
    action: kv_capacity_request
    params:
      input_len: 2560
      output_len: 2
      mode: complete
      stream_timeout_s: 15
      schedule_timeout_s: 30
      expected_rpc_statuses:
      - UNKNOWN
      - INTERNAL
      block_keys:
      - 1400000
      - 1400001
    timeout_s: 70
  - id: decode_error
    action: kv_capacity_outcome
    params:
      requests:
      - $ref: stages.probe.output.requests
      metric: typed_error
      tokens:
      - lack_mem
      - decode-side
      max_s: 3
  - id: d_grew
    action: kv_capacity_observe
    params:
      targets:
      - decode-0
      fields:
      - lack_mem_rejects
      duration_s: 10
      interval_s: 0.5
      until_field: lack_mem_rejects
      until_op: eq
      until_value: 1
      baseline:
        $ref: stages.d_base.output.observation
    timeout_s: 15
  - id: exact_once
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.d_grew.output.observation
      field: lack_mem_rejects
      op: eq
      expected: 1
      stat: latest
      baseline:
        $ref: stages.d_base.output.observation
  - id: counter_sync
    action: master_mark
    params:
      wait_s: 0.5
  - id: d_after
    action: kv_capacity_observe
    params:
      targets:
      - decode-0
      fields:
      - kv_admission_fails
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: retry_counter_flat
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.d_after.output.observation
      field: kv_admission_fails
      op: eq
      expected: 0
      stat: all
      baseline:
        $ref: stages.d_base.output.observation
  - id: p_after
    action: kv_capacity_observe
    params:
      targets:
      - prefill-0
      - prefill-1
      fields:
      - lack_mem_rejects
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: prefill_rejects_flat
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.p_after.output.observation
      field: lack_mem_rejects
      op: eq
      expected: 0
      stat: all
      baseline:
        $ref: stages.p_base.output.observation
  - id: released
    action: kv_capacity_observe
    params:
      targets:
      - prefill-0
      - prefill-1
      fields:
      - held_blocks
      duration_s: 10
      interval_s: 0.5
      until_field: held_blocks
      until_op: eq
      until_value: 0
      baseline:
        $ref: stages.p_base.output.observation
    timeout_s: 15
  - id: p_leases_released
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.released.output.observation
      field: held_blocks
      op: eq
      expected: 0
      stat: latest
      baseline:
        $ref: stages.p_base.output.observation
  - id: d_recovery_base
    action: kv_capacity_observe
    params:
      targets:
      - decode-0
      fields:
      - lack_mem_rejects
      - kv_admission_fails
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: headroom
    action: kv_capacity_request
    params:
      input_len: 1024
      output_len: 2
      mode: complete
      stream_timeout_s: 15
      schedule_timeout_s: 30
      expected_rpc_statuses: []
      block_keys:
      - 1410000
      - 1410001
    timeout_s: 70
  - id: headroom_succeeded
    action: kv_capacity_outcome
    params:
      requests:
      - $ref: stages.headroom.output.requests
      metric: success
  - id: recovery_sync
    action: master_mark
    params:
      wait_s: 0.5
  - id: d_stable
    action: kv_capacity_observe
    params:
      targets:
      - decode-0
      fields:
      - lack_mem_rejects
      - kv_admission_fails
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: terminal_counter_stable
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.d_stable.output.observation
      field: lack_mem_rejects
      op: eq
      expected: 0
      stat: all
      baseline:
        $ref: stages.d_recovery_base.output.observation
  - id: retry_counter_stable
    action: kv_capacity_counter
    params:
      observations:
      - $ref: stages.d_stable.output.observation
      field: kv_admission_fails
      op: eq
      expected: 0
      stat: all
      baseline:
        $ref: stages.d_base.output.observation
  - id: master_clean
    action: master_ready
    params:
      target: single
      inflight_zero: true
    timeout_s: 30
  - id: engine_clean
    action: admission_engine_clean
    params:
      targets:
      - prefill-0
      - prefill-1
      - decode-0
    timeout_s: 30
  - id: recovery
    action: kv_capacity_request
    params:
      input_len: 2048
      output_len: 2
      mode: complete
      stream_timeout_s: 30
      schedule_timeout_s: 30
      expected_rpc_statuses: []
    timeout_s: 70
  - id: recovered
    action: kv_capacity_outcome
    params:
      requests:
      - $ref: stages.recovery.output.requests
      metric: success
  - id: cleanup
    action: teardown
- id: decode_capacity_park
  legacy_case_ids:
