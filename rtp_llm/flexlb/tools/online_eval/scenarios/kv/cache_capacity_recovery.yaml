# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: cache_capacity_recovery
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  perf_preset: default
execution:
  timeout_s: 900
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: decode_pool_exhaustion_terminal
  environment:
    n_prefill: 2
    n_decode: 1
    decode_cache_blocks: 3
- id: decode_capacity_park
  environment:
    n_prefill: 2
    n_decode: 4
- id: pool_saturation_evict_reject_recover
  environment:
    n_prefill: 1
    n_decode: 2
    prefill_cache_blocks: 27
    decode_cache_blocks: 32
- id: capacity_conflict_overflow
  environment:
    n_prefill: 2
    n_decode: 2
    decode_cache_blocks: 180
