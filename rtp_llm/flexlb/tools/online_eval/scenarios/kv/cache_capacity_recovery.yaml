  environment_overrides:
    n_prefill: 2
    n_decode: 4
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: pressure
    action: kv_capacity_pressure
    params:
      targets:
      - decode-0
      - decode-1
      - decode-2
      - decode-3
  - id: status_sync
    action: master_mark
    params:
      wait_s: 1.5
  - id: before
    action: kv_capacity_watermark
  - id: probe
    action: kv_capacity_request
    params:
      input_len: 2048
      output_len: 10
      mode: complete
      stream_timeout_s: 15
      schedule_timeout_s: 5
      expected_rpc_statuses:
      - DEADLINE_EXCEEDED
    timeout_s: 70
  - id: schedule_stayed_pending
    action: kv_capacity_outcome
    params:
      requests:
      - $ref: stages.probe.output.requests
      metric: schedule_deadline
  - id: delivery_sync
    action: master_mark
    params:
      wait_s: 0.5
  - id: delivery
    action: kv_capacity_observe
    params:
      targets:
      - prefill-0
      - prefill-1
      - decode-0
      - decode-1
      - decode-2
      - decode-3
      fields:
      - request_lifecycle
      duration_s: 0
      interval_s: 0.5
    timeout_s: 10
  - id: not_delivered
    action: kv_capacity_not_delivered
    params:
      requests:
        $ref: stages.probe.output.requests
      observation:
        $ref: stages.delivery.output.observation
  - id: cancel
    action: kv_capacity_cancel
    params:
      requests:
        $ref: stages.probe.output.requests
  - id: cancel_sync
    action: master_mark
    params:
      wait_s: 0.5
  - id: watermark_restored
    action: kv_capacity_watermark_wait
    params:
      baseline:
        $ref: stages.before.output.watermark
    timeout_s: 10
  - id: clear
    action: kv_capacity_clear
    params:
      pressure:
        $ref: stages.pressure.output.pressure
  - id: recovery_status_sync
    action: master_mark
    params:
      wait_s: 2
  - id: fresh
    action: kv_capacity_request
    params:
      input_len: 2048
      output_len: 2
      mode: complete
      stream_timeout_s: 15
      schedule_timeout_s: 30
      expected_rpc_statuses: []
    timeout_s: 70
  - id: fresh_succeeded
