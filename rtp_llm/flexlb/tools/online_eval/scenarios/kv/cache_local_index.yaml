  - window-nonbatch
  environment:
    prefill_cache_blocks: 16
  program: evict_nonbatch
  metadata:
    requires: []
- id: isolation_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  execution:
    timeout_s: 600
  program: isolation_nonbatch
  metadata:
    requires: []
