# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: cache_local_index
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 360
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: continuity_batch
  profiles:
  - batch-window
  - single-batch
  program: continuity_batch
  metadata:
    requires:
    - enqueue_batch
- id: continuity_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: continuity_nonbatch
- id: evict_batch
  profiles:
  - batch-window
  - single-batch
  environment:
    prefill_cache_blocks: 16
  program: evict_batch
  metadata:
    requires:
    - enqueue_batch
- id: isolation_batch
  profiles:
  - batch-window
  - single-batch
  execution:
    timeout_s: 600
  program: isolation_batch
  metadata:
    requires:
    - enqueue_batch
- id: evict_nonbatch
  profiles:
