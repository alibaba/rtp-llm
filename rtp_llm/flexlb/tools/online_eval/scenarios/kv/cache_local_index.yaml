schema_version: 1
id: cache_local_index
description: Ledger-separated shared seeding, explicit per-engine gap/tail eviction,
  contiguous-prefix checks and five serial routing continuations.
category: kv
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- kv_pe_prefix_continuity
- kv_pe_evict_zero_match
- kv_pe_admit_isolation
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 360
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: continuity_batch
  profiles:
  - batch-window
  - single-batch
  requires:
  - enqueue_batch
  stage_overrides:
    seed_first:
      consume: deferred
  legacy_case_ids:
  - kv_pe_prefix_continuity
- id: continuity_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  legacy_case_ids:
  - kv_pe_prefix_continuity
- id: evict_batch
  profiles:
  - batch-window
  - single-batch
  legacy_case_ids:
  - kv_pe_evict_zero_match
  environment_overrides:
    prefill_cache_blocks: 16
  requires:
  - enqueue_batch
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: prime
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      consume: immediate
      stream_timeout_s: 15
  - id: prime_terminal
    action: wait
    params:
      requests:
        $ref: stages.prime.output.requests
    timeout_s: 15
  - id: holder
    action: kv_landing
    params:
      requests:
        $ref: stages.prime.output.requests
      phase: terminal
  - id: prime_quiet
    action: kv_snapshot
    params:
      targets:
      - prefill-0
      - prefill-1
      quiet_s: 3.5
    timeout_s: 8
  - id: positive
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      consume: immediate
      stream_timeout_s: 15
  - id: positive_terminal
    action: wait
    params:
      requests:
        $ref: stages.positive.output.requests
    timeout_s: 15
  - id: positive_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.positive.output.requests
      phase: terminal
  - id: positive_affinity
    action: kv_same
    params:
      first:
        $ref: stages.holder.output.engine
      second:
        $ref: stages.positive_holder.output.engine
  - id: evict
    action: kv_evict
    params:
      engine:
        $ref: stages.holder.output.engine
      keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
  - id: eviction_quiet
    action: kv_snapshot
    params:
      targets:
      - prefill-0
      - prefill-1
      quiet_s: 3.5
    timeout_s: 8
  - id: eviction_membership
    action: kv_membership_check
    params:
      snapshot:
        $ref: stages.eviction_quiet.output.snapshot
      engine:
        $ref: stages.holder.output.engine
      keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      relation: none
  - id: wave
    action: request
    params:
      count: 20
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      consume: deferred
      stream_timeout_s: 30
      post_issue_delay_s: 0.12
  - id: wave_terminal
    action: wait
    params:
      requests:
        $ref: stages.wave.output.requests
    timeout_s: 30
  - id: spread
    action: kv_spread_check
    params:
      requests:
      - $ref: stages.wave.output.requests
      min_samples: 20
      bands:
        strict: 0.65
        normal: 0.75
        loose: 0.85
  - id: cleanup
    action: teardown
- id: isolation_batch
  profiles:
  - batch-window
