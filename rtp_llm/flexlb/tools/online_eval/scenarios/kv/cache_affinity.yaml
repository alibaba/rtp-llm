    baseline_windows: 3
    saturation_windows: 6
    recovery_windows: 10
    concurrency: 128
    recovery_consecutive: 2
    min_busy_share: 0.9
    calibration_runs: 3
    hit_strict: 0.962367
    eviction_strict: 0.127133
    holders_strict: 1
    hit_normal: 0.939481
    eviction_normal: 0.165404
    holders_normal: 1
    hit_loose: 0.885854
    eviction_loose: 0.254267
    holders_loose: 1
  program: leader_spill_multi
  metadata:
    findings:
    - healthy.hit
    - healthy.eviction
    - healthy.holders
- id: leader_spill_p4
  profiles:
  - single-batch
  environment:
    n_prefill: 4
    n_decode: 2
    prefill_cache_blocks: 64
    decode_cache_blocks: 64
  parameters:
    receiver_retention_blocks: 6
    hot_blocks: 10
    background_blocks: 4
