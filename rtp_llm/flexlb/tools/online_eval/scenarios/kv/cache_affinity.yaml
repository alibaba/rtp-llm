    slow_ms: 15000
    normal_ms: 100
    background_every: 8
    window_s: 2
    baseline_windows: 3
    saturation_windows: 6
    recovery_windows: 10
    concurrency: 128
    recovery_consecutive: 2
    min_busy_share: 0.9
    calibration_runs: 3
    hit_strict: 0.962367
    eviction_strict: 0.126818
    holders_strict: 1
    hit_normal: 0.939481
    eviction_normal: 0.164994
    holders_normal: 1
    hit_loose: 0.885854
    eviction_loose: 0.253636
    holders_loose: 1
  program: leader_spill_multi
  metadata:
    findings:
    - healthy.hit
    - healthy.eviction
    - healthy.holders
- id: prefix_batch
  profiles:
  - batch-window
  - single-batch
  program: prefix_batch
  metadata:
    requires:
    - enqueue_batch
- id: prefix_nonbatch
  profiles:
  - single-nonbatch
  - window-nonbatch
  program: prefix_nonbatch
- id: hot_tension
  program: hot_tension
- id: mixed_tiers
  program: mixed_tiers
- id: leader_spill_batch
  profiles:
  - batch-window
  - single-batch
