# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: cache_affinity
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  perf_preset: default
execution:
  timeout_s: 900
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: leader_spill_p2
  profiles:
  - single-batch
  environment:
    n_prefill: 2
    n_decode: 2
    prefill_cache_blocks: 64
    decode_cache_blocks: 64
  parameters:
    receiver_retention_blocks: 6
    hot_blocks: 10
    background_blocks: 4
    interval_s: 0.15
    steady_interval_s: 0.4
    slow_ms: 15000
    normal_ms: 100
    background_every: 8
    window_s: 2
    baseline_windows: 3
    saturation_windows: 6
    recovery_windows: 10
    concurrency: 128
    recovery_consecutive: 2
    min_busy_share: 0.9
    calibration_runs: 3
    hit_strict: 0.962367
    eviction_strict: 0.126957
    holders_strict: 1
    hit_normal: 0.939481
    eviction_normal: 0.165174
    holders_normal: 1
    hit_loose: 0.885854
    eviction_loose: 0.253913
    holders_loose: 1
  program: leader_spill_multi
  metadata:
    findings:
    - healthy.hit
    - healthy.eviction
    - healthy.holders
- id: leader_spill_p3
  profiles:
  - single-batch
