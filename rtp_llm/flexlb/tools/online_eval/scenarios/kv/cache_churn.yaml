      - prefill-0
      - prefill-1
      quiet_s: 0
    timeout_s: 10
  - id: w0_r0
    action: request
    params:
      count: 1
      input_len: 10240
      output_len: 2
      block_keys:
      - 810000
      - 810001
      - 810002
      - 810003
      - 810004
      - 810005
      - 810006
      - 810007
      - 810008
      - 810009
      stream_timeout_s: 15
  - id: w0_r0_done
    action: wait
    params:
      requests:
        $ref: stages.w0_r0.output.requests
    timeout_s: 15
  - id: w0_r0_hit
    action: kv_hit_observe
    params:
      snapshot:
        $ref: stages.w0_r0_before.output.snapshot
      requests:
