# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: cache_churn
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 1200
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: hot_churn
  environment:
    prefill_cache_blocks: 24
- id: lru_affinity
  environment:
    prefill_cache_blocks: 4
    decode_cache_blocks: 4
- id: referenced_occupancy
  environment:
    prefill_cache_blocks: 4
    decode_cache_blocks: 12
