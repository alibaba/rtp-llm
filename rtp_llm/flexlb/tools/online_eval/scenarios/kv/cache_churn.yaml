schema_version: 1
id: cache_churn
description: Pre-request hit rate and windowed holder masks under four-family churn;
  bounded LRU replay retry and capacity eviction.
category: kv
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- kv_storm_hot_churn
- kv_lru_eviction_affinity
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 2
  decode_cache_blocks: 12
  perf_preset: default
execution:
  timeout_s: 1200
  stage_timeout_s: 30
  cleanup_timeout_s: 120
variants:
- id: hot_churn
  legacy_case_ids:
  - kv_storm_hot_churn
  environment_overrides:
    prefill_cache_blocks: 24
  stages:
