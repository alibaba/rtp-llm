  - id: pressure_holder
    action: kv_landing
    params:
      requests:
        $ref: stages.pressure.output.requests
  - id: pressure_snapshot
    action: kv_snapshot
    params:
      targets:
      - prefill-0
      - prefill-1
      quiet_s: 0
    timeout_s: 10
  - id: pressure_counters
    action: kv_cache_statistics
    params:
      snapshot:
        $ref: stages.pressure_snapshot.output.snapshot
      engine:
        $ref: stages.pressure_holder.output.engine
  - id: pressure_keys
    action: check
    params:
      actual:
        $ref: stages.pressure_counters.output.keys
      op: le
      expected: 4
  - id: pressure_evictions
    action: check
    params:
      actual:
        $ref: stages.pressure_counters.output.evictions
      op: ge
      expected: 1
  - id: prefix_affinity
    action: kv_same
    params:
      first:
        $ref: stages.prime_holder.output.engine
      second:
        $ref: stages.pressure_holder.output.engine
  - id: cleanup
    action: teardown
