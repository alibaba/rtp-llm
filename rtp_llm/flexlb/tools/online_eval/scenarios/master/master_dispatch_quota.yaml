schema_version: 1
id: master_dispatch_quota
description: Fill one batch quota, stop its prefill, observe blocked traffic and independent
  scheduler TTL cleanup, then recover.
category: master
profiles:
- batch-window
legacy_case_ids:
- master_quota_block
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 1
  master_layout: single
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
    max_inflight_batches: 1
execution:
  timeout_s: 540
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: single_prefill_ttl
stages:
- id: setup
  action: setup
  timeout_s: 180
- id: slow
  action: engine_control
  params:
    operation: set_perf
    targets:
    - prefill-0
    perf:
      prefill_fixed_ms: 10000
- id: fill
  action: request
  params:
    count: 4
    output_len: 10
    consume: deferred
- id: quota_held
  action: master_wait_inflight
  params:
    op: ge
    value: 1
  timeout_s: 15
- id: stop
  action: engine_control
  params:
    operation: stop
    targets:
    - prefill-0
- id: eviction_begin
  action: master_mark
  params:
    wait_s: 3
- id: blocked
  action: master_request_batch
  params:
    count: 10
    concurrency: 10
    request_timeout_s: 12
- id: block_verdict
  action: check
  params:
    actual:
      $ref: stages.blocked.output.success_rate
    op: le
    expected: 0.5
- id: ttl_empty
  action: master_wait_inflight
  params:
    op: eq
    value: 0
  timeout_s: 95
- id: start
  action: engine_control
  params:
    operation: start
    targets:
    - prefill-0
- id: normal_perf
  action: engine_control
  params:
    operation: set_perf
    targets:
    - prefill-0
    perf:
      prefill_fixed_ms: 100
- id: ready
  action: master_ready
  params:
    inflight_zero: true
  timeout_s: 30
- id: settle
  action: master_mark
  params:
    wait_s: 2
- id: recovery
  action: master_request_batch
  params:
    count: 20
    concurrency: 1
    request_timeout_s: 15
  timeout_s: 330
- id: recovered
  action: check
  params:
    actual:
      $ref: stages.recovery.output.success_rate
    op: ge
    expected: 0.9
- id: cleanup
  action: teardown
