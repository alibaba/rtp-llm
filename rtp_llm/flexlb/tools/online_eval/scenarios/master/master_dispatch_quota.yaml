# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: master_dispatch_quota
profiles:
- batch-window
- single-batch
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 1
  master_layout: single
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
    max_inflight_batches: 1
execution:
  timeout_s: 540
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: single_prefill_ttl
