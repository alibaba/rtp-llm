# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: client_fallback_failback
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  master_layout: dual_standalone
execution:
  timeout_s: 720
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: all_masters_down
- id: wraparound
  parameters:
    checkpoint_window_s: 5
    max_owner_load: 128
- id: negative_errorcode
  profiles:
  - batch-window
- id: direct_generate_error
  environment:
    master_layout: single
