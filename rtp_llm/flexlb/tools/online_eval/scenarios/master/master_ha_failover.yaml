# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: master_ha_failover
profiles:
- batch-window
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  master_layout: dual_standalone
execution:
  timeout_s: 480
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: standalone_a_to_b
