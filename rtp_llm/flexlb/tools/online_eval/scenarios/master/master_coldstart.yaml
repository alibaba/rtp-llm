schema_version: 1
id: master_coldstart
description: Twenty requests with ten concurrent clients immediately after readiness,
  retaining topology samples and placement evidence.
category: master
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
legacy_case_ids:
- master_coldstart_burst
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  master_layout: single
  master_stable_window_s: 0
execution:
  timeout_s: 480
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: burst_twenty
stages:
- id: setup
  action: setup
  timeout_s: 180
- id: burst
  action: master_request_batch
  params:
    target: single
    count: 20
    concurrency: 10
    request_timeout_s: 15
    sample_after_s: 10
    coldstart: true
- id: verdict
  action: master_coldstart_check
  params:
    snapshot:
      $ref: stages.burst.output.snapshot
- id: cleanup
  action: teardown
