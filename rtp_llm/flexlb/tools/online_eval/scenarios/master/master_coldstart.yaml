# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: master_coldstart
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  master_layout: single
  master_stable_window_s: 0
execution:
  timeout_s: 480
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: burst_twenty
