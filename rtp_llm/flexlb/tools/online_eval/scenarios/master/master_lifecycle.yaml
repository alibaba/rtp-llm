# Configuration for the registered Python case; execution and assertions live in Python.
schema_version: 2
case: master_lifecycle
profiles:
- batch-window
- single-nonbatch
- single-batch
- window-nonbatch
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
  discovery: discovery_file
  perf_preset: fault_env
  config_overrides: {}
execution:
  timeout_s: 420
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: kill_single
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
  environment:
    config_overrides:
      ordering: priority
      queue_timeout_ms:
        omit: true
- id: freeze_short_long
  environment:
    master_layout: dual_standalone
    discovery: file
    perf_preset: default
    config_overrides: {}
- id: kill_dual_b_to_a
  profiles:
  - batch-window
  execution:
    timeout_s: 1080
    stage_timeout_s: 60
    cleanup_timeout_s: 120
  environment:
    master_layout: dual_standalone
    discovery: file
    perf_preset: default
    config_overrides: {}
