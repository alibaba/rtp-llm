        output_len: 2
  - id: wave_settled
    action: priority_settled
    timeout_s: 95
    params:
      requests:
        $ref: stages.wave.output.requests
  - id: placeholder_terminal
    action: priority_wait
    timeout_s: 35
    params:
      requests:
        $ref: stages.placeholder.output.requests
  - id: wave_terminal
    action: priority_wait
    timeout_s: 235
    params:
      requests:
        $ref: stages.wave.output.requests
  - id: expiry
    action: priority_expiry
    params:
      placeholder:
        $ref: stages.placeholder.output.requests
      wave:
        $ref: stages.wave.output.requests
  - id: restore
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.fleet.output.prefill
      perf:
        prefill_fixed_ms: 100
  - id: teardown
    action: teardown
    timeout_s: 120
  profiles:
  - single-nonbatch
