schema_version: 1
id: priority_queue
description: Concurrent priority queue ordering with explicit terminal and owner checks.
category: priority
legacy_case_ids:
- prio_same_level_fifo
profiles:
- single-nonbatch
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 4
  config_overrides:
    ordering: priority
    queue_timeout_ms:
      omit: true
    max_inflight_requests_per_worker: 1
    max_waiting_requests_per_prefill_worker: 8
execution:
  timeout_s: 600
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: same_level_fifo
  legacy_case_ids:
  - prio_same_level_fifo
stages:
- id: setup
  action: setup
  timeout_s: 180
- id: fleet
  action: priority_fleet
- id: slow
  action: engine_control
  params:
    operation: set_perf
    targets:
    - $ref: stages.fleet.output.prefill
    perf:
      prefill_fixed_ms: 3000
- id: sync
  action: balance_pause
  params:
    seconds: 1.5
- id: wave
  action: priority_start
  timeout_s: 15
  params:
    gap_s: 0.15
    requests:
    - tag: peer0
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer1
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer2
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer3
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer4
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer5
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer6
      priority: 50
      input_len: 2048
      output_len: 2
- id: terminal
  action: priority_wait
  timeout_s: 360
  params:
    requests:
      $ref: stages.wave.output.requests
- id: fifo
  action: priority_fifo
  params:
    requests:
      $ref: stages.wave.output.requests
- id: owner_clean
  action: balance_clean
  timeout_s: 30
- id: restore
  action: engine_control
  params:
    operation: set_perf
    targets:
    - $ref: stages.fleet.output.prefill
    perf:
      prefill_fixed_ms: 100
- id: teardown
  action: teardown
  timeout_s: 120
