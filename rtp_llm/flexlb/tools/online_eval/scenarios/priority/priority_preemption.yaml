  - id: r2_wave_drain
    action: preemption_wait
    timeout_s: 175
    params:
      requests:
        $ref: stages.r2_wave.output.requests
  - id: r2_same_priority
    action: preemption_comparator_half
    params:
      placeholder:
        $ref: stages.r2_placeholder.output.requests
      wave:
        $ref: stages.r2_wave.output.requests
      ordering: fifo
  - id: r2_master_clean
    action: balance_clean
    timeout_s: 30
  - id: comparator_verdict
    action: preemption_comparator_pair
    params:
      priority_half:
        $ref: stages.r1_same_priority.output.passed
      fifo_half:
        $ref: stages.r2_same_priority.output.passed
  - id: restore
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.fifo_fleet.output.prefill
      perf:
        prefill_fixed_ms: 100
  - id: teardown
    action: teardown
    timeout_s: 120
  environment_overrides:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
- id: config_strict_reject
  legacy_case_ids:
  - atpm_config_strict_reject
  environment_overrides:
    config_overrides:
      ordering: priority
      decision: single
      dispatcher: non_batch
      queue_timeout_ms:
        omit: true
      max_inflight_requests_per_worker: 1
      max_waiting_requests_per_prefill_worker: 8
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: removed_auto_tpm
    action: environment_startup_probe
    timeout_s: 300
    params:
      config_overrides:
        ordering: priority
        decision: single
        dispatcher: non_batch
        queue_timeout_ms:
          omit: true
        max_inflight_requests_per_worker: 1
        max_waiting_requests_per_prefill_worker: 8
      mutation: removed_auto_tpm
  - id: fifo_default_priority
    action: environment_startup_probe
    timeout_s: 300
    params:
      config_overrides:
        ordering: fifo
        decision: single
        dispatcher: non_batch
        queue_timeout_ms:
          omit: true
        max_inflight_requests_per_worker: 1
        max_waiting_requests_per_prefill_worker: 8
      mutation: fifo_default_priority
  - id: owned_without_cancellation
    action: environment_startup_probe
    timeout_s: 300
    params:
      config_overrides:
        ordering: priority
        decision: single
        dispatcher: non_batch
        queue_timeout_ms:
          omit: true
        max_inflight_requests_per_worker: 1
        max_waiting_requests_per_prefill_worker: 8
        preemption:
          allowed_victim_stages:
          - DECODE_RESERVED
          - DECODE_ENGINE_OWNED
          engine_cancellation:
            ack_timeout_ms: 50
            completion_timeout_ms: 1000
      mutation: owned_without_cancellation
  - id: strict_rejection
    action: preemption_config_reject
    params:
      rejected:
      - $ref: stages.removed_auto_tpm.output.rejected
      - $ref: stages.fifo_default_priority.output.rejected
      - $ref: stages.owned_without_cancellation.output.rejected
      environment_absent:
        $ref: stages.owned_without_cancellation.output.environment_absent
  - id: teardown
    action: teardown
stages:
- id: setup
  action: setup
  timeout_s: 180
- id: fleet
  action: priority_fleet
- id: slow
  action: engine_control
  params:
    operation: set_perf
    targets:
    - $ref: stages.fleet.output.prefill
    perf:
      prefill_fixed_ms: 4000
- id: sync
  action: balance_pause
  params:
    seconds: 1.5
- id: placeholder
  action: priority_start
  timeout_s: 5
  params:
    gap_s: 0
    requests:
    - tag: placeholder
      priority: 50
      input_len: 2048
      output_len: 2
- id: placeholder_settled
  action: preemption_settled
  timeout_s: 90
  params:
    requests:
      $ref: stages.placeholder.output.requests
- id: placeholder_admitted
  action: check
  params:
    actual:
      $ref: stages.placeholder_settled.output.admitted
    op: eq
    expected: true
- id: placeholder_pending
  action: preemption_pending
  timeout_s: 6
  params:
    target:
      $ref: stages.fleet.output.prefill
- id: wave
  action: priority_start
  timeout_s: 15
  params:
    gap_s: 0.15
    requests:
    - tag: peer0
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer1
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer2
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer3
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer4
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer5
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer6
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: peer7
      priority: 50
      input_len: 2048
      output_len: 2
    - tag: incoming
      priority: 50
      input_len: 2048
      output_len: 2
- id: wave_settled
  action: preemption_settled
  timeout_s: 90
  params:
    requests:
      $ref: stages.wave.output.requests
- id: placeholder_drain
  action: preemption_wait
  timeout_s: 35
  params:
    requests:
      $ref: stages.placeholder.output.requests
- id: wave_drain
  action: preemption_wait
  timeout_s: 315
  params:
    requests:
      $ref: stages.wave.output.requests
- id: same_priority
  action: preemption_same_priority
  params:
    placeholder:
      $ref: stages.placeholder.output.requests
    wave:
      $ref: stages.wave.output.requests
- id: master_clean
  action: balance_clean
  timeout_s: 30
- id: restore
  action: engine_control
  params:
    operation: set_perf
    targets:
    - $ref: stages.fleet.output.prefill
    perf:
      prefill_fixed_ms: 100
- id: teardown
  action: teardown
  timeout_s: 120
