schema_version: 1
id: priority_preemption
description: Explicit preemption cohorts and legacy design-final predicates.
category: priority
profiles:
- single-nonbatch
- single-batch
- batch-window
legacy_case_ids:
- atpm_same_priority_zero_eviction
- atpm_preempt_prefill_queued
- atpm_timeout_attribution
- atpm_preemption_disabled_zero_eviction
- atpm_comparator_frozen_weak
- atpm_config_strict_reject
- atpm_preempt_decode_engine_owned
- atpm_error_code_family
- atpm_decode_reservation_priority
- atpm_observability_integrity
- atpm_preempt_prefill_queued_live
- atpm_preempt_decode_reserved_live
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 4
  perf_preset: default
  config_overrides:
    ordering: priority
    decision: single
    dispatcher: non_batch
    queue_timeout_ms: 60000
    max_inflight_requests_per_worker: 1
    max_waiting_requests_per_prefill_worker: 8
execution:
  timeout_s: 1200
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: same_priority_zero_eviction
  profiles:
  - single-nonbatch
  legacy_case_ids:
  - atpm_same_priority_zero_eviction
  environment_overrides:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
- id: prefill_queued
  profiles:
  - single-nonbatch
  legacy_case_ids:
  - atpm_preempt_prefill_queued
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fleet
    action: priority_fleet
  - id: slow
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.fleet.output.prefill
      perf:
        prefill_fixed_ms: 4000
  - id: sync
    action: balance_pause
    params:
      seconds: 1.5
  - id: r1_placeholder
    action: priority_start
    timeout_s: 5
    params:
      gap_s: 0
      requests:
      - tag: placeholder
        priority: 50
        input_len: 2048
        output_len: 2
  - id: r1_placeholder_settled
    action: preemption_settled
    timeout_s: 90
    params:
      requests:
        $ref: stages.r1_placeholder.output.requests
  - id: r1_placeholder_admitted
    action: check
    params:
      actual:
        $ref: stages.r1_placeholder_settled.output.admitted
      op: eq
      expected: true
  - id: r1_placeholder_pending
    action: preemption_pending
    timeout_s: 6
    params:
      target:
        $ref: stages.fleet.output.prefill
  - id: r1_wave
    action: priority_start
    timeout_s: 15
    params:
      gap_s: 0.15
      requests:
      - tag: peer0
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: peer1
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: peer2
        priority: 40
        input_len: 2048
        output_len: 2
      - tag: peer3
        priority: 40
        input_len: 2048
        output_len: 2
      - tag: peer4
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: peer5
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: peer6
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: peer7
        priority: 30
        input_len: 2048
        output_len: 2
      - tag: incoming
        priority: 70
        input_len: 2048
        output_len: 2
  - id: r1_wave_settled
    action: preemption_settled
    timeout_s: 90
    params:
      requests:
        $ref: stages.r1_wave.output.requests
  - id: r1_placeholder_drain
    action: preemption_wait
    timeout_s: 35
    params:
      requests:
        $ref: stages.r1_placeholder.output.requests
  - id: r1_wave_drain
    action: preemption_wait
    timeout_s: 315
    params:
      requests:
        $ref: stages.r1_wave.output.requests
  - id: r1_same_priority
    action: preemption_queued_first
    params:
      placeholder:
        $ref: stages.r1_placeholder.output.requests
      wave:
        $ref: stages.r1_wave.output.requests
      round: 1
  - id: r1_master_clean
    action: balance_clean
    timeout_s: 30
  - id: r2_placeholder
    action: priority_start
    timeout_s: 5
    params:
      gap_s: 0
      requests:
      - tag: placeholder
        priority: 70
        input_len: 2048
        output_len: 2
