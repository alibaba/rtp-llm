  - id: r2_master_clean
    action: balance_clean
    timeout_s: 30
  - id: restore
    action: engine_control
    params:
      operation: set_perf
      targets:
      - $ref: stages.fleet.output.prefill
      perf:
        prefill_fixed_ms: 100
  - id: teardown
    action: teardown
    timeout_s: 120
  environment_overrides:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
