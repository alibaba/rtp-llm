# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: priority_preemption
profiles:
- single-nonbatch
- single-batch
- batch-window
environment:
  backend: java_mock
  n_prefill: 1
  n_decode: 4
  perf_preset: default
  config_overrides:
    ordering: priority
    decision: single
    dispatcher: non_batch
    queue_timeout_ms: 60000
    max_inflight_per_prefill_worker: 1
execution:
  timeout_s: 1200
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: same_priority_zero_eviction
  profiles:
  - single-nonbatch
  environment:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
  program: same_priority_zero_eviction
- id: prefill_queued
  profiles:
  - single-nonbatch
  environment:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
  program: prefill_queued
- id: timeout_attribution
  profiles:
  - single-nonbatch
  environment:
    config_overrides:
      queue_timeout_ms: 7000
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
  program: timeout_attribution
- id: comparator_frozen_weak
  profiles:
  - single-nonbatch
  environment:
    config_overrides:
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
  program: comparator_frozen_weak
- id: config_strict_reject
  profiles:
  - single-nonbatch
  environment:
    config_overrides:
      ordering: priority
      decision: single
      dispatcher: non_batch
      queue_timeout_ms:
        omit: true
      max_inflight_per_prefill_worker: 1
  program: config_strict_reject
- id: decode_engine_owned
  profiles:
  - single-nonbatch
  environment:
    n_prefill: 2
    n_decode: 4
    config_overrides:
      max_inflight_per_prefill_worker: 3
      preemption:
        allowed_victim_stages:
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        timeout_ms: 1000
    metric_whitelist: flexlb_auto_tpm
  program: decode_engine_owned
- id: decode_reservation_priority
  profiles:
  - single-nonbatch
  environment:
    n_prefill: 2
    n_decode: 4
    config_overrides:
      max_inflight_per_prefill_worker: 3
      preemption:
        allowed_victim_stages:
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        timeout_ms: 1000
    metric_whitelist: flexlb_auto_tpm
  program: decode_reservation_priority
- id: observability_integrity
  profiles:
  - single-nonbatch
  environment:
    metric_whitelist: flexlb_auto_tpm
    master_debug_log: true
    config_overrides:
      queue_timeout_ms: 7000
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
  program: observability_integrity
- id: decode_reserved_live_window
  profiles:
  - batch-window
  environment:
    metric_whitelist: flexlb_auto_tpm
    config_overrides:
      dispatcher: batch
      decision: fixed_window
      max_inflight_per_prefill_worker: 4
      queue_timeout_ms: 60000
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
        - DECODE_RESERVED
      max_collection_wait_ms: 400
    n_decode: 1
    decode_cache_blocks: 5
    debug_enabled: true
  program: decode_reserved_live_window
  metadata:
    requires:
    - enqueue_batch
- id: cancel_not_found
  profiles:
  - single-nonbatch
  environment:
    n_decode: 1
    config_overrides:
      decode_max_engine_requests: 1
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        timeout_ms: 1000
  program: cancel_not_found
- id: cancel_absent_fence
  profiles:
  - single-batch
  - batch-window
  environment:
    n_decode: 1
    config_overrides:
      dispatcher: batch
      max_inflight_per_prefill_worker: 2
  program: cancel_absent_fence
  metadata:
    requires:
    - enqueue_batch
- id: cancel_tombstoned
  profiles:
  - single-batch
  - batch-window
  environment:
    n_decode: 1
    config_overrides:
      dispatcher: batch
      decision: single
      max_inflight_per_prefill_worker: 4
      decode_max_engine_requests: 1
      preemption:
        allowed_victim_stages:
        - PREFILL_QUEUED
        - DECODE_RESERVED
        - DECODE_ENGINE_OWNED
        timeout_ms: 1000
  program: cancel_tombstoned
  metadata:
    requires:
    - enqueue_batch
