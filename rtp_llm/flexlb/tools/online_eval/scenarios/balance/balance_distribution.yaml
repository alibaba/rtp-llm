      defer_batch: true
      stream_timeout_s: 30
    wave1_long1_terminal_timeout_s: 120
    wave1_long2_terminal_timeout_s: 120
    wave1_short_terminal_timeout_s: 120
    wave1_p6_timeout_s: 60
    wave1_p6:
      metric: complete
      property: P6
    wave1_master_clean_timeout_s: 30
    wave1_master_clean: {}
    wave2_long1_timeout_s: 60
    wave2_long1:
