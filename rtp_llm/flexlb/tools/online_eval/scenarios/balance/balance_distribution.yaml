schema_version: 1
id: balance_distribution
category: balance
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
execution:
  timeout_s: 1800
  stage_timeout_s: 60
  cleanup_timeout_s: 120
variants:
- id: uniform_serial
  legacy_case_ids:
  - balance_uniform_serial
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fleet
    action: balance_snapshot
    timeout_s: 60
    params:
      role: prefill
  - id: plain
    action: balance_start
    timeout_s: 60
    params:
      count: 20
  - id: plain_terminal
    action: balance_wait
    timeout_s: 120
    params:
      requests:
        $ref: stages.plain.output.requests
  - id: plain_p6
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.plain.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: complete
      property: P6
  - id: plain_p1
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.plain.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: max_share
      property: P1
  - id: plain_p2
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.plain.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: workers
      property: P2
  - id: slow_second
    action: engine_control
    timeout_s: 60
    params:
      operation: set_perf
      targets:
      - $ref: stages.fleet.output.second
      perf:
        prefill_fixed_ms: 200
  - id: perf_sync
    action: balance_pause
    timeout_s: 6.5
    params:
      seconds: 1.5
  - id: speed_hetero
    action: balance_start
    timeout_s: 60
    params:
      count: 20
  - id: speed_hetero_terminal
    action: balance_wait
    timeout_s: 120
    params:
      requests:
        $ref: stages.speed_hetero.output.requests
  - id: speed_hetero_p6
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.speed_hetero.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: complete
      property: P6
  - id: speed_hetero_p1
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.speed_hetero.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: max_share
      property: P1
  - id: speed_hetero_p2
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.speed_hetero.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: workers
      property: P2
  - id: restore_speed
    action: engine_control
    timeout_s: 60
    params:
      operation: set_perf
      targets:
      - $ref: stages.fleet.output.second
      perf:
        prefill_fixed_ms: 100
  - id: teardown
    action: teardown
    timeout_s: 120
- id: concurrent_mix
  legacy_case_ids:
  - balance_concurrent_mix
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: fleet
    action: balance_snapshot
    timeout_s: 60
    params:
      role: prefill
  - id: burst
    action: balance_start
    timeout_s: 60
    params:
      count: 20
      concurrency: 20
  - id: terminal
    action: balance_wait
    timeout_s: 120
    params:
      requests:
        $ref: stages.burst.output.requests
  - id: p6
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.burst.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: complete
      property: P6
      min_success: 8
      allow_admission: true
  - id: p1
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.burst.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: max_share
      property: P1
      relax: 1
  - id: p2
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.burst.output.requests
      fleet:
        $ref: stages.fleet.output.snapshot
      metric: workers
      property: P2
  - id: teardown
    action: teardown
    timeout_s: 120
- id: decode_spread
  legacy_case_ids:
  - balance_decode_spread
  stages:
  - id: setup
    action: setup
    timeout_s: 180
  - id: n10_before
    action: balance_snapshot
    timeout_s: 60
    params:
      role: decode
  - id: n10
    action: balance_start
    timeout_s: 60
    params:
      count: 10
  - id: n10_terminal
    action: balance_wait
    timeout_s: 120
    params:
      requests:
        $ref: stages.n10.output.requests
  - id: n10_after
    action: balance_snapshot
    timeout_s: 60
    params:
      role: decode
  - id: n10_p6
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.n10.output.requests
      fleet:
        $ref: stages.n10_before.output.snapshot
      metric: decode_complete
      property: P6
      after:
        $ref: stages.n10_after.output.snapshot
  - id: n10_p2
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.n10.output.requests
      fleet:
        $ref: stages.n10_before.output.snapshot
      metric: decode_workers
      property: P2
      after:
        $ref: stages.n10_after.output.snapshot
      min_workers: 2
  - id: n10_p1
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.n10.output.requests
      fleet:
        $ref: stages.n10_before.output.snapshot
      metric: decode_share
      property: P1
      after:
        $ref: stages.n10_after.output.snapshot
      bands:
        strict: 0.6
        normal: 0.7
        loose: 0.8
  - id: n50_before
    action: balance_snapshot
    timeout_s: 60
    params:
      role: decode
  - id: n50
    action: balance_start
