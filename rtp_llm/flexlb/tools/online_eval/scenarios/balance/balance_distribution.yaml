      fleet:
        $ref: stages.n50_before.output.snapshot
      metric: decode_complete
      property: P6
      after:
        $ref: stages.n50_after.output.snapshot
  - id: n50_p2
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.n50.output.requests
      fleet:
        $ref: stages.n50_before.output.snapshot
      metric: decode_workers
      property: P2
      after:
        $ref: stages.n50_after.output.snapshot
      min_workers: 3
  - id: n50_p1
    action: balance_check
    timeout_s: 60
    params:
      requests:
      - $ref: stages.n50.output.requests
      fleet:
        $ref: stages.n50_before.output.snapshot
      metric: decode_share
      property: P1
      after:
        $ref: stages.n50_after.output.snapshot
      bands:
        strict: 0.4
        normal: 0.5
        loose: 0.6
  - id: teardown
    action: teardown
    timeout_s: 120
