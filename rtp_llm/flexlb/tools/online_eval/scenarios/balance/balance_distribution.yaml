# YAML owns all case data; Python owns execution order and result references.
schema_version: 2
case: balance_distribution
environment:
  backend: java_mock
  n_prefill: 2
  n_decode: 4
execution:
  timeout_s: 1800
  stage_timeout_s: 60
  cleanup_timeout_s: 120
parameter_schema:
  sustained_mix.windows:
    integer: true
    minimum: 1
    maximum: 60
variants:
- id: sustained_mix
  program: sustained_mix
  profiles:
  - batch-window
  environment:
    n_prefill: 4
    n_decode: 8
- id: uniform_serial
  program: uniform_serial
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
- id: concurrent_mix
  program: concurrent_mix
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
- id: decode_spread
  program: decode_spread
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
- id: length_mixed
  program: length_mixed
  profiles:
  - batch-window
  - single-nonbatch
  - single-batch
  - window-nonbatch
metadata:
  category: balance
  description: Explicit balance stages preserving client landing, token share, Decode deltas and latency
    contracts.
parameters:
  sustained_mix:
    setup_timeout_s: 180
    fleet:
      role: prefill
    windows: 12
    load:
      count: 50
      concurrency: 20
      input_len: 2048
      output_len: 2
      interval_s: 0.1
      stream_timeout_s: 15
      unique_keys: true
      defer_batch: false
      await_completion: true
    drain_timeout_s: 90
    complete:
      metric: complete
      property: P6
      allow_admission: false
      min_success: 50
    interval:
      seconds: 0.2
    teardown_timeout_s: 120
  uniform_serial:
    setup_timeout_s: 180
    fleet_timeout_s: 60
    fleet:
      role: prefill
    plain_timeout_s: 60
    plain:
      count: 20
    plain_terminal_timeout_s: 120
    plain_p6_timeout_s: 60
    plain_p6:
      metric: complete
      property: P6
    plain_p1_timeout_s: 60
    plain_p1:
      metric: max_share
      property: P1
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
    plain_p2_timeout_s: 60
    plain_p2:
      metric: workers
      property: P2
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
    perf_sync_timeout_s: 6.5
    perf_sync:
      seconds: 1.5
    idle_replay_timeout_s: 60
    idle_replay:
      count: 20
    idle_replay_terminal_timeout_s: 120
    idle_replay_p6_timeout_s: 60
    idle_replay_p6:
      metric: complete
      property: P6
    idle_replay_p1_timeout_s: 60
    idle_replay_p1:
      metric: max_share
      property: P1
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
    idle_replay_p2_timeout_s: 60
    idle_replay_p2:
      metric: workers
      property: P2
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
    teardown_timeout_s: 120
  concurrent_mix:
    setup_timeout_s: 180
    fleet_timeout_s: 60
    fleet:
      role: prefill
    burst_timeout_s: 60
    burst:
      count: 20
      concurrency: 20
    terminal_timeout_s: 120
    p6_timeout_s: 60
    p6:
      metric: complete
      property: P6
      min_success: 8
      allow_admission: true
    p1_timeout_s: 60
    p1:
      metric: max_share
      property: P1
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
      relax: 1
    p2_timeout_s: 60
    p2:
      metric: workers
      property: P2
      diagnostic_reason: Schema 3 uses deterministic BEST_ONLY; random landing spread is no longer a product contract.
    teardown_timeout_s: 120
  decode_spread:
    setup_timeout_s: 180
    n10_before_timeout_s: 60
    n10_before:
      role: decode
    n10_timeout_s: 60
    n10:
      count: 10
    n10_terminal_timeout_s: 120
    n10_after_timeout_s: 60
    n10_after:
      role: decode
    n10_p6_timeout_s: 60
    n10_p6:
      metric: decode_complete
      property: P6
    n10_p2_timeout_s: 60
    n10_p2:
      metric: decode_workers
      property: P2
      min_workers: 2
    n10_p1_timeout_s: 60
    n10_p1:
      metric: decode_share
      property: P1
      bands:
        strict: 0.6
        normal: 0.7
        loose: 0.8
    n50_before_timeout_s: 60
    n50_before:
      role: decode
    n50_timeout_s: 60
    n50:
      count: 50
    n50_terminal_timeout_s: 120
    n50_after_timeout_s: 60
    n50_after:
      role: decode
    n50_p6_timeout_s: 60
    n50_p6:
      metric: decode_complete
      property: P6
    n50_p2_timeout_s: 60
    n50_p2:
      metric: decode_workers
      property: P2
      min_workers: 3
    n50_p1_timeout_s: 60
    n50_p1:
      metric: decode_share
      property: P1
      bands:
        strict: 0.4
        normal: 0.5
        loose: 0.6
    teardown_timeout_s: 120
  length_mixed:
    setup_timeout_s: 180
    fleet_timeout_s: 60
    fleet:
      role: prefill
    wave1_long1_timeout_s: 60
    wave1_long1:
      input_len: 131072
      unique_keys: false
      defer_batch: true
      stream_timeout_s: 30
    wave1_long1_pending_timeout_s: 6
    wave1_long2_timeout_s: 60
