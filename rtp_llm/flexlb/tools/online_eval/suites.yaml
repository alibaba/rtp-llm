# Classification only. Per-case topology, load and thresholds remain in scenario YAML.
schema_version: 1
workload_runtime:
  capture_metrics: true
  sample_interval_s: 1.0
  max_sample_gap_s: 5.0
  collector_shutdown_s: 10.0
# The default developer/CI loop is deliberately five contracts.  The complete
# functional ledger remains available through --suite functional.
core_cases:
  request_completion::immediate: End-to-end request completion and resource release
  cache_capacity_recovery::pool_saturation_evict_reject_recover: Capacity admission and bounded recovery
  cache_churn::lru_affinity: Prefix reuse and LRU cache lifecycle
  engine_fault_recovery::generation_bump: Engine replacement and generation isolation
  master_lifecycle::kill_single: Master restart and topology recovery
cases:
  cache_scale_in::step:
    kind: workload
    collection: request
    reason: Fixed Java traffic across one-step P withdrawal with cache collapse adjudication
  trace_scale_out::prepared_background:
    kind: workload
    collection: request
    reason: Java background traffic persists across Python checkpoints and Decode scale-out
  balance_distribution::sustained_mix:
    kind: workload
    collection: request
    reason: Twelve paced windows with full request completion and continuous telemetry
  request_completion::immediate:
    kind: functional
