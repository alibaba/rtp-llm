syntax = "proto3";
package mock.rtp;
option java_package = "org.flexlb.mock.engine.rtp.transfer";
option java_multiple_files = true;
import "engine_rpc_service.proto";

// Mock-internal token coverage; local block layouts never cross this boundary.
message TransferRequest {
  string client_id = 1;
  GenerateInputPB input = 2;
  reserved 3;
  reserved "block_size";
}
message TransferMetadata {
  reserved 1, 3, 4;
  reserved "block_size", "cache_keys", "stop_after";
  uint32 input_tokens = 2;
  bool prefill_finished = 5; // Actual first-token completion, never a predicted future stop length.
}
service PrefillTransfer {
  // Waits for the matching local source to finish its Forward; never accepts mere LRU cache presence.
  rpc Read(TransferRequest) returns (TransferMetadata);
}
