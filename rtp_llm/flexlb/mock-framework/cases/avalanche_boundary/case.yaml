id: avalanche_boundary
name: 雪崩边界扫描
describe:
  G2.1 降级版：uniform-2k 冷流量（无缓存亲和干扰）同负载 qps 30 下轻（3→2，容量 66.7→44.4/s）重（2→1，容量 44.4→22.2/s 跌破负载）两档缩容画相对分界——轻档恢复（成功率 ≥90%、排队有界），重档严格劣化（排队 ≥30 且不低于轻档、成功率不优于轻档）。相对判定对宿主 CPU 噪声稳健；绝对阈值给出雪崩形态证据。缩容瞬间被清子队列的请求以
  UNAVAILABLE 批量终结（属缩容代价，轻档窗口避开瞬间）。真机锚点：25→12 恢复、70→65 雪崩。
environment:
  master:
    deployment:
      replicas: 1
    config: configs/master.yaml
  prefill:
    engine: rtp
    deployment:
      replicas: 3
    config: configs/prefill.yaml
  decode:
    engine: rtp
    deployment:
      replicas: 2
    config: configs/decode.yaml
  frontend:
    config:
      seq_size_per_block: 128
      prefill_cp_size: 4
      image_token_id: 129264
      cache_key_hash_seed: "4923373599811257905"
phases:
  - id: startup
    describe: 确认唯一主 Master 并等待 Engine 发现传播。
    timeout: 120s
    steps:
      - id: check_master_leader
        describe: 只有一个主 Master。
        interface: master/list/addresses
        args:
          is_leader: true
        expect:
          count: 1
        wait_after: 10s
  - id: boundary
    describe: 两档缩容扫边界。
    timeout: 600s
    steps:
      - id: start_frontend
        describe: uniform-2k 冷流量 qps 30（单 P 上限 22.2/s，2P 上限 44.4/s；并发 768 防自降速，master gRPC 队列 4096）。
        interface: frontend/start/playback
        args:
          requests_file: data/traffic/uniform-2k.mckidx
          qps: 30
          total_concurrency: 768
          queue_capacity: 2048
          request_timeout: 60s
          drain_timeout: 60s
        wait_after: 60s
      - id: check_baseline
        describe: 基线：3P 下成功率 ≥85%（容忍宿主噪声）。
        interface: frontend/query/success_rate
        args:
          range:
            - -30s
            - 0s
        expect:
          gte: 0.85
      - id: scale_mild
        describe: 轻度缩容 3→2（容量 44.4/s 仍高于负载 30/s），等待 35s 避开缩容瞬间子队列清洗。
        interface: engine/scale
        args:
          direction: in
          role: prefill
          count: 1
        within: 60s
        wait_after: 35s
      - id: check_mild_recovers
        describe: 轻档恢复：避开缩容瞬间的被清子队列，25s 窗口成功率 ≥90%。
        interface: frontend/query/success_rate
        args:
          range:
            - -25s
            - 0s
        expect:
          gte: 0.9
      - id: record_mild_queue
        describe: 轻档排队水位（作为重档的对照基准；瞬态清队已过 35s）。
        interface: prometheus/query_scalar
        args:
          promql: sum(flexlb_app_flexlb_batcher_queue_size) or vector(0)
        expect:
          lte: 100
      - id: scale_severe
        describe: 重度缩容 2→1（容量 22.2/s 明确跌破负载 30/s），等待 40s 让重档排队充分堆积。
        interface: engine/scale
        args:
          direction: in
          role: prefill
          count: 1
        within: 60s
        wait_after: 40s
      - id: check_severe_queue_worse
        describe: 重档排队严格高于轻档（分界相对判定）且绝对量 ≥30。
        interface: prometheus/query_scalar
        args:
          promql: sum(max_over_time(flexlb_app_flexlb_batcher_queue_size[30s])) or vector(0)
        expect:
          gte: 30
      - id: check_severe_queue_vs_mild
        describe: 重档排队不低于轻档基准（相对分界证据）。
        interface: prometheus/query_scalar
        args:
          promql: sum(max_over_time(flexlb_app_flexlb_batcher_queue_size[30s])) or vector(0)
        expect:
          gte:
            ref: steps.record_mild_queue
      - id: check_severe_success_worse
        describe: 重档成功率不优于轻档（相对分界）。
        interface: frontend/query/success_rate
        args:
          range:
            - -30s
            - 0s
        expect:
          lte:
            ref: steps.check_mild_recovers
      - id: evidence_prefill_tps
        describe: 重档 prefill 吞吐（留证）。
        interface: prometheus/query
        args:
          promql: sum(rtp_llm_context_tps{role="prefill"})
      - id: stop_frontend
        describe: 停止播放并收齐已发请求终态。
        interface: frontend/stop/playback
        within: 300s
      - id: count_issued
        describe: 发出的请求总数。
        interface: frontend/query/playback_requests
        args:
          kind: ISSUED
      - id: check_terminal_unique
        describe: 两档全程每请求终态唯一（雪崩也不许双重结算）。
        interface: frontend/query/playback_requests
        args:
          kind: TERMINAL
        expect:
          eq:
            ref: steps.count_issued
