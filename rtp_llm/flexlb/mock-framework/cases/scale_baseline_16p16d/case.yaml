id: scale_baseline_16p16d
name: 多规模端到端基线 16P/16D
describe: 控制变量规模梯度基线：16P/16D/2F（QUEUE+PRIORITY+NON_BATCH，maxCollectionWaitMs=0，单 P 线性公式 100+50*batchSize、inflight=8，单 P 理论上限
  ~16 req/s），按 0.25x/0.60x/0.90x/1.35x 四档负载测量容量拐点、Prefill/Decode 吞吐、TTFT 与 Master 调度延迟。
environment:
  master:
    deployment:
      replicas: 1
    config: configs/master.yaml
  prefill:
    engine: rtp
    deployment:
      replicas: 16
    config: configs/prefill.yaml
  decode:
    engine: rtp
    deployment:
      replicas: 16
    config: configs/decode.yaml
  frontend:
    deployment:
      replicas: 2
    config:
      seq_size_per_block: 128
      prefill_cp_size: 4
      image_token_id: 129264
      cache_key_hash_seed: '4923373599811257905'
phases:
- id: startup
  describe: 确认唯一主 Master 并等待全部 P/D 发现传播。
  timeout: 180s
  steps:
  - id: check_master_leader
    describe: 只有一个主 Master。
    interface: master/list/addresses
    args:
      is_leader: true
    expect:
      count: 1
    wait_after: 15s
- id: load_low_025x
  describe: 规模 16P/16D 下负载档位 low_025x（64 QPS）。
  timeout: 240s
  steps:
  - id: start_low_025x
    describe: 档位 low_025x：以 64 QPS 稳定打流 20s。
    interface: frontend/start/playback
    args:
      requests_file: data/traffic/uniform-2k.mckidx
      qps: 64
      total_concurrency: 1024
      queue_capacity: 2048
      request_timeout: 20s
      drain_timeout: 60s
    wait_after: 20s
  - id: record_qps_low_025x
    describe: 记录 low_025x 实际发出 QPS。
    interface: frontend/query/qps
    args:
      range:
      - -10s
      - 0s
    expect:
      gte: 54.4
      lte: 73.6
  - id: record_ttft_mean_low_025x
    describe: 记录 low_025x TTFT 均值。
    interface: frontend/query/ttft
    args:
      range:
      - -10s
      - 0s
      statistic: mean
  - id: record_ttft_p95_low_025x
    describe: 记录 low_025x TTFT P95。
    interface: frontend/query/ttft
    args:
      range:
      - -10s
      - 0s
      statistic: p95
  - id: record_prefill_tps_low_025x
    describe: 记录 low_025x 集群 Prefill TPS。
    interface: engine/query/prefill_tps
    args:
      range:
      - -10s
      - 0s
  - id: record_decode_tps_low_025x
    describe: 记录 low_025x 集群 Decode TPS。
    interface: engine/query/decode_tps
    args:
      range:
      - -10s
      - 0s
  - id: record_queue_low_025x
    describe: 记录 low_025x 排队深度。
    interface: prometheus/query_scalar
    args:
      promql: sum(flexlb_app_flexlb_batcher_queue_size) or vector(0)
  - id: stop_low_025x
    describe: 停止 low_025x 打流并排空。
    interface: frontend/stop/playback
    within: 120s
  - id: check_success_low_025x
    describe: 记录/校验 low_025x 成功率。
    interface: frontend/query/success_rate
    args:
      range:
      - -60s
      - 0s
    expect:
      gte: 0.99
