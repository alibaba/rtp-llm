id: performance_regression
name: 性能回归
describe: 按线上 Mock 的 P/D/V 和 Master 规模回放五分钟采样，检查缓存稳定后的吞吐、延迟和成功率。
environment:
  master:
    deployment:
      replicas: 2
    config: configs/master.yaml
  prefill:
    engine: rtp
    deployment:
      replicas: 55
    config: configs/prefill.yaml
  decode:
    engine: rtp
    deployment:
      replicas: 192
    config: configs/decode.yaml
  vit:
    deployment:
      replicas: 160
    config: configs/vit.yaml
  frontend:
    deployment:
      replicas: 4
    config:
      seq_size_per_block: 128
      prefill_cp_size: 4
      image_token_id: 129264
      cache_key_hash_seed: "4923373599811257905"
phases:
  - id: startup
    describe: 确认唯一主 Master 并等待发现。
    timeout: 150s
    steps:
      - id: check_master_leader
        describe: 双 Master 中恰有一个主节点。
        interface: master/list/addresses
        args:
          is_leader: true
        expect:
          count: 1
        wait_after: 10s
  - id: warmup
    describe: 先低速起跑，再用原速继续积累 KV，到源流量约第 270 秒开始测量。
    timeout: 395s
    steps:
      - id: start_frontend
        describe: 启动单遍连续回放，先低速起跑，再切到原速。
        interface: frontend/start/playback
        args:
          requests_file: data/traffic/deepseek-v4.1.mckidx
          reuse_cache: true
          replay_speed: 1.0
          initial_rate:
            duration: 100s
            rate_scale: 0.30
          total_concurrency: 32000
          queue_capacity: 48000
          request_timeout: 120s
          drain_timeout: 150s
        # 源第 270 秒的墙钟时间 = 270s + 100s × (1 - 0.30)。
        wait_after: 340s
  - id: performance
    describe: 采集同一轮回放的源流量约第 270–300 秒，并检查性能。
    timeout: 350s
    steps:
      - id: collect_performance_window
        describe: 采集 30 秒稳态流量，并预留 5 秒给 Prometheus 抓取。
        interface: case/wait
        args:
          duration: 35s
        within: 40s
      - id: check_frontend_qps
        describe: 总已发 QPS。
        interface: frontend/query/qps
        args:
          range: [-35s, -5s]
        expect:
          gte: 960
          lte: 1150
        within: 30s
      - id: check_prefill_tps
        describe: 集群原生 Prefill TPS。
        interface: engine/query/prefill_tps
        args:
          range: [-35s, -5s]
        expect:
          gte: 2200000
        within: 30s
      - id: check_prefill_tps_with_cache
        describe: 集群原生含缓存 Prefill TPS。
        interface: engine/query/prefill_tps_with_cache
        args:
          range: [-35s, -5s]
        expect:
          gte: 34000000
        within: 30s
      - id: check_output_tps
        describe: 集群 Decode 输出 TPS。
        interface: engine/query/decode_tps
        args:
          range: [-35s, -5s]
        expect:
          gte: 220000
        within: 30s
      - id: check_ttft_mean
        describe: 客户端首 token 延迟均值。
        interface: frontend/query/ttft
        args:
          range: [-35s, -5s]
          statistic: mean
        expect:
          lte: 600ms
        within: 30s
      - id: check_ttft_p95
        describe: 客户端首 token 延迟 P95。
        interface: frontend/query/ttft
        args:
          range: [-35s, -5s]
          statistic: p95
        expect:
          lte: 1500ms
        within: 30s
      - id: check_tpot_mean
        describe: 成功多 token 请求 TPOT 均值。
        interface: frontend/query/tpot
        args:
          range: [-35s, -5s]
          statistic: mean
        expect:
          lte: 8ms
        within: 30s
      - id: check_tpot_p95
        describe: 成功多 token 请求 TPOT P95。
        interface: frontend/query/tpot
        args:
          range: [-35s, -5s]
          statistic: p95
        expect:
          lte: 13ms
        within: 30s
      - id: check_cache_hit_rate
        describe: Prefill token 加权实际命中率。
        interface: engine/query/cache_hit_rate
        args:
          range: [-35s, -5s]
        expect:
          gte: 0.9
        within: 30s
      - id: check_success_rate
        describe: 测量窗口内的客户端终态成功率。
        interface: frontend/query/success_rate
        args:
          range: [-35s, -5s]
        expect:
          gte: 0.999
        within: 30s
  - id: drain
    describe: 排空并检查全程终态成功率。
    timeout: 220s
    steps:
      - id: stop_frontend
        describe: 停止 Frontend 并排空已发请求。
        interface: frontend/stop/playback
        within: 190s
      - id: check_total_success_rate
        describe: 查询含预热和排空的全程终态成功率。
        interface: frontend/query/success_rate
        args:
          # 覆盖 warmup、performance、drain 三阶段的总预算（965 秒）。
          range: [-980s, 0s]
        expect:
          gte: 0.999
        within: 30s
