FLEXLB_CONFIG: |-
  {
    "schemaVersion": 5,
    "scheduler": {
      "type": "QUEUE",
      "ordering": {
        "priority": {
          "enabled": true
        },
        "policy": {
          "type": "FIFO"
        }
      }
    },
    "requestLifecycle": {
      "dispatchTimeoutMs": 60000,
      "inactivityTimeoutMs": 60000
    },
    "router": {
      "roles": {
        "prefill": {
          "selection": {
            "type": "COST_BASED",
            "cacheAffinity": {
              "minPrefixHitPercent": 30
            }
          },
          "admission": {
            "maxInflightRequests": 128
          }
        },
        "decode": {
          "availability": {
            "maxKvUsagePercent": 90,
            "maxEngineRequests": 128
          },
          "costEstimator": {
            "expression": "1.0 * running_size / max_running_size "
          }
        }
      }
    },
    "workerRegistry": {
      "health": {
        "statusPollIntervalMs": 50
      },
      "cacheStatus": {
        "minRefreshIntervalMs": 400
      }
    },
    "grpcServer": {
      "executorCoreSize": 64,
      "executorMaxSize": 64
    }
  }
MODEL_SERVICE_CONFIG: |-
  {
    "service_id": "aigc.text-generation.generation.engine_service",
    "role_endpoints": [
      {
        "group": "group",
        "prefill_endpoint": {
          "address": "prefill-local",
          "protocol": "grpc"
        },
        "decode_endpoint": {
          "address": "decode-local",
          "protocol": "grpc"
        },
        "vit_endpoint": {
          "address": "vit-local",
          "protocol": "grpc"
        }
      }
    ]
  }
