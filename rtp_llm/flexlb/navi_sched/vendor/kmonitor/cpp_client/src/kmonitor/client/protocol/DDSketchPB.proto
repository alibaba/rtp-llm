
syntax = "proto3";
option cc_enable_arenas = true;

package kmonitor.protocol;

message DDSketch {
  IndexMapping indexMapping = 1;
  Store store = 2;
  int64 zeroCount = 3;
  double minIndexedValue = 4;
  double maxIndexedValue = 5;
}

message IndexMapping {
  double relativeAccuracy = 1;
  Interpolation interpolation = 2;
  enum Interpolation {
    NONE = 0;
    LINEAR = 1;
    QUADRATIC = 2;
    CUBIC = 3;
    QUARTIC = 4;
  }
}

message Store {
  oneof store_type {
    DenseStore denseStore = 1; 
    // SparseStore sparseStore = 2;
    // PaginatedStore paginatedStore = 3;
  }
}

message DenseStore {
  int32 arrayLengthGrowthIncrement = 1;
  int32 arrayLengthOverhead = 2;
  int32 offset = 3;
  int32 minIndex = 4;
  int32 maxIndex = 5;
  repeated int64 counts = 6;
  int32 maxNumBins = 7;  
  bool isCollapsed = 8;  
  DenseStoreType denseStoreType = 9;
  enum DenseStoreType {
    UNBOUNDED_SIZE = 0;  // 默认值
    COLLAPSING_HIGHEST = 1;
    COLLAPSING_LOWEST = 2;
  }
}