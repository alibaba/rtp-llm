syntax = "proto3";

import "proto/GraphDef.proto";
import "proto/GraphState.proto";
import "proto/NaviSummary.proto";

package navi;
option cc_enable_arenas = true;

message LoggingEventStrDef {
    string name = 1;
    string prefix = 2;
    string file = 3;
    string func = 4;
    string message = 5;
    string bt = 6;
}

message LoggingEventHashDef {
    uint64 prefix = 1;
    uint64 file = 2;
    uint64 func = 3;
    uint64 message = 4;
    uint64 bt = 5;
}

message LoggingEventDef {
    LoggingEventStrDef str = 1;
    LoggingEventHashDef hash = 2;
    uint64 object = 3;
    int32 level = 4;
    int32 line = 5;
    int32 pid = 6;
    int64 tid = 7;
    int64 time_sec = 8;
    int64 time_usec = 9;
    bool major_error = 10;
}

enum GraphEventType {
    GET_KERNEL_UNKNOWN = 0;
    GET_KERNEL_CREATE = 1;
    GET_KERNEL_INIT = 2;
    GET_KERNEL_COMPUTE = 3;
    GET_KERNEL_DELETE_KERNEL = 4;
    GET_KERNEL_DELETE_DATA = 5;
    GET_GRAPH_INIT_PREPARE = 6;
    GET_GRAPH_INIT = 7;
    GET_RPC_SEND = 8;
    GET_RPC_RECEIVE = 9;
    GET_RPC_TASK_QUEUE = 10;
    GET_RPC_RECEIVE_QUEUE = 11;
    GET_GRAPH_DESTRUCT = 12;
    GET_GRAPH_GET_VIS_PROTO = 13;
    GET_KERNEL_TIMEOUT = 14;
    GET_DOMAIN_CLIENT_RUN = 15;
};

enum InlineComputeType {
    ICT_UNKNOWN = 0;
    ICT_NO_INLINE = 1;
    ICT_NORMAL = 2;
    ICT_TAIL_RECUR = 3;
    ICT_PUSH_FAILED = 4;
    ICT_SYNC = 5;
    ICT_DROP = 6;
    ICT_TAIL_QUEUE = 7;
};

message ScheduleInfoDef {
    int64 enqueue_time = 1;
    int64 dequeue_time = 2;
    int64 running_thread = 3;
    int32 sched_tid = 4;
    int32 signal_tid = 5;
    int32 process_tid = 6;
    int64 thread_counter = 7;
    int64 thread_wait_counter = 8;
    int64 queue_size = 9;
    InlineComputeType inline_type = 10;
};

enum PerfEventType {
    PET_UNKNOWN = 0;
    PET_SAMPLE = 1;
    PET_THROTTLE = 2;
    PET_UNTHROTTLE = 3;
    PET_SWITCH_IN = 4;
    PET_SWITCH_OUT = 5;
    PET_SWITCH_OUT_PREEMPT = 6;
    PET_SWITCH_IN_NEW = 7;
    PET_SWITCH_OUT_NEW = 8;
    PET_SWITCH_OUT_PREEMPT_NEW = 9;
    PET_PAGE_FAULT_MAJOR = 10;
    PET_PAGE_FAULT_MINOR = 11;
};

message PerfEventDef {
    PerfEventType sample_type = 1;
    uint32 cpu = 2;
    uint32 pid = 3;
    uint32 tid = 4;
    uint64 time = 5;
    repeated uint32 addr = 6;
    uint32 next_prev_pid = 7;
    uint32 next_prev_tid = 8;
    uint64 event_addr = 9;
    uint64 stack_hash = 10;
};

message KernelPerfDef {
    repeated PerfEventDef events = 1;
}

message MallocEventDef {
    uint64 time = 1;
    bool is_free = 2;
    uint64 size = 3;
    uint64 ptr = 4;
    uint64 stack_hash = 5;
    repeated uint32 addr = 6;
    int64 malloc_id = 7;
    bool global_traced = 8;
}

message KernelMallocDef {
    repeated MallocEventDef events = 1;
}

message KernelComputeEventDef {
    GraphEventType type = 1;
    int32 part_id = 2;
    int64 schedule_id = 3;
    ScheduleInfoDef schedInfo = 4;
    int64 begin_time_us = 5;
    int64 end_time_us = 6;
    int64 utime_in_us = 7;
    int64 stime_in_us = 8;
    int64 nvcsw = 9;
    int64 nivcsw = 10;
    int64 minflt = 11;
    int64 majflt = 12;
    int64 pool_malloc_count = 13;
    int64 pool_malloc_size = 14;
    KernelPerfDef perf = 15;
    KernelMallocDef malloc = 16;
}

message KernelMetricDef {
    int64 graph_id = 1;
    string node = 2;
    string kernel = 3;
    int32 ec = 4;
    string ec_str = 5;
    int64 schedule_count = 6;
    int64 try_schedule_count = 7;
    int64 queue_latency_us = 8;
    int64 compute_latency_us = 9;
    repeated KernelComputeEventDef events = 10;
    KernelStatesDef states = 11;
    int64 finish_time = 12;
}

message EdgeSetEventDef {
    bool success = 1;
    int64 time_ns = 2;
    uint64 data_addr = 3;
    bool eof = 4;
    int32 data_index = 5;
    int32 tid = 6;
    int32 ec = 7;
    uint64 summary_hash = 8;
    string type_id = 9;
    string node_name = 10;
    string kernel_name = 11;
    int64 get_summary_latency_us = 12;
}

message EdgeGetEventDef {
    bool success = 1;
    int64 time_ns = 2;
    uint64 data_addr = 3;
    bool eof = 4;
    int32 data_index = 5;
    int32 tid = 6;
    int32 slot_id = 7;
    string node_name = 8;
    string kernel_name = 9;
    int32 type = 10;
}

message EdgeMetricDef {
    int64 graph_id = 1;
    NodePortDef input = 2;
    int32 summary_level = 3;
    repeated EdgeSetEventDef set_events = 4;
    repeated EdgeGetEventDef get_events = 5;
    repeated NodePortDef slot_names = 6;
    string summary_query = 7;
}

message PerfSymbolDef {
    uint64 ip = 1;
    uint64 symbol = 2;
    uint64 offset = 3;
}

message PerfSymbolTableDef {
    repeated PerfSymbolDef symbols = 1;
}

message StackDef {
    uint64 stack_hash = 1;
    repeated uint32 addr = 2;
}

message StackTableDef {
    map<uint64, StackDef> stacks = 1;
}

message GraphMetricDef {
    int64 begin_time = 1;
    int64 end_time = 2;
    int64 compute_latency_us = 3;
    int64 queue_latency_us = 4;
    repeated KernelMetricDef metrics = 5;
    PerfSymbolTableDef perf_symbol_table = 6;
    int64 begin_time_mono_ns = 7;
    StackTableDef stack_table = 8;
    repeated EdgeMetricDef edge_metrics = 9;
}

enum NaviResultType {
    NRT_UNKNOWN = 0;
    NRT_NORMAL = 1;
    NRT_FORK = 2;
    NRT_RPC = 3;
    NRT_RPC_PART = 4;
}

message ForkResultLocationDef {
    int32 graph_id = 1;
    string biz_name = 2;
    string node_name = 3;
}

message RpcResultLocationDef {
    string from_biz = 1;
    int32 from_part_id = 2;
    string to_biz = 3;
    int32 part_count = 4;
    int32 graph_id = 5;
}

message RpcPartResultLocationDef {
    int32 part_id = 1;
    SingleGigRpcInfoDef rpc_info = 2;
}

message SingleResultLocationDef {
    NaviResultType type = 1;
    ForkResultLocationDef fork_location = 2;
    RpcResultLocationDef rpc_location = 3;
    RpcPartResultLocationDef rpc_part_location = 4;
}

message ResultLocationDef {
    repeated SingleResultLocationDef locations = 1;
}

message SingleGigRpcInfoDef {
    int64 part_id = 1;
    int64 send_count = 2;
    int64 receive_count = 3;
    int64 send_begin_ts = 4;
    int64 send_end_ts = 5;
    int32 send_status = 6;
    int64 receive_begin_ts = 7;
    int64 receive_end_ts = 8;
    int32 receive_status = 9;
    string spec = 10;
    bool is_retry = 11;
}

message NaviErrorDef {
    SessionIdDef session = 1;
    int32 ec = 2;
    string ec_str = 3;
    LoggingEventDef error_event = 4;
    ResultLocationDef location = 5;
    uint64 result_ptr = 6;
}

message GraphTraceDef {
    string format_pattern = 1;
    string name = 2;
    repeated LoggingEventDef events = 3;
}

message HostSpecDef {
    string ip = 1;
    int32 tcp_port = 2;
    int32 arpc_port = 3;
    int32 http_port = 4;
    int32 grpc_port = 5;
    int32 grpc_stream_port = 6;
    int32 rdma_arpc_port = 7;
    string host_name = 8;
}

message HostInfoDef {
    string navi_name = 1;
    string git_commit_id = 2;
    string packager = 3;
    HostSpecDef spec = 4;
    bytes package_info = 5;
    bytes ops_url = 6;
}

message VisFillMetric {
    int64 fill_begin_time = 1;
    int64 fill_end_time = 2;
}

message GraphResultDef {
    int32 version = 1;
    SessionIdDef session = 2;
    NaviErrorDef error = 3;
    GraphDef graph = 4;
    GraphTraceDef traces = 5;
    GraphMetricDef graph_metric = 6;
    SymbolTableDef symbol_table = 7;
    HostInfoDef host_info = 8;
    VisFillMetric vis_fill_metric = 9;
    uint64 result_ptr = 10;
    GraphVisNodeDef snapshot = 11;
}

message SerializedResultDef {
    ResultLocationDef location = 1;
    bytes result_str = 2;
    NaviErrorDef error = 3;
    bool has_trace = 4;
    VisFillMetric vis_fill_metric = 5;
}

message UpdateHistoryConfigDef {
    int64 max_size = 1;
    int64 max_count = 2;
}

enum UpdateHistoryEventType {
    NHET_UNKNOWN = 0;
    NHET_START = 1;
    NHET_UPDATE = 2;
    NHET_STOP = 3;
    NHET_EXIT = 4;
}

message UpdateEventDef {
    UpdateHistoryEventType type = 1;
    uint64 config_hash = 2;
    NaviErrorDef error = 3;
    int64 begin_time_us = 4;
    int64 end_time_us = 5;
    int64 dup_count = 6;
    int64 last_begin_time_us = 7;
    int64 last_end_time_us = 8;
    uint64 load_count = 9;
}

message UpdateHistoryDef {
    repeated UpdateEventDef events = 1;
    UpdateHistoryConfigDef config = 2;
}

message QueryLRUHistoryConfigDef {
    int64 max_size = 1;
    int64 max_count = 2;
    int64 sample_size = 3;
    int64 str_map_size = 4;
    int64 str_map_mem_size = 5;
}

message QueryHistoryConfigDef {
    QueryLRUHistoryConfigDef normal = 1;
    QueryLRUHistoryConfigDef error = 2;
    int64 sample_interval_us = 3;
}

message QueryRpcInfo {
    string arpc_method = 1;
    string http_path = 2;
    string client_ip = 3;
    bool is_http = 4;
    bool navi_web_query = 5;
}

message QuerySampleDef {
    SessionIdDef session = 1;
    QueryRpcInfo rpc_info = 2;
    uint64 query_hash = 3;
    int64 response_size = 4;
    NaviErrorDef error = 5;
    int64 begin_time_us = 6;
    int64 end_time_us = 7;
    int64 dup_count = 8;
    int64 queue_us = 9;
    int64 compute_us = 10;
    int64 last_begin_time_us = 11;
    int64 last_end_time_us = 12;
    string query_key = 13;
}

message QueryLRUEntryDef {
    repeated QuerySampleDef querys = 1;
}

message QueryLRUHistoryDef {
    repeated QueryLRUEntryDef entrys = 1;
}

message QueryHistoryDef {
    QueryHistoryConfigDef config = 1;
    QueryLRUHistoryDef normal = 2;
    QueryLRUHistoryDef error = 3;
}

message NaviHistoryDef {
    UpdateHistoryDef update = 1;
    QueryHistoryDef query = 2;
    SymbolTableDef symbol_table = 3;
}

message GraphVisNodeDef {
    int32 version = 1;
    SingleResultLocationDef location = 2;
    GraphResultDef result = 3;
    map<string, GraphVisNodeDef> sub_results = 4;
    SymbolTableDef symbol_table = 5;
    bytes user_result = 6;
    NaviSummaryDef navi_summary = 7;
    NaviHistoryDef navi_history = 8;
}

message GraphVisDef {
    repeated GraphVisNodeDef nodes = 1;
}
