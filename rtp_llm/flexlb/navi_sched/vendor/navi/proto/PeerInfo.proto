syntax = "proto3";

package navi;
option cc_enable_arenas = true;

message PartInfoDef
{
    int32 part_count = 1;
    repeated int32 part_ids = 2;
}

message PeerInfo
{
    int32 graph_id = 1;
    PartInfoDef part_info = 2;
}

message GigInfoDef
{
    bool enable_probe = 1;
    map<string, int32> tags = 2;
}

message DirectLocationDef
{
    string host = 1;
    int32 grpc_stream_port = 2;
}

message LocationDef
{
    string biz_name = 1;
    PartInfoDef part_info = 2;
    int32 this_part_id = 3;
    GigInfoDef gig_info = 4;
    DirectLocationDef direct_location = 5;
}
