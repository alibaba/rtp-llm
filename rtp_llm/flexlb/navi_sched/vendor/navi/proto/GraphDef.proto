syntax = "proto3";

import "proto/PeerInfo.proto";

package navi;
option cc_enable_arenas = true;

message TraceBtFilter
{
    string file = 1;
    int32 line = 2;
}

message BuildinAttrs
{
    bool skip_config = 1;
    bool skip_init = 2;
    bool stop_after_init = 3;
    bool skip_delete_kernel = 4;
}

enum NodeType {
    NT_NORMAL = 0;
    NT_SPLIT = 1;
    NT_MERGE = 2;
    NT_RESOURCE = 3;
    NT_FORK = 4;
    NT_TERMINATOR = 5;
    NT_FAKE_SPLIT = 6;
    NT_FAKE_MERGE = 7;
    NT_SCOPE_TERMINATOR = 8;
    NT_SCOPE_TERMINATOR_SPLIT = 9;
    NT_UNKNOWN = 10;
};

message NodeDef
{
    string name = 1;
    string kernel_name = 2;
    bytes json_attrs = 3;
    map<string, bytes> binary_attrs = 4;
    map<string, int64> integer_attrs = 5;
    string device = 6;
    BuildinAttrs buildin_attrs = 7;
    NodeType type = 8;
    int32 scope = 9;
    bool is_scope_border = 10;
    repeated int64 integer_array_attrs = 11;
}

message NodePortDef
{
    string node_name = 1;
    string port_name = 2;
    int32 node_id = 3;
}

message BackPressureQueueDef {
    int64 queue_low = 1;
    int64 queue_high = 2;
}

message EdgeQueueDef {
    BorderIdDef dest_border = 1;
    int32 dest_edge_id = 2;
    BackPressureQueueDef queue = 3;
}

message EdgeDef
{
    NodePortDef input = 1;
    NodePortDef output = 2;
    bool require = 3;
    int64 timeout_ms = 4;
    repeated int32 select_index = 5;
    int32 edge_index = 6;
}

message EdgeParamDef {
    int32 index = 1;
    bool require = 2;
    int64 timeout_ms = 3;
}

message ParamEdgeInfoDef {
    repeated EdgeParamDef edge_params = 1;
}

message BorderIdDef {
    int32 graph_id = 1;
    int32 peer = 2;
    int32 io_type = 3;
}

message BorderEdgeDef
{
    int32 edge_id = 1;
    EdgeDef edge = 2;
    int32 peer_edge_id = 5;
    string node = 6;
    EdgeQueueDef queue = 7;
    int32 node_id = 8;
}

message BorderDef
{
    int32 io_type = 1;
    PeerInfo peer = 2;
    repeated BorderEdgeDef edges = 3;
}

message SessionIdDef
{
    uint64 instance = 1;
    uint64 query_id = 2;
    uint64 current_instance = 3;
}

enum ErrorHandleStrategy {
    EHS_ERROR_AS_FATAL = 0;
    EHS_ERROR_AS_EOF = 1;
}

message SubGraphOption {
    bool inline_mode = 1;
    bool ignore_isolate = 2;
    ErrorHandleStrategy error_handle_strategy = 3;
    int64 timeout_ms = 4;
}

message GraphCounterInfo {
    int64 next_graph_id = 1;
    int64 next_edge_id = 2;
}

message ResourceReplaceInfoDef {
    string from = 1;
    string to = 2;
}

message SubGraphScopeDef {
    int32 id = 1;
    bool has_terminator = 2;
    ErrorHandleStrategy error_handle_strategy = 3;
}

message SubGraphDef
{
    int32 graph_id = 1;
    repeated NodeDef nodes = 2;
    repeated EdgeDef edges = 3;
    LocationDef location = 4;
    repeated BorderDef borders = 5;
    SubGraphOption option = 6;
    map<string, bytes> binary_attrs = 7;
    repeated SubGraphScopeDef scopes = 8;
    int32 next_scope_id = 9;
    repeated ResourceReplaceInfoDef replace_infos = 10;
    uint64 hash_key = 11;
    ParamEdgeInfoDef param_edge_info = 12;
}

message GraphDef
{
    int64 version = 1;
    repeated SubGraphDef sub_graphs = 2;
    GraphCounterInfo counter_info = 3;
    BackPressureQueueDef back_pressure_queue = 4;
}
