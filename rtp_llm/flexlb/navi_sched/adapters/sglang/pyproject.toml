[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navi-sched-sglang"
version = "0.1.0"
description = "NaviSched adapter for SGLang"
requires-python = ">=3.11"
dependencies = ["navi-sched>=0.1.0", "sglang==0.5.23", "msgspec"]

[project.entry-points."sglang.srt.plugins"]
navi_sched = "navi_sched.adapters.sglang.NaviSchedSGLangPlugin:register"

[tool.setuptools]
packages = ["navi_sched.adapters.sglang"]
package-dir = {"navi_sched.adapters.sglang" = "."}
