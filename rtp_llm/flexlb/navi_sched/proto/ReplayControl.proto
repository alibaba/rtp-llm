syntax = "proto2";

import "arpc/proto/rpc_extensions.proto";

package navi_sched;

option cc_generic_services = true;

message ReplayControlRequest {
    optional string action = 1;
    optional string mode = 2;
    optional int64 start_time_us = 3;
    optional int64 end_time_us = 4;
    optional int64 duration_ms = 5;
    optional double total_qps = 6;
    optional uint64 loop_count = 7;
    optional string history_mode = 8;
    optional uint64 recent_query_count = 9;
}

message ReplayHistoryClient {
    optional string client_id = 1;
    optional int64 earliest_event_time_us = 2;
    optional int64 latest_event_time_us = 3;
    optional uint64 sample_count = 4;
    optional bool replayable = 5;
    optional string status = 6;
    optional string error = 7;
    optional uint64 selection_generation = 8;
    optional uint64 selected_sample_count = 9;
    optional uint64 completed_selection_generation = 10;
}

message ReplayControlResponse {
    optional bool accepted = 1;
    optional string error = 2;
    optional uint64 generation = 3;
    optional string action = 4;
    optional string mode = 5;
    optional uint64 eligible_client_count = 6;
    optional double per_client_qps = 7;
    repeated ReplayHistoryClient clients = 8;
    optional string history_mode = 9;
    optional uint64 recent_query_count = 10;
    optional uint64 history_query_id = 11;
    optional uint64 expected_client_count = 12;
    optional uint64 responded_client_count = 13;
}

service ReplayControlService {
    option (arpc.global_service_id) = 6120;

    rpc replay_control(ReplayControlRequest) returns (ReplayControlResponse) {
        option (arpc.local_method_id) = 6121;
    }
}
