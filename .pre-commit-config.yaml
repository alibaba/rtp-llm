repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
      - id: trailing-whitespace

    # Formatters
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black
        exclude: ^rtp_llm/flexlb/tools/online_eval/
        types_or: [python]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: ^rtp_llm/flexlb/tools/online_eval/
        args: ["--profile=black"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: ^rtp_llm/cpp/cutlass/

  - repo: local
    hooks:
      - id: online-eval-quality
        name: online_eval quality
        entry: python rtp_llm/flexlb/tools/online_eval/scripts/commands/check_quality.py
        language: system
        pass_filenames: false
        files: ^rtp_llm/flexlb/tools/online_eval/

exclude: ^rtp_llm/ops|^3rdparty