repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
      - id: trailing-whitespace

    # Formatters
  - repo: local
    hooks:
      - id: flexlb-java-conventions
        name: Check FlexLB Java member order and changed-class Javadoc
        entry: python rtp_llm/flexlb/tools/check_flexlb_java.py
        language: python
        additional_dependencies:
          - tree-sitter==0.23.2
          - tree-sitter-java==0.23.5
        files: ^rtp_llm/flexlb/.*\.java$
        stages: [pre-commit]
        require_serial: true

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.8.0
    hooks:
      - id: black
        types_or: [python]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: ^rtp_llm/cpp/cutlass/

exclude: ^rtp_llm/ops|^3rdparty
