name: online_eval quality

on:
  pull_request:
    paths:
      - 'rtp_llm/flexlb/**'
      - '.github/workflows/online-eval-quality.yml'
  push:
    branches: ['codex/**', main]
    paths:
      - 'rtp_llm/flexlb/**'
      - '.github/workflows/online-eval-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rtp_llm/flexlb/tools/online_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-quality.txt
      - run: python scripts/commands/check_quality.py
      - name: Install Prometheus
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.2.1/prometheus-3.2.1.linux-amd64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "PROMETHEUS_BIN=$RUNNER_TEMP/prometheus-3.2.1.linux-amd64/prometheus" >> "$GITHUB_ENV"
      - run: python -m pytest -q -ra

  mock-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python -m pip install -r rtp_llm/flexlb/tools/online_eval/requirements.txt
      - run: python -m unittest discover -s rtp_llm/flexlb/tools/mock_bundle -p 'test_*.py'
      - name: Verify Master and Mock behavior, including registered Python presets
        working-directory: rtp_llm/flexlb
        run: ./mvnw -P'opensource,!internal' -pl flexlb-mock-engine -am test
