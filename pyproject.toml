]
version = 1
default_pytest_cli = "-v --tb=short --timeout=300"

[tool.rtp_llm.pytest_ci.profiles.perf_cuda13]
description = "Mainline DSV4 model and kernel performance workloads"
gpu_type = "L20D_TEST"
