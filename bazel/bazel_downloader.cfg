# Bazel downloader rewrite: routes github.com-style URLs to our own public bucket, keeping the
# upstream as a same-byte backstop.
# code: https://github.com/bazelbuild/bazel/blob/master/src/main/java/com/google/devtools/build/lib/bazel/repository/downloader/UrlRewriterConfig.java
#
# The same pattern written twice = two candidates; Bazel tries them in order.
# This is **same-byte redundancy**, not different-source substitution: the archive's sha256 is
# pinned at the declaration site; switching candidate URLs cannot produce different bytes.
# "Forgot to publish to the bucket" is caught before commit by `scripts/rtpcli deps verify`,
# not discovered via runtime errors.
#
# bcr.bazel.build is not rewritten here: ordered fallback for registry metadata is already
# handled by the two --registry lines in .bazelrc. If bcr were rewritten back to our bucket
# here, the second --registry candidate would be turned back into the first and the fallback
# would break (Bazel 7.7.1~9.0.0 reads the registry using only the first rewritten URL, so a
# rewrite cannot carry its own fallback).

rewrite (github\.com)/(.*) https://rtp-opensource.oss-cn-hangzhou.aliyuncs.com/archives/github.com/$2
rewrite (github\.com)/(.*) https://$1/$2
